<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0B3C49">
<title>Rx Steward</title>
<style>
  :root{
    --ink:#12242A; --teal-d:#0B3C49; --teal:#116E7C; --sea:#1FA8A0;
    --navy:#1A3C5E; --muted:#5A6B70; --line:#E2EBF3; --mist:#F4F7F8;
    --access:#1B9E5A; --watch:#D97706; --reserve:#C0392B;
    --s-hi-bg:#C4E9D4; --s-hi-fg:#0B5B34; --s-md-bg:#E6F0C6; --s-md-fg:#4A5B0B;
    --s-lo-bg:#FBE1BF; --s-lo-fg:#8A5410; --s-vl-bg:#F7CBC6; --s-vl-fg:#8A2018;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#fff; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.4; -webkit-text-size-adjust:100%;}
  a{color:var(--teal);}
  .wrap{max-width:960px; margin:0 auto; padding:0 14px 96px;}

  .topbar{position:sticky; top:0; z-index:60; background:var(--teal-d); color:#fff;
    display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 14px;}
  .brand{font-weight:800; font-size:1.02rem; letter-spacing:.3px; display:flex; flex-direction:column; justify-content:center; flex:0 0 auto;}
  .brand .bt{white-space:nowrap; display:flex; align-items:center; gap:7px;}
  .brand small{font-weight:500; font-size:.6rem; color:#9FC3C9; letter-spacing:.2px; margin-top:1px;}
  @media(max-width:560px){ .brand small{display:none;} }
  .scope-wrap{display:flex; align-items:center; gap:6px;}
  .scope-wrap label{font-size:.6rem; color:#9FC3C9; text-transform:uppercase; letter-spacing:.05em;}
  select.scope{background:#0E5563; color:#fff; border:1px solid #1B6675; border-radius:8px; padding:6px 8px; font-size:.8rem; font-weight:600;}

  /* Tab bar */
  .tabbar{position:sticky; top:52px; z-index:55; display:flex; gap:6px; background:#fff;
    border-bottom:1px solid var(--line); padding:8px 14px; max-width:960px; margin:0 auto;}
  .tab{flex:1; text-align:center; padding:9px 6px; border-radius:9px; border:1px solid transparent;
    background:#fff; color:var(--muted); font-weight:700; font-size:.86rem; cursor:pointer; white-space:nowrap;}
  .tab .ic{font-size:1rem;}
  .tab:hover{background:var(--mist);}
  .tab.active{background:var(--teal); color:#fff;}

  .search{padding:12px 0 8px;}
  .search input{width:100%; padding:12px 14px; font-size:1rem; border:1.5px solid var(--line); border-radius:12px; background:var(--mist); outline:none;}
  .search input:focus{border-color:var(--sea); background:#fff;}
  .legend{display:flex; flex-wrap:wrap; gap:12px; font-size:.72rem; color:var(--muted); padding:4px 2px 0;}
  .legend b{font-weight:600;}
  .dot{display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:middle; margin-right:3px;}

  /* collapsible condition groups */
  details.cgroup{margin:9px 0; border:1px solid var(--line); border-radius:11px; overflow:hidden;}
  details.cgroup>summary{list-style:none; cursor:pointer;}
  details.cgroup>summary::-webkit-details-marker{display:none;}
  .grp-head{display:flex; align-items:center; gap:8px; font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:13px 14px;}
  .grp-phc{background:#ECFDF5; color:#065F46;} .grp-hosp{background:#EFF6FF; color:#1E40AF;} .grp-icu{background:#FFF1F2; color:#991B1B;}
  .grp-head .cnt{opacity:.6; font-weight:700;}
  .grp-head::after{content:"▸"; margin-left:auto; font-size:.85rem; opacity:.7;}
  details.cgroup[open]>summary .grp-head::after{content:"▾";}
  .cglist{padding:8px;}
  .cond{display:flex; align-items:center; gap:9px; width:100%; text-align:left; padding:11px 12px; border:1px solid #EEF2F7; border-radius:9px; background:#fff; margin-bottom:6px; cursor:pointer; font-size:.95rem; color:var(--navy); font-weight:500;}
  .cond:hover{background:#EBF3FB; border-color:#CFE3F5;}
  .cond .nm{flex:1 1 auto;} .cond .star{color:#E9A23B;} .cond .chev{color:#B7C6CE; flex:0 0 auto;}
  .ctag{font-size:.56rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:3px 6px; border-radius:4px; flex:0 0 auto;}
  .ctag-phc{background:#D1FAE5; color:#065F46;} .ctag-hosp{background:#DBEAFE; color:#1E40AF;} .ctag-icu{background:#FEE2E2; color:#991B1B;}
  .sugg-head{font-size:.72rem; color:var(--muted); margin:2px 2px 8px; font-weight:600;}
  .no-hits{color:var(--muted); padding:20px 6px; font-size:.9rem;}

  .back{display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid var(--line); border-radius:9px; padding:8px 13px; font-size:.88rem; font-weight:600; color:var(--teal-d); cursor:pointer; margin:12px 0 6px;}
  .tag{display:inline-block; font-size:.62rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:2px 8px; border-radius:4px; vertical-align:middle;}
  .tag-phc{background:#D1FAE5; color:#065F46;} .tag-hosp{background:#DBEAFE; color:#1E40AF;} .tag-icu{background:#FEE2E2; color:#991B1B;}
  h1.cond-title{font-size:1.32rem; font-weight:800; color:var(--navy); margin:8px 0 4px; line-height:1.25;}
  .cond-meta{font-size:.78rem; color:var(--muted); margin-bottom:12px;}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 4px;}
  .chip{font-size:.72rem; font-weight:600; padding:3px 9px; border-radius:20px; border:1px solid;}
  .chip-bact{background:#EFF6FF; color:#1E40AF; border-color:#BFD7F5;}
  .chip-viral{background:#FEF7ED; color:#9A3412; border-color:#FCD9B0;}
  .chip-fungal{background:#F5F0FF; color:#6B21A8; border-color:#DCC9F5;}
  .chip-para{background:#F0FDF4; color:#166534; border-color:#BBE9C8;}
  .sec-label{font-size:.7rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#8FA3B8; margin:20px 0 8px;}

  /* Antibiogram */
  .abg-card{border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:6px;}
  .abg-top{display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--teal-d); color:#fff; padding:10px 13px;}
  .abg-top .t{font-weight:700; font-size:.92rem;} .abg-top .s{font-size:.66rem; color:#A9CED4;}
  .abg-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table.abg{border-collapse:separate; border-spacing:0; width:100%; font-size:.74rem; table-layout:fixed;}
  table.abg th, table.abg td{padding:5px 3px; text-align:center; white-space:nowrap; border-bottom:1px solid #EEF2F7; width:40px; overflow:hidden;}
  table.abg thead th{position:sticky; top:0; background:#F2F7F8; color:var(--teal-d); font-weight:700; font-size:.58rem; line-height:1.06; white-space:normal; border-bottom:2px solid #DDE7E9;}
  table.abg thead th .aw{display:block; font-size:.56rem; font-weight:700; margin-top:1px;}
  table.abg th.org, table.abg td.org{position:sticky; left:0; z-index:2; background:#fff; text-align:left; box-shadow:2px 0 0 #EEF2F7; width:96px; min-width:96px; max-width:96px; white-space:normal;}
  table.abg thead th.org{z-index:3; background:#F2F7F8;}
  td.org .on{font-weight:700; color:var(--navy); font-size:.74rem; font-style:italic; line-height:1.15; display:block;}
  td.org .ol{display:block; font-size:.6rem; font-style:normal; color:var(--muted); margin-top:1px;}
  td.cell{font-weight:700;} td.cell.best{outline:2px solid #0B5B34; outline-offset:-3px; border-radius:4px;}
  td.na{color:#C2CDD1; font-weight:500;}
  .s-hi{background:var(--s-hi-bg); color:var(--s-hi-fg);} .s-md{background:var(--s-md-bg); color:var(--s-md-fg);}
  .s-lo{background:var(--s-lo-bg); color:var(--s-lo-fg);} .s-vl{background:var(--s-vl-bg); color:var(--s-vl-fg);}
  .abg-legend{display:flex; flex-wrap:wrap; gap:10px; font-size:.68rem; color:var(--muted); padding:9px 13px; background:#FaFBFB;}
  .abg-legend span{display:inline-flex; align-items:center; gap:4px;}
  .sw{width:13px; height:13px; border-radius:3px; display:inline-block;}
  .abg-note{font-size:.7rem; color:var(--muted); padding:0 13px 11px; background:#FaFBFB;}
  .abg-empty{padding:16px 13px; color:var(--muted); font-size:.85rem;}

  .drug{border:1px solid var(--line); border-left:4px solid var(--access); border-radius:9px; padding:11px 13px; margin-bottom:9px; background:#fff;}
  .drug.watch{border-left-color:var(--watch);} .drug.reserve{border-left-color:var(--reserve);}
  .drug .dn{font-weight:700; color:var(--navy); font-size:.98rem;}
  .badge{display:inline-block; font-size:.64rem; font-weight:800; padding:1px 7px; border-radius:4px; margin-left:7px; vertical-align:middle;}
  .b-A{background:#D1FAE5; color:#065F46;} .b-W{background:#FEF3C7; color:#92400E;} .b-R{background:#FEE2E2; color:#991B1B;}
  .drug .dd{font-size:.85rem; color:#374151; margin-top:4px; line-height:1.5;}
  .drug .dd .paed{background:#FEF7E6; border-radius:4px; padding:0 3px; font-weight:600;}
  .drug .rl{font-size:.78rem; color:#4B5563; margin-top:7px; padding-top:6px; border-top:1px solid #EEF2F7; display:flex; flex-wrap:wrap; gap:4px 12px;}

  details.panel{border:1px solid var(--line); border-radius:9px; margin:8px 0; overflow:hidden;}
  details.panel>summary{padding:11px 13px; font-weight:600; font-size:.9rem; color:var(--teal-d); cursor:pointer; list-style:none; background:#FaFBFB;}
  details.panel>summary::-webkit-details-marker{display:none;}
  details.panel>summary::before{content:"▸ "; color:var(--sea);} details.panel[open]>summary::before{content:"▾ ";}
  details.panel .body{padding:11px 13px; font-size:.86rem; color:#374151;}
  details.panel .body .ctx{margin:0 0 6px; padding-left:2px;}
  .warn{background:#FFF7ED; border:1px solid #FCD9B0; color:#9A3412; border-radius:9px; padding:11px 13px; margin:10px 0; font-size:.86rem;}
  .rf-grid{display:grid; grid-template-columns:1fr 1fr; gap:5px 12px;}
  @media(max-width:560px){ .rf-grid{grid-template-columns:1fr;} }
  .rf-grid label{font-size:.8rem; color:#374151; display:flex; gap:6px; align-items:flex-start; cursor:pointer;}
  .rf-flag{background:#FEF3C7; border:1px solid #FCD9B0; color:#92400E; border-radius:8px; padding:8px 11px; margin:6px 0; font-size:.8rem;}

  /* Drug library filters + chips */
  .filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:10px 0;}
  .fchip{font-size:.78rem; font-weight:700; padding:6px 12px; border-radius:20px; border:1.5px solid var(--line); background:#fff; cursor:pointer; color:var(--muted);}
  .fchip.on-A{background:#D1FAE5; color:#065F46; border-color:#8FE0B4;}
  .fchip.on-W{background:#FEF3C7; color:#92400E; border-color:#F3D07A;}
  .fchip.on-R{background:#FEE2E2; color:#991B1B; border-color:#F3AFAF;}
  .filters select, .filters input{padding:8px 10px; border:1.5px solid var(--line); border-radius:9px; font-size:.85rem; background:#fff;}
  .filters input{flex:1 1 160px; min-width:120px;}
  .lib-card{border:1px solid var(--line); border-left:5px solid var(--access); border-radius:10px; margin-bottom:8px; overflow:hidden;}
  .lib-card.W{border-left-color:var(--watch);} .lib-card.R{border-left-color:var(--reserve);}
  .lib-sum{display:flex; align-items:center; gap:8px; padding:11px 13px; cursor:pointer; list-style:none;}
  .lib-sum::-webkit-details-marker{display:none;}
  .lib-sum .nm{font-weight:700; color:var(--navy); flex:1 1 auto;}
  .lib-sum .cl{font-size:.74rem; color:var(--muted);}
  .lib-body{padding:0 13px 12px; font-size:.85rem; color:#374151;}
  .lib-body b{color:var(--navy);}
  .lib-body .meta{font-size:.78rem; color:var(--muted); margin:2px 0 8px;}

  /* Antibiogram explorer */
  .exp-head{font-weight:800; color:var(--navy); font-size:1.05rem; font-style:italic;}
  .exp-facts{font-size:.85rem; color:#374151; margin:4px 0;}
  .exp-note{background:var(--mist); border:1px solid var(--line); border-radius:9px; padding:10px 12px; font-size:.82rem; color:#374151; margin:8px 0;}
  .bar-row{display:flex; align-items:center; gap:8px; margin:3px 0; font-size:.8rem;}
  .bar-row .lab{flex:0 0 132px; text-align:right; color:var(--navy); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-row .aw{flex:0 0 16px; font-size:.6rem; font-weight:800;}
  .bar-wrap{flex:1 1 auto; background:#EEF2F4; border-radius:5px; height:20px; position:relative;}
  .bar-fill{height:100%; border-radius:5px; display:block;}
  .bar-val{position:absolute; right:6px; top:0; line-height:20px; font-size:.72rem; font-weight:700; color:#12242A;}
  .bar-fac{flex:0 0 auto; font-size:.7rem; color:var(--teal); font-weight:700; margin-left:4px;}
  .uploadbox{border:1.5px dashed var(--line); border-radius:10px; padding:12px; font-size:.82rem; color:var(--muted); margin-top:8px;}

  /* Log */
  .metrics{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:6px 0 14px;}
  @media(max-width:560px){ .metrics{grid-template-columns:repeat(2,1fr);} }
  .metric{background:var(--mist); border:1px solid var(--line); border-radius:11px; padding:12px;}
  .metric .v{font-size:1.6rem; font-weight:800; color:var(--teal);}
  .metric .l{font-size:.7rem; color:var(--muted); margin-top:2px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px 12px; margin:8px 0;}
  @media(max-width:560px){ .form-grid{grid-template-columns:1fr;} }
  .form-grid label, .fullrow label{font-size:.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:3px;}
  .form-grid input, .form-grid select, .fullrow input, .fullrow select{width:100%; padding:9px 10px; border:1.5px solid var(--line); border-radius:9px; font-size:.9rem; background:#fff;}
  .fullrow{margin:8px 0;}
  .drug-checks{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px;}
  .drug-checks label{display:inline-flex; align-items:center; gap:5px; font-size:.82rem; text-transform:none; letter-spacing:0; font-weight:500; color:#374151; background:var(--mist); border:1px solid var(--line); border-radius:8px; padding:5px 9px; margin:0;}
  .radio-row{display:flex; gap:14px; margin-top:4px;} .radio-row label{font-size:.85rem; text-transform:none; letter-spacing:0; font-weight:500; color:#374151; display:inline-flex; gap:5px; align-items:center;}
  .btn{display:inline-block; padding:10px 16px; border-radius:9px; border:none; font-weight:700; font-size:.9rem; cursor:pointer;}
  .btn-primary{background:var(--teal); color:#fff;} .btn-ghost{background:#fff; color:var(--reserve); border:1px solid var(--line);}
  .ok{background:#D1FAE5; color:#065F46; border:1px solid #8FE0B4; border-radius:9px; padding:9px 12px; font-size:.85rem; margin:8px 0;}
  table.logtbl{width:100%; border-collapse:collapse; font-size:.72rem;}
  table.logtbl th,table.logtbl td{border:1px solid #EEF2F7; padding:5px 7px; text-align:left; white-space:nowrap;}
  table.logtbl th{background:#F2F7F8; color:var(--teal-d);}
  .ref{margin:0 0 14px; font-size:.86rem;} .ref b{color:var(--navy);}
  .disclaimer{font-size:.68rem; color:#98A6AB; text-align:center; padding:22px 10px 0;}
  .subnav{display:flex; gap:6px; margin:12px 0;}
  .subnav button{flex:1; padding:8px; border:1px solid var(--line); background:#fff; border-radius:9px; font-weight:700; font-size:.82rem; color:var(--muted); cursor:pointer;}
  .subnav button.active{background:var(--teal-d); color:#fff; border-color:var(--teal-d);}
</style>
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RxSteward">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="bt">💊 Rx Steward</span><small>Antimicrobial stewardship · Uganda · v9.2‑web</small></div>
  <div class="scope-wrap">
    <label for="scope">Antibiogram</label>
    <select class="scope" id="scope">
      <option value="Uganda">Uganda (national)</option>
      <option value="East Africa">East Africa</option>
      <option value="Africa">Africa</option>
      <option value="Global">Global</option>
    </select>
  </div>
</div>
<div class="tabbar" id="tabbar">
  <button class="tab active" data-tab="adult"><span class="ic">👤</span> Adult</button>
  <button class="tab" data-tab="paed"><span class="ic">🧒</span> Paeds</button>
  <button class="tab" data-tab="amr"><span class="ic">🧫</span> Antimicrobials</button>
  <button class="tab" data-tab="log"><span class="ic">📋</span> Log</button>
</div>
<div class="wrap"><div id="view"></div>
  <div class="disclaimer">Clinical decision support only — aligned to Uganda Clinical Guidelines 2023 &amp; WHO AWaRe. Verify doses and local availability. Not a substitute for culture &amp; sensitivity where available.</div>
</div>

nes 2009","Lim WS, Baudouin SV, George RC, et al. BTS guidelines for the management of community acquired pneumonia in adults. Thorax. 2009;64(Suppl 3):iii1-iii55.","https://doi.org/10.1136/thx.2009.121434"],["qSOFA / Sepsis-3 2016","Singer M, Deutschman CS, Seymour CW, et al. The Third International Consensus Definitions for Sepsis and Septic Shock (Sepsis-3). JAMA. 2016;315(8):801-810.","https://doi.org/10.1001/jama.2016.0287"],["Duke criteria endocarditis","Li JS, Sexton DJ, Mick N, et al. Proposed modifications to the Duke criteria for the diagnosis of infective endocarditis. Clin Infect Dis. 2000;30(4):633-638.","https://doi.org/10.1086/313753"],["Tokyo Guidelines TG18 cholangitis","Miura F, Okamoto K, Takada T, et al. Tokyo Guidelines 2018: initial management of acute biliary infection and flowchart for acute cholangitis. J Hepatobiliary Pancreat Sci. 2018;25(1):31-40.","https://doi.org/10.1002/jhbp.509"],["IDSA Diabetic Foot 2023","Lipsky BA, Senneville E, Abbas ZG, et al. Guidelines on the diagnosis and treatment of foot infection in persons with diabetes. Clin Infect Dis. 2023;77(Suppl 1):S1-S28.","https://doi.org/10.1093/cid/ciad527"],["MASCC febrile neutropenia","Klastersky J, Paesmans M, Rubenstein EB, et al. The Multinational Association for Supportive Care in Cancer risk index. J Clin Oncol. 2000;18(16):3038-3051.","https://doi.org/10.1200/JCO.2000.18.16.3038"],["LRINEC necrotising fasciitis","Wong CH, Khin LW, Heng KS, et al. The LRINEC (Laboratory Risk Indicator for Necrotizing Fasciitis) score. Crit Care Med. 2004;32(7):1535-1541.","https://doi.org/10.1097/01.ccm.0000129486.35458.7d"],["IDSA/ATS HAP/VAP 2016","Kalil AC, Metersky ML, Klompas M, et al. Management of Adults With Hospital-acquired and Ventilator-associated Pneumonia: 2016 Clinical Practice Guidelines by the IDSA and ATS. Clin Infect Dis. 2016;63(5):e61-e111.","https://academic.oup.com/cid/article/63/5/e61/2237650"],["IDSA Catheter-related infection 2009","Mermel LA, Allon M, Bouza E, et al. Clinical Practice Guidelines for the Diagnosis and Management of Intravascular Catheter-Related Infection: 2009 Update by the IDSA. Clin Infect Dis. 2009;49(1):1-45.","https://academic.oup.com/cid/article/49/1/1/369414"],["WHO SSI Prevention 2018","Global guidelines for the prevention of surgical site infection, 2nd ed. Geneva: World Health Organization; 2018.","https://www.who.int/publications/i/item/9789241550475"],["AHA Infective Endocarditis 2015","Baddour LM, Wilson WR, Bayer AS, et al. Infective Endocarditis in Adults: Diagnosis, Antimicrobial Therapy, and Management of Complications. Circulation. 2015;132(15):1435-1486.","https://www.ahajournals.org/doi/10.1161/cir.0000000000000296"],["Brain abscess (NEJM 2014)","Brouwer MC, Tunkel AR, McKhann GM, van de Beek D. Brain Abscess. N Engl J Med. 2014;371(5):447-456.","https://www.nejm.org/doi/full/10.1056/NEJMra1301635"],["AAO Bacterial Keratitis PPP 2018","Lin A, Rhee MK, Akpek EK, et al; AAO Cornea/External Disease PPP Panel. Bacterial Keratitis Preferred Practice Pattern. Ophthalmology. 2019;126(1):P1-P55.","https://www.aaojournal.org/article/S0161-6420(18)32644-7/fulltext"],["Endophthalmitis Vitrectomy Study 1995","Endophthalmitis Vitrectomy Study Group. Results of the Endophthalmitis Vitrectomy Study. Arch Ophthalmol. 1995;113(12):1479-1496.","https://doi.org/10.1001/archopht.1995.01100120009001"]],"SYNDROMES":{"Upper respiratory tract infection (pharyngitis, sinusitis, otitis media)":{"setting":"Community","likely_pathogens":["Streptococcus pneumoniae","Haemophilus influenzae","Group A Streptococcus","Moraxella catarrhalis","Viral (majority)"],"first_line":[["Amoxicillin","Adult: 500mg–1g PO TDS × 5–7d  •  Paed: 80–90mg/kg/day PO ÷ TDS × 5–7d (max 3g/day)  [UCG aligned]","A"]],"second_line":[["Amoxicillin-clavulanate","Adult: 625mg PO TDS  •  Paed: 25–45mg/kg/day (amox component) PO ÷ BD–TDS × 5–7d (treatment failure / β-lactamase)  [UCG]","A"],["Azithromycin","Adult: 500mg D1 then 250mg D2–5  •  Paed: 10mg/kg D1 then 5mg/kg D2–5 PO (max 500mg D1) - penicillin allergy","W"],["Phenoxymethylpenicillin","Adult: 500mg PO BD × 10d  •  Paed: 12.5mg/kg PO QDS × 10d (GAS pharyngitis - rheumatic fever prevention)","A"]],"avoid":"Antibiotics for viral URTI. Amoxicillin if EBV suspected (rash). Routine antibiotics for mild AOM in children >2yr (watchful waiting 48h acceptable).","notes":"Most URTIs are viral - antibiotics rarely needed. AOM: defer 48h watchful waiting in children >2yr without severe features. GAS pharyngitis: confirm with Centor ≥3 + rapid strep where available. Penicillin allergy: macrolide.","recommended_tests":["Centor/McIsaac score (pharyngitis)","Rapid strep antigen (if available)","Otoscopy (AOM)","Tympanometry if recurrent AOM"],"clinical_score":"Centor (pharyngitis): Fever >38°C / Tonsillar exudate / Tender ant. cervical LN / No cough → ≥3 = bacterial likely. Otitis media SOS: Severe pain ≥48h / Otorrhoea / Systemic illness → treat."},"Community-acquired pneumonia (CAP)":{"setting":"Community / Hospital","likely_pathogens":["Streptococcus pneumoniae","Haemophilus influenzae","Mycoplasma pneumoniae","Chlamydia pneumoniae","Legionella spp.","Staphylococcus aureus (post-influenza)","Klebsiella pneumoniae"],"first_line":[["Amoxicillin","Adult: 500mg–1g PO Q8h × 5d  •  Paed: 80–90mg/kg/day PO ÷ TDS × 5d (mild/moderate)  [UCG first-line]","A"],["Benzylpenicillin","Adult: 2MU IV Q4–6h  •  Paed: 50,000IU/kg IV Q4–6h (severe, hospitalised)  [UCG first-line]","A"]],"second_line":[["Ceftriaxone","Adult: 1–2g IV OD  •  Paed: 50–80mg/kg IV OD × 7d (if no response at 48h)  [UCG second-line]","W"],["Doxycycline","Adult: 100mg PO BD × 7–10d  •  Paed (≥8yr): 2.2mg/kg PO BD × 7–10d; avoid <8yr (atypical/allergy)  [UCG alternative]","A"],["Ceftriaxone + Azithromycin","Adult: Ceftriaxone 2g IV OD + Azithromycin 500mg IV/PO OD  •  Paed: Ceftriaxone 50–80mg/kg + Azithromycin 10mg/kg D1 then 5mg/kg (severe/ICU - ATS/IDSA)","W+W"]],"avoid":"Empiric anti-MRSA cover (only if specific risk factors). Routine fluoroquinolones in children (cartilage risk).","notes":"Severity assessment (CURB-65/CRB-65) drives setting and antibiotic choice. UCG: amoxicillin/benzylpenicillin first-line. Atypical cover with macrolide if mycoplasma/legionella suspected. Severe CAP: cover atypicals with macrolide combo.","recommended_tests":["CXR (all suspected CAP) [UCG 2023]","FBC, CRP","Urea (CURB-65)","Sputum Gram stain + C&S (severe/treatment failure)","Blood cultures × 2 (severe)","HIV test [UCG 2023]","SpO2 - all patients"],"clinical_score":"CURB-65: Confusion / Urea>7mmol/L / RR≥30 / BP<90 syst or ≤60 diast / Age≥65 → 0–1 outpatient · 2 ward · ≥3 ICU. CRB-65 (no urea, for community use): 0 outpatient · 1–2 consider hospital · 3–4 hospital/ICU. [BTS 2009]"},"Hospital-acquired / ventilator-associated pneumonia (HAP/VAP)":{"setting":"Hospital / ICU","likely_pathogens":["Pseudomonas aeruginosa","Klebsiella pneumoniae (ESBL)","Escherichia coli (ESBL)","Acinetobacter baumannii","Staphylococcus aureus (MRSA)","Stenotrophomonas maltophilia"],"first_line":[["Piperacillin-tazobactam","Adult: 4.5g IV Q6h  •  Paed: 100mg/kg (pip) IV Q8h (max 4.5g/dose)","W"],["Meropenem","Adult: 1g IV Q8h  •  Paed: 20mg/kg IV Q8h (max 1g/dose) - ESBL/high-resistance risk","W"]],"second_line":[["Cefepime + Amikacin","Adult: Cefepime 2g IV Q8h + Amikacin 15mg/kg OD  •  Paed: Cefepime 50mg/kg Q8h + Amikacin 15mg/kg OD","W+A"],["Meropenem + Colistin","Adult: Meropenem 2g IV Q8h + Colistin 9MU loading then 4.5MU Q12h  •  Paed: Meropenem 40mg/kg Q8h + Colistin 75,000–150,000 IU/kg/day ÷ Q8h (CRE/CRAB suspected - specialist input)","W+R"]],"avoid":"Anaerobic cover unless aspiration suspected. Aminoglycoside monotherapy. De-escalate within 48–72h based on cultures.","notes":"Define onset: HAP >48h post-admission; VAP >48h post-intubation. Empiric cover must include Pseudomonas + MRSA risk assessment. De-escalate based on AST. Carbapenem use should always be culture-justified within 72h. Consider local antibiogram.","recommended_tests":["CXR (new infiltrate)","Tracheal aspirate or BAL Gram stain + C&S","Blood cultures × 2","CRP, procalcitonin (if available)","SpO2 / ABG if hypoxic"],"clinical_score":"CPIS (Clinical Pulmonary Infection Score) ≥6 supports VAP. Sequential cultures help de-escalate. PIRO (Predisposition, Infection, Response, Organ) for ICU prognosis."},"Lung abscess / empyema":{"setting":"Hospital","likely_pathogens":["Oral anaerobes (Prevotella, Fusobacterium)","Streptococcus anginosus group","Staphylococcus aureus","Klebsiella pneumoniae","Mycobacterium tuberculosis (chronic)"],"first_line":[["Amoxicillin-clavulanate","Adult: 1.2g IV TDS  •  Paed: 30mg/kg (amox component) IV Q8h  [UCG aligned]","A"]],"second_line":[["Ceftriaxone + Metronidazole","Adult: Ceftriaxone 2g IV OD + Metronidazole 500mg IV TDS  •  Paed: Ceftriaxone 50–80mg/kg OD + Metronidazole 7.5mg/kg Q8h IV","W+A"],["Clindamycin","Adult: 600mg IV Q8h  •  Paed: 10mg/kg IV Q6–8h (good lung penetration)","A"]],"avoid":"Routine drainage of small abscesses <4cm (try medical first). Aminoglycosides (poor lung penetration). Surgical resection too early (try 4–6 weeks Rx first).","notes":"Treat 4–6 weeks (IV → PO once apyrexial). Drainage essential if empyema (chest tube). Exclude TB. Dental review for source control. Consider HIV testing.","recommended_tests":["CXR / CT chest (cavity, fluid level)","Sputum Gram + C&S (incl. anaerobic transport)","Blood cultures × 2","Pleural tap if effusion (pH, glucose, LDH, Gram, C&S)","HIV test","TB workup (GeneXpert sputum)"],"clinical_score":"Light's criteria for exudate: Pleural/serum protein >0.5 OR pleural/serum LDH >0.6 OR pleural LDH >2/3 upper normal serum. Empyema if pH<7.2, glucose<2.2, LDH>1000 → chest tube."},"Pertussis (whooping cough)":{"setting":"Community","likely_pathogens":["Bordetella pertussis"],"first_line":[["Azithromycin","Adult: 500mg D1 then 250mg D2–5 PO  •  Paed: 10mg/kg/day × 5d (infants 1–6 mo: 10mg/kg OD × 5d; <1 mo: 10mg/kg OD × 5d - preferred)","W"]],"second_line":[["Erythromycin","Adult: 500mg PO QDS × 14d  •  Paed: 12.5mg/kg PO QDS × 14d (avoid <1 mo - IHPS risk)","A"],["Co-trimoxazole","Adult: 960mg PO BD × 14d  •  Paed: 24mg/kg PO BD × 14d (macrolide contraindicated/unavailable)","A"]],"avoid":"Erythromycin in neonates (infantile hypertrophic pyloric stenosis risk). Cough suppressants in children. Beta-agonists (no benefit).","notes":"Treatment most effective in catarrhal phase. Notifiable disease. Treat household contacts. DTP vaccination is primary prevention. Children <1yr: hospitalise - apnoea/cyanosis risk.","recommended_tests":["NP swab for Bordetella PCR (preferred) or culture","FBC (lymphocytosis classic in children)","CXR if pneumonia suspected","HIV test if recurrent"],"clinical_score":"Clinical case definition (WHO): cough ≥2 weeks WITH paroxysms, inspiratory whoop, or post-tussive vomiting; OR apnoea in infants <1yr. Severity: cyanosis, apnoea, feeding difficulty → admit."},"Tuberculosis - drug-susceptible (pulmonary & most extrapulmonary)":{"setting":"Community / Hospital","likely_pathogens":["Mycobacterium tuberculosis complex"],"first_line":[["Standard short-course: 2RHZE / 4RH","Adult: Weight-based FDC × 2 months RHZE (Rifampicin + Isoniazid + Pyrazinamide + Ethambutol) then 4 months RH PO OD  •  Paed: weight-band paed FDC RHZ × 2mo then RH × 4mo (R 15mg/kg, H 10mg/kg, Z 35mg/kg; add E 20mg/kg if HIV+ or smear-positive)  [WHO 2022; NTLP Uganda 2023]","A"]],"second_line":[["Bedaquiline + Pretomanid + Linezolid (BPaL) - for MDR/RR-TB","Adult: BPaL × 6 months (MDR/XDR) - programmatic care + ECG monitoring  •  Paed (≥14yr in some programmes; ≥6yr emerging WHO 2024): specialist input  [WHO 2022]","R/W"],["Levofloxacin-based longer regimen (MDR-TB)","Adult: 18 months MDR-TB per WHO 2022 longer regimen  •  Paed: weight-band Lfx 15–20mg/kg OD + companion drugs - specialist","W"],["Isoniazid preventive therapy (TPT)","Adult: INH 300mg PO OD × 6mo (6H) OR Rifapentine+INH weekly × 12 weeks (3HP)  •  Paed: INH 10mg/kg OD × 6mo for HIV+ contacts / child contacts <5yr; 3HP from age ≥2yr  [WHO TPT 2020]","A"]],"avoid":"Empiric TB treatment without microbiological/molecular confirmation where Xpert available. Aminoglycoside-based regimens (preferred linezolid/bedaquiline). Pyrazinamide in 1st trimester pregnancy (relative). Ethambutol <5yr unless essential (visual monitoring impossible). Streptomycin in children unless no alternative.","notes":"WHO 2022 case definition: bacteriologically confirmed (Xpert MTB/RIF positive OR culture-positive OR smear-positive) OR clinically diagnosed. PULMONARY TB: cough ≥2 weeks + ≥1 of fever, weight loss, night sweats, haemoptysis. EXTRAPULMONARY TB: site-specific (LN, pleural, abdominal, spinal, GU). DS-TB: 6-month regimen 2RHZE/4RH (treatment success >85%). HIV co-infection: start ART within 2–8 weeks (immediate if CD4<50). DOT essential. Pyridoxine 25–50mg OD with INH to prevent peripheral neuropathy (HIV+, malnourished, pregnant).","recommended_tests":["GeneXpert MTB/RIF sputum (gastric aspirate paeds; 2 hour result + rifampicin resistance) [WHO 2022]","Sputum smear (Ziehl-Neelsen) × 2","Culture + DST (severe, MDR-suspect, treatment failure)","CXR","HIV test (mandatory)","LFTs baseline + monthly","CD4 + viral load (HIV+)","ECG if bedaquiline/moxifloxacin/clofazimine (QTc)","Visual acuity + colour vision if ethambutol"],"clinical_score":"Treatment monitoring (WHO 2022): sputum smear at month 2 + 5 + 6. Positive M2 → check adherence + DST. Treatment success = cure + completion. Paeds Keith Edwards score where Xpert unavailable. Always treat clinically diagnosed TB even if smear-/Xpert-negative if strong clinical + radiological evidence. Multidrug-resistant TB (MDR-TB) = resistance to INH + RIF; Rifampicin-resistant (RR-TB) treated per MDR regimens.  [WHO Consolidated TB Guidelines 2022; NTLP Uganda]"},"Tuberculous meningitis / CNS TB":{"setting":"Hospital","likely_pathogens":["Mycobacterium tuberculosis complex"],"first_line":[["Intensive RHZE + Dexamethasone","Adult: Rifampicin 10mg/kg OD + Isoniazid 5mg/kg OD + Pyrazinamide 25mg/kg OD + Ethambutol 15mg/kg OD × 2 months  •  Paed: R 15mg/kg + H 10mg/kg + Z 35mg/kg + E 20mg/kg × 2 months  [WHO 2022; UCG 2023]","A"],["Continuation RH","Adult: Rifampicin 10mg/kg OD + Isoniazid 5mg/kg OD × 10 months (total 12 months)  •  Paed: R 15mg/kg + H 10mg/kg × 10 months - TOTAL 12 months for TBM","A"],["Dexamethasone (REDUCES MORTALITY)","Adult: 0.4mg/kg/day IV × week 1, taper over 6–8 weeks (Thwaites NEJM 2004)  •  Paed: 0.6mg/kg/day IV × 4 weeks then taper × 4 weeks - START WITH FIRST TB DOSE","-"]],"second_line":[["Linezolid (severe / intolerant of first-line)","Adult: 600mg PO OD added to regimen (CSF penetration good)  •  Paed: 10mg/kg Q8h (<12yr) or Q12h (≥12yr) - specialist input","R"],["Fluoroquinolone (Moxifloxacin or Levofloxacin)","Adult: Moxifloxacin 400mg PO OD added to regimen (severe / failed standard / pyrazinamide-intolerant)  •  Paed: Lfx 15–20mg/kg OD","W"],["MDR-TBM regimens (RR-TBM)","Adult/Paed: WHO 2022 longer regimens incl. bedaquiline + linezolid + clofazimine + cycloserine - specialist neuro-TB programme","R/W"]],"avoid":"Standard 6-month regimen (high relapse / mortality in TBM). Steroids without antibiotic cover. Aminoglycosides in renal impairment. Delay in starting empirical Rx if high clinical suspicion + lymphocytic CSF with low glucose + high protein.","notes":"WHO 2022 / British Infection Association case definition: lymphocytic CSF pleocytosis (50–500 cells, lymphocyte predominant), CSF glucose <2.2mmol/L (or CSF:serum ratio <0.4), CSF protein >1g/L, ± neurological signs (cranial nerve palsies, hemiparesis, ↓GCS, hydrocephalus). DURATION: 12 months total (2 months intensive RHZE + 10 months RH). DEXAMETHASONE PROVEN to reduce mortality (Thwaites NEJM 2004) - START with first TB dose, taper over 6–8 weeks. Hydrocephalus may need shunting. Stage III TBM (GCS<10 / focal signs) has mortality 40–80% even treated.","recommended_tests":["LP: opening pressure + cell count + protein + glucose + CSF GeneXpert MTB/Ultra + CSF AFB smear + CSF MGIT culture (gold standard)","Brain imaging (CT/MRI with contrast) - basal meningeal enhancement, hydrocephalus, tuberculomas","Serum + CSF cryptococcal antigen (rule out cryptococcal meningitis)","HIV test (mandatory; ART planning)","CD4 + viral load","LFTs baseline + 2-weekly","ECG (rifampicin + isoniazid drug interactions)","Visual acuity + colour vision if ethambutol"],"clinical_score":"British Medical Research Council (MRC) TBM staging:  •  STAGE I: GCS 15, no focal signs → best prognosis.  •  STAGE II: GCS 11–14 OR GCS 15 with focal neurology / cranial nerve palsy.  •  STAGE III: GCS ≤10 OR severe focal neurology (hemiplegia, paraplegia). Stage I mortality ~10–20%; Stage III 40–80%. Thwaites diagnostic score for adults (TBM vs bacterial meningitis): clinical + CSF + CT features → score >4 = TBM likely. CSF Xpert Ultra sensitivity ~70%, specificity ~97% (best initial test).  [Thwaites NEJM 2004; WHO 2022; UCG 2023]"},"Bacterial meningitis":{"setting":"Hospital (Emergency)","likely_pathogens":["Streptococcus pneumoniae","Neisseria meningitidis","Haemophilus influenzae type b","Group B Streptococcus (neonates)","Escherichia coli (neonates)","Listeria monocytogenes (>50yr/immunocompromised)"],"first_line":[["Ceftriaxone","Adult: 2g IV BD  •  Paed: 100mg/kg/day IV ÷ BD (max 4g/day; for meningitis-specific high dose)  [UCG first-line]","W"],["+ Ampicillin (if >50yr or immunocompromised)","Adult: 2g IV Q4h  •  Paed: not applicable for >50yr indication - Listeria cover","A"],["+ Vancomycin (if pneumococcal resistance suspected)","Adult: 15–20mg/kg IV Q8–12h  •  Paed: 15mg/kg IV Q6h (max 4g/day)","W"]],"second_line":[["Meropenem","Adult: 2g IV Q8h  •  Paed: 40mg/kg IV Q8h (max 2g/dose) - allergy/resistant","W"],["Chloramphenicol","Adult: 1g IV Q6h  •  Paed: 25mg/kg IV Q6h (if ceftriaxone unavailable - E. Africa resource setting)","A"],["Dexamethasone (adjunctive)","Adult: 10mg IV Q6h × 4d  •  Paed: 0.15mg/kg IV Q6h × 2–4d - start 15min before/with first antibiotic","-"]],"avoid":"LP without CT first if focal signs/papilloedema/GCS<10. Delay of first antibiotic dose (>1h post-presentation increases mortality). Steroids after antibiotic started >4h.","notes":"GIVE ANTIBIOTICS WITHIN 1 HOUR. Dexamethasone 10mg IV BEFORE/WITH first dose (Hib/pneumococcus). LP after CT if focal signs. Notify public health (meningococcal). Chemoprophylaxis for close contacts (rifampicin/ciprofloxacin). HIV test.","recommended_tests":["LP (cell count, protein, glucose, Gram, culture, latex agglutination)","Blood cultures × 2 (BEFORE antibiotics)","FBC, U&E, glucose, CRP","CT head (if focal signs/papilloedema/GCS<10)","HIV test","CrAg if CD4<200"],"clinical_score":"CSF interpretation: Bacterial = PMN >100, protein >1g/L, glucose <2.2 (CSF:serum <0.4). Viral = lymphocytic, normal glucose. TB = lymphocytic, very low glucose, very high protein. Cryptococcal = lymphocytic, India ink/CrAg positive. Bacterial Meningitis Score (>2 features = ≥99% NPV for bacterial in children): CSF Gram+, CSF PMN ≥1000, CSF protein ≥80mg/dL, peripheral neutrophils ≥10,000, seizure."},"Brain abscess":{"setting":"Hospital (Neurosurgical)","likely_pathogens":["Streptococcus anginosus group","Oral/dental anaerobes","Staphylococcus aureus (post-trauma/neurosurgical)","Enterobacterales","Nocardia (immunocompromised)","Toxoplasma gondii (HIV+)"],"first_line":[["Ceftriaxone + Metronidazole","Adult: Ceftriaxone 2g IV BD + Metronidazole 500mg IV TDS  •  Paed: Ceftriaxone 50–80mg/kg IV BD + Metronidazole 7.5mg/kg IV Q8h (empiric)","W+A"]],"second_line":[["+ Vancomycin","Adult: 15–20mg/kg IV Q8–12h  •  Paed: 15mg/kg IV Q6h (post-surgical/MRSA)","W"],["+ Co-trimoxazole (Nocardia)","Adult: 5mg/kg (trimethoprim) IV Q6h  •  Paed: 5mg/kg (TMP) IV Q6h (Nocardia/immunocompromised)","A"],["Ceftriaxone + Metronidazole + Anti-toxoplasma","Adult: + Pyrimethamine 200mg LD then 50–75mg OD + Sulfadiazine 1g QDS + Folinic acid  •  Paed: pyrimethamine 2mg/kg D1 then 1mg/kg OD + sulfadiazine 50mg/kg BD (HIV+ with multiple lesions)","R/W"]],"avoid":"Aspiration without neurosurgical input. Empiric treatment >6 weeks without surgical drainage (if abscess >2.5cm). Steroids unless severe oedema.","notes":"Neurosurgical drainage often required (>2.5cm). Antibiotics 6–8 weeks IV. Imaging at 2 weeks then monthly. Dental review for source control. HIV+ with ring lesions: trial empiric toxoplasma 2 weeks → biopsy if no response.","recommended_tests":["CT/MRI head with contrast (ring-enhancing lesion)","Blood cultures × 2","Aspirate Gram stain + C&S + anaerobic (neurosurgical sample)","HIV test","Serum toxoplasma serology (if HIV+)","Echocardiogram (rule out endocarditis source)","CXR / dental panoramic","LP usually contraindicated (mass effect)"],"clinical_score":"Imaging follow-up at 2 weeks, then monthly. Surgical indications: size >2.5cm, multiloculated, gas-forming, near ventricles, deteriorating despite Rx. HIV+ ring lesions: 2 week trial toxoplasma Rx → biopsy if no response."},"Acute uncomplicated cystitis (lower UTI, female)":{"setting":"Community","likely_pathogens":["Escherichia coli (~80%)","Klebsiella pneumoniae","Staphylococcus saprophyticus (young women)","Proteus mirabilis","Enterococcus spp."],"first_line":[["Nitrofurantoin","Adult: 100mg PO QDS × 5d (immediate-release) or 100mg BD × 5d (sustained-release)  •  Paed (>1mo): 5–7mg/kg/day PO ÷ Q6h × 5d (max 400mg/day) - first-line in non-pregnant adults & children  [UCG 2023; IDSA UTI 2011]","A"]],"second_line":[["Fosfomycin","Adult: 3g PO single dose  •  Paed (≥12yr): 3g PO single dose; <12yr not standard","A"],["Co-trimoxazole","Adult: 960mg PO BD × 3d (only if local E. coli S% >80% - NOT reliable empirically in Uganda 15% S, Mayito 2024)  •  Paed: 24mg/kg PO BD × 3–5d","A"],["Cefalexin","Adult: 500mg PO QDS × 5–7d  •  Paed: 25–50mg/kg/day PO ÷ Q6–8h × 5–7d (pregnancy / penicillin alternative)","A"]],"avoid":"Ciprofloxacin / fluoroquinolones empirically (high resistance, collateral damage to microbiome - IDSA 2011 reserves for pyelonephritis). Nitrofurantoin in CrCl <30 (poor renal levels) or in pyelonephritis (no systemic levels). Co-trimoxazole in Uganda empirically (only 15%-S E. coli, Mayito 2024). Asymptomatic bacteriuria treatment (except pregnancy / pre-urological procedure).","notes":"IDSA UTI 2011 / UCG 2023 case definition for uncomplicated cystitis: dysuria + frequency + urgency ± suprapubic pain ± haematuria, in a non-pregnant immunocompetent female without structural/functional GU abnormality, no fever, no flank pain, no nausea/vomiting. If ANY are present → reclassify as complicated UTI / pyelonephritis. Empirical Rx without culture acceptable. Encourage hydration. ≤3-day course of TMP-SMX or 5-day nitrofurantoin equally effective for uncomplicated cystitis.","recommended_tests":["Urine dipstick (nitrites + leucocyte esterase - sensitivity ~75%)  [UCG 2023]","Urine C&S NOT routinely required for uncomplicated cystitis  [IDSA 2011]","Pregnancy test","Glucose if recurrent (rule out diabetes)"],"clinical_score":"IDSA 2011 case definition for UNCOMPLICATED cystitis: female + non-pregnant + immunocompetent + no structural/functional GU abnormality + no fever/flank pain/systemic features + duration <7d. EVERYTHING ELSE = complicated / pyelonephritis. Recurrent cystitis = ≥2 episodes/6 mo OR ≥3 episodes/12 mo → consider USS / urology referral + post-coital or low-dose prophylaxis. Asymptomatic bacteriuria treated only in: pregnancy, pre-urological surgery, neutropenia, renal transplant.  [Gupta et al. CID 2011; UCG 2023]"},"Pyelonephritis & complicated UTI":{"setting":"Community / Hospital","likely_pathogens":["Escherichia coli (~60% - often ESBL in complicated/healthcare-associated)","Klebsiella pneumoniae","Proteus mirabilis (struvite stones)","Pseudomonas aeruginosa (catheter / instrumentation)","Enterococcus spp.","Staphylococcus aureus (haematogenous / bacteraemic seeding)"],"first_line":[["Gentamicin (NON-SEVERE / community-onset pyelonephritis — DATA-PREFERRED)","Adult: 5–7mg/kg IV/IM OD × 7–10d  •  Paed: 7.5mg/kg IV/IM OD (neonate: 5mg/kg per gestational-age protocol)  — rationale: Uganda E. coli 57%-S gentamicin vs 28% overall for ceftriaxone (Mayito 2024). Best single-drug option for uncomplicated community pyelonephritis. Monitor creatinine + urine output. Duration 7d if clinical response.  [UCG 2023]","A"],["Meropenem (SEVERE / healthcare-associated / ESBL risk / clinical failure at 48h)","Adult: 1g IV Q8h × 10–14d  •  Paed: 20mg/kg IV Q8h × 10–14d  — Uganda E. coli 81%-S, Klebsiella 90%-S. First choice for: sepsis with source in urinary tract, prior ESBL, healthcare-associated UTI, obstruction, emphysematous pyelonephritis (diabetics), failure of gentamicin.","W"],["Piperacillin-tazobactam (SEVERE / healthcare-associated, where carbapenem sparing preferred)","Adult: 4.5g IV Q6h  •  Paed: 100mg/kg (pip) IV Q8h — use if meropenem-sparing intent, no confirmed ESBL; covers Pseudomonas if catheter/instrumentation-associated.","W"]],"second_line":[["Ceftriaxone (community-onset, likely susceptible organism — use with culture data if possible)","Adult: 1–2g IV OD × 10–14d  •  Paed: 50–80mg/kg IV OD × 10–14d  — NOTE: Uganda E. coli overall only 28%-S, blood 44%-S, urine 34%-S; Klebsiella 38%-S (Mayito 2024). Reserve for culture-confirmed susceptible organisms or low-risk outpatient step-down. Not empiric first-choice in Uganda inpatient setting.  [UCG 2023 — listed first-line but data-demoted]","W"],["Amoxicillin-clavulanate (Enterococcal cover / culture-guided / oral step-down)","Adult: 625mg PO TDS or 1.2g IV TDS  •  Paed: 25–45mg/kg/day (amox) PO ÷ TDS or 30mg/kg IV Q8h  — Uganda E. coli 56%-S; useful for Enterococcus and confirmed amox-clav susceptible isolates.","A"],["Ciprofloxacin (culture-confirmed susceptible; NOT empiric in Uganda)","Adult: 500mg PO BD × 7d  •  Paed: 15mg/kg PO BD × 7–10d (max 1g/day)  — Uganda E. coli only 36%-S; only use if culture confirms susceptibility. UCG lists as first-line — data does not support empiric use.","W"]],"avoid":"Nitrofurantoin (no systemic concentrations - fails in pyelonephritis). Fosfomycin (similar). Aminoglycoside monotherapy >7d (nephrotoxicity, ototoxicity). Empiric Rx without culture in complicated cases.","notes":"IDSA UTI 2011 case definition - COMPLICATED UTI: UTI with ANY of fever, flank pain (Murphy's punch), N&V, CVA tenderness, pregnancy, structural/functional GU abnormality (stones, stents, catheter, neurogenic bladder), immunocompromise, recent instrumentation, male sex, hospital acquisition, prosthetic material, recurrent infections. Pyelonephritis = UTI + fever + flank pain ± systemic features. CAUTI = catheter-associated; REMOVE/CHANGE CATHETER FIRST. Hospitalise if: vomiting / inability to tolerate oral / haemodynamic instability / pregnant / severe pain / no response to oral 48–72h. Duration: 7d cipro / 10–14d ceftriaxone / 14d ESBL or complicated cases. UCG: Ciprofloxacin first-line but Uganda E. coli only 36%-S (Mayito 2024) - gentamicin (57%-S) data-preferred.","recommended_tests":["Urine dipstick (all cases)","URINE C&S MANDATORY (complicated UTI, pyelonephritis, CAUTI, male, pregnancy, recurrent)  [IDSA 2011; UCG 2023]","Blood cultures × 2 if pyelonephritis with systemic signs / urosepsis","FBC, CRP, U&E, creatinine","Renal USS (non-responders, recurrent, abnormal LFTs/U&E, suspected obstruction)","CT KUB if obstructive pyelonephritis suspected","HIV test (recurrent/unusual)","Pregnancy test"],"clinical_score":"Severity (IDSA 2011 + ICD-11 GC02): MILD–MODERATE pyelonephritis = oral outpatient (afebrile within 72h). SEVERE = sepsis, vomiting, pregnancy, structural abnormality → IV inpatient. Emphysematous pyelonephritis (diabetics) → urgent surgical / urological intervention. CAUTI: change catheter + 7d antibiotic. Pregnancy: hospitalise all pyelonephritis (preterm labour risk) → IV ceftriaxone × 14d.  [Gupta et al. CID 2011; UCG 2023 §10.2]"},"Urethral discharge syndrome (UDS)":{"setting":"Community / STI clinic","likely_pathogens":["Neisseria gonorrhoeae","Chlamydia trachomatis","Mycoplasma genitalium","Trichomonas vaginalis","Ureaplasma urealyticum"],"first_line":[["Ceftriaxone + Doxycycline","Adult: Ceftriaxone 500mg IM single + Doxycycline 100mg PO BD × 7d  •  Paed (≥45kg adolescent): same; <8yr/<45kg: Ceftriaxone 50mg/kg IM (max 1g) + Azithromycin 20mg/kg PO single (max 1g) - sexual abuse evaluation if pre-pubertal","W+A"]],"second_line":[["Cefixime + Doxycycline (oral alternative)","Adult: Cefixime 400mg PO single + Doxycycline 100mg PO BD × 7d  •  Paed (≥45kg): same; <45kg: Cefixime 8mg/kg PO + Azithromycin 20mg/kg PO single (if IM unavailable)","W+A"],["Azithromycin (chlamydia-only)","Adult: 1g PO single (NOT for gonorrhoea monotherapy)  •  Paed: 20mg/kg PO single (max 1g)","W"],["Metronidazole (persistent UDS - Trichomonas)","Adult: 2g PO single dose  •  Paed: 50mg/kg PO single (max 2g) - add if no response to first-line","A"]],"avoid":"Ciprofloxacin monotherapy (>50% N. gonorrhoeae resistance in E. Africa). Single-drug therapy (always cover gonococcus + chlamydia). Treating without partner notification.","notes":"WHO 2021 / UCG 2023 syndromic UDS flowchart - confirm discharge by milking urethra. Cover gonococcus + chlamydia simultaneously. Persistent discharge after first-line → Trichomonas / Mycoplasma → add metronidazole ± switch to moxifloxacin for M. genitalium. Treat all sexual partners (last 60 days). HIV + RPR + HBV mandatory. Re-test at 3 months.","recommended_tests":["Urethral swab Gram stain (Gram-neg intracellular diplococci diagnostic for gonorrhoea) [UCG STI 2023]","NAAT for gonorrhoea + chlamydia (if available - preferred)","First-void urine NAAT (alternative)","HIV test [UCG mandatory]","RPR/VDRL ± TPHA","Hepatitis B surface antigen","Wet mount for Trichomonas (if persistent)"],"clinical_score":"WHO/UCG syndromic flowchart: confirmed urethral discharge → treat for gonorrhoea + chlamydia. Partner notification window: 60 days (gonorrhoea/chlamydia). All male UDS → assume sexually-acquired. Test-of-cure NOT routinely required for uncomplicated UDS; reassess clinically at 7 days. Persistent → second-line + reassess for adherence/re-exposure/resistant organism."},"Vaginal discharge syndrome (VDS)":{"setting":"Community / STI clinic","likely_pathogens":["Trichomonas vaginalis","Gardnerella vaginalis / BV anaerobes","Candida albicans","Neisseria gonorrhoeae (if cervicitis)","Chlamydia trachomatis (if cervicitis)"],"first_line":[["Metronidazole + Clotrimazole","Adult: Metronidazole 2g PO single dose OR 400mg PO BD × 7d + Clotrimazole 500mg pessary single OR 100mg pessary × 6 nights  •  Paed (adolescent): same; pre-pubertal - specialist input + sexual abuse evaluation","A+A"],["+ Cervicitis cover IF risk factors (Ceftriaxone + Doxycycline)","Adult: Ceftriaxone 500mg IM single + Doxycycline 100mg PO BD × 7d (add if cervical motion tenderness, mucopurulent cervical discharge, friable cervix, or risk factors)  •  Paed (≥45kg): same; <45kg: Ceftriaxone 50mg/kg IM + Azithromycin 20mg/kg PO single","W+A"]],"second_line":[["Tinidazole","Adult: 2g PO single dose (Trichomonas/BV alternative)  •  Paed: 50mg/kg PO single (max 2g)","A"],["Fluconazole","Adult: 150mg PO single (severe/recurrent Candida)  •  Paed (>2yr): 3–6mg/kg PO single (max 150mg)","A"],["Metronidazole 0.75% intravaginal gel","Adult: 5g intravaginal OD × 5d (BV topical alternative)  •  Paed: not standard","A"]],"avoid":"Single-dose metronidazole 2g in 1st trimester pregnancy (use 400mg BD × 7d instead - WHO 2021). Doxycycline in pregnancy (substitute azithromycin 1g for chlamydia). Empiric cervicitis Rx without risk assessment / pelvic exam where feasible.","notes":"WHO 2021 / UCG 2023 syndromic VDS flowchart. Speculum exam where feasible (Amsel criteria for BV; pH; whiff test). Cervicitis risk factors: age <25, new/multiple partners, partner with STI, sex work, no condom. Cervical motion tenderness → manage as PID. Partner treatment for Trichomonas + cervicitis; not routine for Candida or BV. HIV mandatory.","recommended_tests":["Speculum exam (discharge character, cervical motion tenderness, friability, cervicitis)","Wet mount microscopy (clue cells, motile trichomonads, hyphae)","Vaginal pH (>4.5 = BV/Trichomonas; <4.5 = Candida)","Whiff test (10% KOH - fishy odour = BV)","NAAT for gonorrhoea + chlamydia (if available)","HIV test [UCG mandatory]","RPR/VDRL ± TPHA","Pregnancy test","Endocervical Gram + C&S if cervicitis"],"clinical_score":"Amsel criteria for BV (≥3 of 4): homogeneous thin grey-white discharge; pH >4.5; positive whiff test; clue cells on wet mount. Nugent score (Gram stain) if available - 7–10 = BV. Clinical pattern recognition: curd-like white discharge + vulvar itch = Candida; frothy yellow-green + strawberry cervix = Trichomonas; thin grey + fishy odour = BV; mucopurulent cervical discharge + CMT = cervicitis (treat as STI)."},"Genital ulcer disease (GUD)":{"setting":"Community / STI clinic","likely_pathogens":["Herpes simplex virus type 2 (most common cause in HIV-prevalent settings)","Treponema pallidum (syphilis)","Haemophilus ducreyi (chancroid)","Klebsiella granulomatis (donovanosis / granuloma inguinale)","Chlamydia trachomatis L1–L3 (LGV - when bubo present)"],"first_line":[["Benzathine penicillin G (syphilis)","Adult: 2.4MU IM single dose (primary / secondary / early latent - divide between 2 buttocks)  •  Paed: 50,000IU/kg IM single (max 2.4MU); congenital syphilis → Aqueous crystalline penicillin G 50,000IU/kg IV Q12h (week 1) or Q8h (≥week 2) × 10d","A"],["Aciclovir (HSV)","Adult: 400mg PO TDS × 7d (first episode) or × 5d (recurrent); HIV+/severe: 400–800mg PO 5× daily × 7–10d  •  Paed: 20mg/kg PO QDS × 7–10d (max 800mg/dose)","A"],["+ Azithromycin (empiric chancroid cover)","Adult: 1g PO single dose  •  Paed: 20mg/kg PO single (max 1g) - add if painful purulent ulcer or associated bubo (chancroid suspected)","W"]],"second_line":[["Benzathine penicillin G (late latent / unknown duration syphilis)","Adult: 2.4MU IM weekly × 3 doses  •  Paed: 50,000IU/kg IM weekly × 3 (max 2.4MU per dose)","A"],["Doxycycline (penicillin-allergic syphilis)","Adult: 100mg PO BD × 14d (early) or × 28d (late latent)  •  Paed (≥8yr): 2.2mg/kg PO BD × 14–28d; <8yr → DESENSITISE to penicillin (no good paediatric alternative)","A"],["Ceftriaxone (chancroid alternative)","Adult: 250mg IM single dose  •  Paed: 50mg/kg IM single (max 250mg)","W"],["Erythromycin (chancroid in pregnancy / <8yr)","Adult: 500mg PO QDS × 7d  •  Paed: 12.5mg/kg PO QDS × 7d","A"],["Doxycycline (donovanosis / granuloma inguinale)","Adult: 100mg PO BD × ≥21d until lesions completely healed  •  Paed (≥8yr): 2.2mg/kg PO BD × ≥21d; <8yr: Azithromycin 1g PO weekly × ≥3 weeks","A"],["Aqueous crystalline penicillin G (neurosyphilis / ocular / otosyphilis)","Adult: 18–24 MU/day IV ÷ Q4h or continuous × 10–14d  •  Paed: 200,000–300,000 IU/kg/day IV ÷ Q4–6h × 10–14d (max 24 MU/day)","A"]],"avoid":"Azithromycin monotherapy for syphilis (30–90% macrolide resistance globally - A2058G mutation). Topical antibiotics for genital ulcers. Steroids. Treating without HIV testing. Doxycycline <8yr (use erythromycin / azithromycin / desensitise to penicillin). Delay in treating during pregnancy (congenital syphilis prevention).","notes":"WHO 2021 / UCG syndromic GUD: in HIV-prevalent settings HSV is the most common cause - most ulcers benefit from aciclovir even when syphilis treated. Always treat for syphilis empirically + add chancroid cover if painful/purulent. Jarisch–Herxheimer reaction can follow first penicillin dose (fever, chills, myalgia within 24h - warn patient; supportive care). Partner treatment essential. Notify pregnancy syphilis urgently to prevent congenital syphilis. Re-test all GUD patients at 3 months and 6 months.","recommended_tests":["RPR/VDRL ± TPHA confirmation [UCG STI 2023]","Dark-field microscopy if available (primary syphilis spirochaetes - pathognomonic)","HSV PCR from ulcer swab (preferred) or Tzanck smear (multinucleated giant cells)","HIV test [UCG mandatory]","Hepatitis B surface antigen","Pregnancy test (women of reproductive age)","Ulcer swab Gram + C&S (rule out bacterial superinfection)","CSF VDRL + cell count if neurosyphilis suspected (visual/auditory symptoms, signs of meningitis)"],"clinical_score":"Syphilis staging: Primary (single painless indurated chancre with clean base, regional lymphadenopathy) → Secondary (maculopapular rash incl. palms/soles, condyloma lata, mucous patches, generalised lymphadenopathy) → Latent (asymptomatic, RPR+) → Tertiary (gummata, CV syphilis, neurosyphilis). HSV: clustered vesicles → painful shallow ulcers, recurrent. Chancroid: deep painful ragged ulcer with undermined edges + tender unilateral bubo (often suppurative). Donovanosis: beefy red painless granulomatous ulcer (Donovan bodies on tissue smear). LGV: small painless ulcer + striking unilateral bubo with 'groove sign'. Partner notification window: 3 months for primary syphilis · 6 months secondary · 1 year early latent · all sex partners since onset for HSV / chancroid."},"Inguinal bubo / lymphadenopathy syndrome":{"setting":"Community / STI clinic","likely_pathogens":["Chlamydia trachomatis L1–L3 (LGV - leading cause in tropics)","Haemophilus ducreyi (chancroid - bubo + painful ulcer)","Treponema pallidum (secondary syphilis regional lymphadenopathy)","Klebsiella granulomatis (donovanosis - pseudobubo)","Yersinia pestis (plague - CRITICAL in endemic areas; NOTIFY immediately)","Mycobacterium tuberculosis (chronic, cold abscess)"],"first_line":[["Doxycycline (LGV)","Adult: 100mg PO BD × 21d  •  Paed (≥8yr): 2.2mg/kg PO BD × 21d; <8yr: Erythromycin 12.5mg/kg PO QDS × 21d (doxy contraindicated)","A"],["+ Azithromycin (empiric chancroid cover)","Adult: 1g PO single dose  •  Paed: 20mg/kg PO single (max 1g) - add if painful associated ulcer (chancroid suspected)","W"]],"second_line":[["Erythromycin (LGV alternative in pregnancy / <8yr)","Adult: 500mg PO QDS × 21d  •  Paed: 12.5mg/kg PO QDS × 21d","A"],["Azithromycin (LGV alternative regimen)","Adult: 1g PO weekly × 3 weeks  •  Paed: 20mg/kg PO weekly × 3 (max 1g)","W"],["Ceftriaxone (chancroid alternative)","Adult: 250mg IM single dose  •  Paed: 50mg/kg IM single (max 250mg)","W"],["Streptomycin / Gentamicin (PLAGUE - notify immediately)","Adult: Streptomycin 1g IM BD × 10d OR Gentamicin 5mg/kg IV OD × 10d  •  Paed: Streptomycin 15mg/kg IM BD OR Gentamicin 7.5mg/kg IV OD × 10d (suspected pneumonic/septicaemic plague: isolation + PEP for contacts)","A"]],"avoid":"Incision and drainage of fluctuant buboes (worsens outcome and creates sinus tracts - use needle aspiration through adjacent healthy skin instead). Short courses (LGV requires ≥21 days; rectal LGV/proctocolitis may need longer). Penicillin (no activity against C. trachomatis or H. ducreyi). Missing plague in endemic zones (lethal within 1–7 days if untreated). Empiric LGV treatment without HIV testing (HIV+ patients more often have severe disease).","notes":"WHO 2021 / UCG syndromic bubo flowchart. Aspirate fluctuant buboes through healthy skin with wide-bore needle (NOT I&D). LGV duration: ≥21 days minimum (rectal LGV/proctocolitis may extend to 3+ weeks). Exclude plague in endemic Ugandan zones (West Nile, Karamoja) - sudden onset + extremely painful bubo + recent flea/rodent exposure + fever = isolate + notify district health office + empiric streptomycin/gentamicin BEFORE confirmation. HIV test mandatory. Partner treatment essential for LGV and chancroid. Differentiate from non-STI causes: femoral hernia (reducible, cough impulse), malignancy (firm, fixed, supraclavicular), cat-scratch disease (history), TB lymphadenitis (cold, chronic, matted).","recommended_tests":["Bubo aspirate Gram stain + C&S (NEVER incise - aspirate through healthy skin)","NAAT for C. trachomatis with LGV serotyping (L1–L3) if available","HIV test [UCG mandatory]","RPR/VDRL ± TPHA","HSV PCR if associated genital ulcers","Plague rapid diagnostic test if endemic area + acute presentation + fever (FREE F1 antigen)","CXR + sputum GeneXpert (TB workup if chronic / cold abscess / weight loss / haemoptysis)","FNAC of bubo if persistent (rule out malignancy / TB)"],"clinical_score":"Groove sign of LGV (pathognomonic): bubo crossed by inguinal ligament - separates enlarged inguinal from femoral nodes into 'sausage shape'. Plague clinical pattern: SUDDEN fever + chills + extremely painful bubo + recent flea/rodent contact in endemic area → ISOLATE in single room + notify district health office + empiric streptomycin or gentamicin BEFORE confirmation (mortality 40–60% untreated, <5% if treated within 24h). Chancroid: painful ragged ulcer + tender unilateral bubo (often suppurative); 'school of fish' Gram stain. LGV groove sign + painless or absent ulcer + striking unilateral bubo. Donovanosis: painless beefy granulomatous lesion, no true bubo (pseudobubo = subcutaneous granuloma)."},"Pelvic inflammatory disease (PID)":{"setting":"Community / Hospital","likely_pathogens":["Neisseria gonorrhoeae","Chlamydia trachomatis","Mycoplasma genitalium","Anaerobes (mixed)","Gardnerella vaginalis"],"first_line":[["Ceftriaxone + Doxycycline + Metronidazole","Adult: Ceftriaxone 500mg IM single + Doxycycline 100mg PO BD × 14d + Metronidazole 400mg PO BD × 14d  •  Paed (adolescent ≥45kg): same; <8yr/pregnancy: substitute azithromycin 1g for doxycycline (WHO/CDC triple therapy)","W+A+A"]],"second_line":[["Ceftriaxone + Azithromycin + Metronidazole","Adult: Ceftriaxone 500mg IM + Azithromycin 1g PO weekly × 2 + Metronidazole 400mg PO BD × 14d  •  Paed (adolescent): same dosing scaled - if doxycycline not tolerated","W+W+A"]],"avoid":"Single-drug therapy. Removing IUD pre-emptively (only if no response 48–72h). Sexual intercourse during treatment.","notes":"Treat empirically when suspected - pelvic exam tenderness sufficient for diagnosis. Test for HIV, syphilis, hepatitis B. Treat partners. Reassess at 48–72h.","recommended_tests":["Pelvic exam (CMT, adnexal tenderness)","Pregnancy test","Endocervical swabs (gono/chlamydia)","HIV + RPR","Pelvic USS (TOA, hydrosalpinx)","FBC, CRP","Urinalysis (rule out UTI)"],"clinical_score":"CDC minimum criteria: cervical motion tenderness OR uterine tenderness OR adnexal tenderness in sexually active woman with pelvic pain. Hospital admission if: pregnancy, severe illness, TOA, oral therapy failure, can't exclude surgical emergency."},"Cellulitis / erysipelas":{"setting":"Community / Hospital","likely_pathogens":["Streptococcus pyogenes (Group A - most common in non-purulent cellulitis)","Other β-haemolytic streptococci (Groups B, C, G)","Staphylococcus aureus (MSSA - less common in non-purulent)","Pasteurella, anaerobes (only if bite-related)"],"first_line":[["Flucloxacillin","Adult: 500mg–1g PO/IV QDS × 5–7d (mild–moderate, oral); 1–2g IV QDS (severe)  •  Paed: 25–50mg/kg PO/IV ÷ QDS (max 2g/dose)  [UCG 2023; IDSA SSTI 2014]","A"]],"second_line":[["Amoxicillin-clavulanate","Adult: 625mg PO TDS or 1.2g IV TDS  •  Paed: 25–45mg/kg/day (amox) PO ÷ TDS or 30mg/kg IV Q8h (broader cover if uncertain MSSA / mixed Gram-neg risk)","A"],["Clindamycin","Adult: 450mg PO TDS or 600mg IV Q8h  •  Paed: 10mg/kg PO/IV Q6–8h (penicillin allergy)","A"],["Co-trimoxazole","Adult: 960mg PO BD  •  Paed: 24mg/kg PO BD (good MSSA/CA-MRSA skin activity, Access antibiotic)","A"]],"avoid":"Routine empiric MRSA cover (not needed for non-purulent cellulitis - IDSA 2014). Topical antibiotics for cellulitis (no benefit). Cephalexin / cefuroxime if true penicillin anaphylaxis history.","notes":"IDSA SSTI 2014 case definition - CELLULITIS: acute, spreading non-purulent erythema/warmth/tenderness/oedema of skin and SC tissue WITHOUT abscess, purulent drainage, or pus. ERYSIPELAS: superficial form involving upper dermis + lymphatics, with sharply demarcated raised advancing edge (β-haemolytic streptococcus). Non-purulent cellulitis = β-haemolytic strep dominant → narrow-spectrum flucloxacillin or penicillin sufficient. Elevate limb. Mark border for daily monitoring. Treat 5–7 days; extend if slow response. Switch to IV if extensive / systemic features / failure of oral.","recommended_tests":["Mark erythema border (daily progression)","Blood cultures × 2 if systemic features (fever, sepsis)","FBC, CRP","Imaging (USS / X-ray) only if fluid collection / FB / gas suspected","Tetanus status","HIV test if recurrent / unusual","Glucose if recurrent (rule out diabetes)"],"clinical_score":"Eron classification of SSTI severity (Eron et al. JAC 2003): Class I = no systemic toxicity, no uncontrolled comorbidity → outpatient oral. Class II = systemically unwell OR comorbidity → consider short admission. Class III = significant systemic upset / unstable comorbidity → admit IV. Class IV = sepsis or limb-threatening → admit IV + surgical review.  [IDSA SSTI 2014; UCG 2023]"},"Cutaneous abscess / furuncle / carbuncle":{"setting":"Community / Hospital","likely_pathogens":["Staphylococcus aureus (MSSA + MRSA - 56% MRSA in Uganda tertiary, Mayito 2024)","Group A Streptococcus","Mixed anaerobes (perianal / vulvar abscess)"],"first_line":[["Incision and drainage (PRIMARY treatment)","Adult: I&D is curative for most simple abscesses without surrounding cellulitis  •  Paed: same - analgesia / sedation per protocol  [IDSA SSTI 2014; UCG 2023]","-"],["Co-trimoxazole","Adult: 960mg PO BD × 7d (add post-I&D if: severe / multiple sites / surrounding cellulitis / systemic features / immunocompromised - covers CA-MRSA)  •  Paed: 24mg/kg PO BD × 7d  [IDSA SSTI 2014]","A"]],"second_line":[["Clindamycin","Adult: 450mg PO TDS × 7d (penicillin allergy / suspected D-test+ MRSA)  •  Paed: 10mg/kg PO Q6–8h","A"],["Doxycycline","Adult: 100mg PO BD × 7d  •  Paed (≥8yr): 2.2mg/kg PO BD × 7d (alternative CA-MRSA cover)","A"],["Vancomycin","Adult: 15–20mg/kg IV Q8–12h  •  Paed: 15mg/kg IV Q6h (severe / hospitalised / proven MRSA bacteraemia)","W"]],"avoid":"Antibiotics for simple uncomplicated abscess <5cm in immunocompetent adult - I&D alone IS curative (IDSA 2014). Empiric vancomycin for community abscess (co-trimoxazole/doxycycline first). Primary closure post-I&D (pack open or delayed primary closure).","notes":"IDSA SSTI 2014 case definition - purulent SSTI: cutaneous abscess (collection of pus in dermis/SC tissue), furuncle (folliculitis-derived), carbuncle (cluster of furuncles). Pus is the hallmark. I&D is PRIMARY. Antibiotics ADJUNCTIVE - add for: abscess >5cm, multiple abscesses, surrounding cellulitis, systemic features, immunocompromise, age extremes, sites where complete drainage difficult (face, hand, genital). CA-MRSA prevalent in Uganda (Mayito 2024: 56% MRSA in tertiary isolates).","recommended_tests":["Wound Gram + C&S from drained pus (sensitivity directs Rx)","Blood cultures × 2 if systemic features","FBC, CRP","HIV test if recurrent / multiple sites","USS to confirm collection if uncertain","Tetanus status"],"clinical_score":"IDSA 2014 algorithm for purulent SSTI: 1) Determine if SIRS present. 2) No SIRS → I&D alone if simple/small; add oral CA-MRSA antibiotic if moderate (multiple sites/large/cellulitis). 3) SIRS or immunocompromise → I&D + IV empiric MRSA cover (vancomycin) + cultures, de-escalate per AST.  [Stevens et al. CID 2014]"},"Impetigo":{"setting":"Community","likely_pathogens":["Staphylococcus aureus (most common - bullous and non-bullous)","Streptococcus pyogenes (non-bullous, classic 'honey-crust')"],"first_line":[["Topical fusidic acid 2% OR mupirocin 2%","Adult: thin layer TDS × 5–7d (localised, ≤3 lesions, non-bullous)  •  Paed: same - first-line for localised impetigo  [NICE NG153 2020; UCG 2023]","A"]],"second_line":[["Flucloxacillin","Adult: 500mg PO QDS × 5–7d (widespread / multiple sites / bullous)  •  Paed: 25mg/kg PO QDS (max 1g)  [NICE 2020]","A"],["Amoxicillin-clavulanate","Adult: 625mg PO TDS × 5–7d  •  Paed: 25–45mg/kg/day (amox) ÷ TDS (treatment failure)","A"],["Clindamycin","Adult: 450mg PO TDS × 5–7d  •  Paed: 10mg/kg PO Q6–8h (penicillin allergy)","A"]],"avoid":"Routine systemic antibiotics for localised impetigo (NICE 2020). Topical neomycin/bacitracin (high allergy rates). School attendance until lesions crusted or treated 48h.","notes":"NICE NG153 (2020) case definition: superficial bacterial skin infection presenting as: NON-BULLOUS - vesicles/pustules rupture → 'golden honey-coloured' crust on erythematous base; or BULLOUS - flaccid bullae with clear/turbid fluid (Staph epidermolytic toxin). Localised (single area, ≤3 lesions) → topical. Widespread / bullous / systemic features → oral. Highly contagious - exclude from school/work until lesions crusted or 48h after starting antibiotics. Hand hygiene; do not share towels.","recommended_tests":["Clinical diagnosis usually sufficient","Swab Gram + C&S if: recurrent / treatment failure / widespread / outbreak  [NICE 2020]","Glucose if recurrent (diabetes)","HIV test if unusually severe / recurrent"],"clinical_score":"NICE NG153 stratification: LOCALISED (single area, ≤3 lesions, no systemic features) → topical fusidic acid/mupirocin × 5d. WIDESPREAD (≥3 lesions / multiple body sites) OR BULLOUS OR systemic features → oral antibiotic (flucloxacillin first-line). Treatment failure at 7d → swab + alternative agent.  [NICE NG153 2020]"},"Infected bite wounds (animal & human)":{"setting":"Community / Hospital","likely_pathogens":["Pasteurella multocida (cat >> dog bites)","Capnocytophaga canimorsus (dog bites; severe in asplenic patients)","Staphylococcus aureus (incl. MRSA)","Streptococcus anginosus group","Anaerobes (Bacteroides, Fusobacterium)","Eikenella corrodens (human bites - clenched-fist injury)","HIV / Hepatitis B/C / rabies (transmission risk)"],"first_line":[["Amoxicillin-clavulanate","Adult: 625mg PO TDS × 5–7d (prophylactic post-bite) OR 1.2g IV TDS (established infection)  •  Paed: 25–45mg/kg/day (amox) PO ÷ TDS or 30mg/kg IV Q8h  [IDSA SSTI 2014; UCG 2023]","A"]],"second_line":[["Doxycycline + Metronidazole","Adult: Doxycycline 100mg PO BD + Metronidazole 400mg PO TDS × 5–7d  •  Paed (≥8yr): Doxy 2.2mg/kg BD + Metronidazole 7.5mg/kg Q8h; <8yr: Co-trimoxazole 24mg/kg BD + Metronidazole 7.5mg/kg Q8h (penicillin allergy)","A+A"],["Ceftriaxone + Metronidazole","Adult: Ceftriaxone 2g IV OD + Metronidazole 500mg IV TDS  •  Paed: Ceftriaxone 50–80mg/kg + Metronidazole 7.5mg/kg Q8h (severe / hand / deep tissue)","W+A"],["Piperacillin-tazobactam","Adult: 4.5g IV Q6h  •  Paed: 100mg/kg (pip) IV Q8h (severe systemic / orbital / hand surgical)","W"]],"avoid":"Primary closure of bite wounds (except face - leave open / delayed primary closure). 1st-generation cephalosporins (poor Pasteurella cover). Macrolides alone (poor anaerobic cover).","notes":"IDSA SSTI 2014 / UCG 2023: prophylactic antibiotics indicated for ALL: human bites; cat bites (deep puncture, high Pasteurella inoculation); bites involving hand/face/joint/tendon; bites with crush injury; asplenic / immunocompromised / diabetic / cirrhotic patients; presentation >8h post-bite. RABIES post-exposure prophylaxis MANDATORY for any unprovoked dog/wild-animal bite in Uganda (anti-rabies Ig + vaccine Day 0/3/7/14/28). HEP B/HIV PEP discussion for human bites. Tetanus toxoid + Ig per status. Hand bites → ortho/hand surgery review (often deep extension). Wash wound with soap + water 15 min.","recommended_tests":["Wound deep swab Gram + C&S (incl. anaerobic transport)","Blood cultures × 2 if systemic features","FBC, CRP","X-ray (foreign body, fracture, gas)","Tetanus immunisation status","HIV / HBV / HCV testing (human bites - both parties)","Rabies risk assessment (animal bites)","Glucose / HbA1c"],"clinical_score":"Bite risk stratification (IDSA 2014): HIGH-RISK bites needing prophylaxis = cat / hand / face / human / deep puncture / crush / delayed (>8h) / immunocompromised / asplenic / diabetic. LOW-RISK = superficial dog bite to non-critical site in healthy host, well-irrigated, early. WHO rabies PEP categories: I (touching/feeding) - no PEP; II (minor scratch, no bleed) - vaccine; III (penetrating bite, mucosal exposure, bat contact) - vaccine + rabies Ig.  [WHO Rabies 2018; IDSA SSTI 2014]"},"Necrotising fasciitis / gas gangrene":{"setting":"Hospital (Surgical EMERGENCY)","likely_pathogens":["Group A Streptococcus","Staphylococcus aureus","Clostridium perfringens","Polymicrobial (Type I: GNRs + anaerobes)","Vibrio vulnificus (water exposure)"],"first_line":[["Meropenem + Clindamycin + Vancomycin","Adult: Meropenem 1g IV Q8h + Clindamycin 600mg IV Q8h + Vancomycin 15–20mg/kg IV Q8–12h  •  Paed: Meropenem 20mg/kg Q8h + Clindamycin 10mg/kg Q6–8h + Vancomycin 15mg/kg Q6h (triple cover + toxin suppression)","W+A+W"]],"second_line":[["Piperacillin-tazobactam + Clindamycin + Vancomycin","Adult: Pip-tazo 4.5g IV Q6h + Clindamycin 600mg IV Q8h + Vancomycin 15–20mg/kg IV Q8–12h  •  Paed: Pip-tazo 100mg/kg (pip) Q8h + Clindamycin 10mg/kg Q6–8h + Vancomycin 15mg/kg Q6h (alternative)","W+A+W"]],"avoid":"Delay of surgical debridement >12h (mortality doubles). NSAIDs (may mask). Steroids. Conservative management.","notes":"SURGICAL EMERGENCY - debridement within hours. ICU support. Repeat debridement Q24h until clean. IVIG for streptococcal TSS. Mortality 20–40% even with optimal care.","recommended_tests":["LRINEC score (CRP, WCC, Na, glucose, creatinine, Hb)","CT/MRI (gas, fascial enhancement) - DO NOT delay surgery for imaging","Gram stain + C&S from operative tissue","Blood cultures × 2","CK (rhabdomyolysis)","Lactate (sepsis)"],"clinical_score":"LRINEC: CRP ≥150 (4pts) / WCC 15–25 (1) or >25 (2) / Hb 11–13.5 (1) or <11 (2) / Na <135 (2) / Cr >141 (2) / Glucose >10 (1). Score ≥6 = high risk (≥75% PPV). Score ≥8 = strongly predictive. [Wong et al. Crit Care Med 2004]"},"Diabetic foot infection":{"setting":"Community / Hospital","likely_pathogens":["Staphylococcus aureus (incl. MRSA)","Streptococcus spp.","Enterobacterales (Gram-neg)","Pseudomonas aeruginosa (chronic/water)","Anaerobes (deep/necrotic)"],"first_line":[["Amoxicillin-clavulanate (MILD — non-limb-threatening, superficial, no systemic features)","Adult: 625mg PO TDS  •  Paed: 25–45mg/kg/day (amox) PO ÷ TDS — use for mild infections without systemic signs, no deep tissue involvement, no prior antibiotic exposure.","A"],["Piperacillin-tazobactam + Vancomycin (MODERATE-SEVERE — limb-threatening or systemically unwell — PREFERRED)","Adult: Pip-tazo 4.5g IV Q6h + Vancomycin 15–20mg/kg IV Q8–12h  •  Paed: Pip-tazo 100mg/kg (pip) IV Q8h + Vancomycin 15mg/kg IV Q6h  — rationale: pip-tazo covers GNRs + anaerobes + Pseudomonas (water/chronic wounds); vancomycin for MRSA (56% Uganda). This combination handles the typical polymicrobial moderately-severe diabetic foot.","W+W"]],"second_line":[["Meropenem + Vancomycin (SEVERE / ESBL risk / necrosis / failure of first-line)","Adult: Meropenem 1g IV Q8h + Vancomycin 15–20mg/kg IV Q8–12h  •  Paed: Meropenem 20mg/kg Q8h + Vancomycin 15mg/kg Q6h — ESBL likely: prior antibiotics, healthcare-associated, recurrent/non-healing wound, prior culture showing ESBL.","W+W"],["Ceftriaxone + Metronidazole (MILD-MODERATE, culture-confirmed susceptible Enterobacterales, no MRSA/Pseudomonas risk)","Adult: Ceftriaxone 2g IV OD + Metronidazole 500mg IV TDS  •  Paed: Ceftriaxone 50–80mg/kg OD + Metronidazole 7.5mg/kg Q8h  — NOTE: use only if MRSA risk low and Gram-negative susceptibility confirmed or very low-risk community presentation. Uganda data shows ceftriaxone 28% E. coli S overall; empiric use unreliable without culture support.  [UCG 2023 — demoted to culture-guided/selected cases]","W+A"]],"avoid":"Empiric anti-pseudomonal cover for mild infections. Treatment without debridement/source control. Long courses without reassessment.","notes":"IDSA classification drives Rx duration. Off-loading essential. Vascular assessment (ABI). Daily wound care. Long-term diabetic control. Consider MRSA cover if risk factors. Bone involvement = osteomyelitis → 6 weeks.","recommended_tests":["Wound deep swab/tissue Gram + C&S","HbA1c, glucose","X-ray foot (osteomyelitis)","ABI / Doppler (vascular)","Probe to bone test","MRI if osteomyelitis suspected","Tetanus status","HIV test"],"clinical_score":"IDSA/IWGDF classification: Uninfected (no signs); Mild (skin/SC tissue, erythema 0.5–2cm); Moderate (erythema >2cm, deep tissue/bone); Severe (systemic signs / SIRS). Treatment duration: Mild 1–2wk · Moderate 1–3wk · Severe 2–4wk · Osteomyelitis 4–6wk."},"Bone and joint infection (septic arthritis, osteomyelitis)":{"setting":"Hospital","likely_pathogens":["Staphylococcus aureus (MSSA/MRSA)","Group A Streptococcus","Salmonella (sickle cell)","Kingella kingae (children <4yr)","Pseudomonas (puncture wounds)","Mycobacterium tuberculosis (chronic)"],"first_line":[["Vancomycin (EMPIRIC S. aureus cover — PREFERRED given 56% MRSA in Uganda)","Adult: 15–20mg/kg IV Q8–12h (TDM-guided, trough 15–20mg/L)  •  Paed: 15mg/kg IV Q6h  — rationale: MRSA 56% in Uganda tertiary hospitals (Mayito 2024). Vancomycin 99% S globally, 97% E. Africa. De-escalate to cloxacillin only if culture confirms MSSA. Penetrates bone adequately at therapeutic levels.","W"],["Ceftriaxone (Gram-negative / Salmonella / paediatric empiric when Gram-negative source suspected)","Adult: 2g IV OD  •  Paed: 50–80mg/kg IV OD (Gram-negative joint/bone; Salmonella in sickle cell; Kingella kingae <4yr) — pair with vancomycin for polymicrobial / unknown Gram-stain empiric cover.","W"]],"second_line":[["Cloxacillin/Flucloxacillin (MSSA confirmed on culture ONLY)","Adult: 2g IV QDS  •  Paed: 50mg/kg IV Q6h (max 2g/dose)  — use only after culture confirmation of MSSA susceptibility. NOT for empiric use in Uganda given 56% MRSA. Step down from vancomycin when sensitivities available.  [UCG 2023 — data-demoted to culture-directed role]","A"],["Meropenem (ESBL Gram-negative confirmed / Pseudomonas / failed first-line)","Adult: 1g IV Q8h  •  Paed: 20mg/kg IV Q8h","W"],["Clindamycin (PO step-down for MSSA/streptococcal confirmed, good bone penetration)","Adult: 450–600mg PO QDS  •  Paed: 10mg/kg PO Q6–8h (oral step-down once afebrile, cultures known — excellent bone penetration, Access drug)","A"]],"avoid":"Antibiotics before joint aspiration / bone biopsy (compromises culture). Short courses (<4–6 weeks bone, ≥2 weeks joint).","notes":"Joint aspiration ESSENTIAL before antibiotics. Surgical drainage for septic arthritis. Osteomyelitis: 4–6 weeks IV → step-down PO. Sickle cell: cover Salmonella. Children <4yr: include Kingella cover. TB osteomyelitis: 6–12 months RHZE/RH.","recommended_tests":["Joint aspirate: cell count + crystals + Gram + C&S (BEFORE antibiotics)","Blood cultures × 2","FBC, CRP, ESR","X-ray (acute baseline)","MRI (osteomyelitis - gold standard)","Bone biopsy (chronic / culture-directed)","HbS (sickle cell screen)","HIV test"],"clinical_score":"Kocher criteria (paediatric septic hip): Fever >38.5°C / Non-weight bearing / ESR >40 / WCC >12,000 → 4/4 = 99% septic, 3/4 = 93%, 2/4 = 40%, 1/4 = 3%."},"Surgical site infection":{"setting":"Hospital","likely_pathogens":["Staphylococcus aureus (MSSA/MRSA)","Enterobacterales","Pseudomonas aeruginosa","Anaerobes (abdominal/GI surgery)","Enterococcus spp."],"first_line":[["Flucloxacillin (SUPERFICIAL SSI only — skin/SC, no systemic features, defined post-elective-clean surgery)","Adult: 500mg–1g PO/IV QDS  •  Paed: 25–50mg/kg PO/IV Q6h  — for superficial incisional SSI in elective clean surgery (orthopaedics, hernia) with no MRSA risk factors and no systemic features. ONLY where MRSA risk is genuinely low (no prior MRSA, no ICU exposure, no diabetes).","A"],["Vancomycin + Piperacillin-tazobactam (DEEP / ORGAN-SPACE / ABDOMINAL SSI or any systemic features — PREFERRED EMPIRIC)","Adult: Vancomycin 15–20mg/kg IV Q8–12h + Pip-tazo 4.5g IV Q6h  •  Paed: Vancomycin 15mg/kg IV Q6h + Pip-tazo 100mg/kg (pip) IV Q8h  — rationale: deep/organ-space SSI likely polymicrobial (MRSA + GNRs + anaerobes); 56% MRSA in Uganda tertiary hospitals means empiric MRSA cover is warranted for any deep or severe SSI; pip-tazo covers Gram-neg + anaerobes. De-escalate on culture.","W+W"]],"second_line":[["Vancomycin alone (superficial SSI with MRSA risk factors / post-implant / ICU patient)","Adult: 15–20mg/kg IV Q8–12h  •  Paed: 15mg/kg IV Q6h","W"],["Meropenem + Vancomycin (ESBL confirmed / severe necrotising / failed pip-tazo)","Adult: Meropenem 1g IV Q8h + Vancomycin 15–20mg/kg IV Q8–12h  •  Paed: Meropenem 20mg/kg Q8h + Vancomycin 15mg/kg Q6h","W+W"],["Amoxicillin-clavulanate (mild/superficial, community-setting, no MRSA risk)","Adult: 1.2g IV TDS  •  Paed: 30mg/kg (amox) IV Q8h — for ward-level mild SSIs without systemic features in low-MRSA-risk patients.","A"]],"avoid":"Antibiotics without source control (open the wound). Prolonged prophylaxis >24h (CDC). Topical antibiotics in clean wounds.","notes":"Open the wound first - antibiotics adjunctive. Cultures from deep tissue (not surface swab). Duration 5–10 days typically. Reassess at 48–72h. Stop if cultures negative + clinical improvement.","recommended_tests":["Deep wound Gram + C&S","Blood cultures × 2 (systemic features)","FBC, CRP","Imaging (USS/CT - deep collection)","Glucose (diabetic)","Tetanus"],"clinical_score":"CDC SSI classification: Superficial incisional (skin/SC) within 30d · Deep incisional (fascia/muscle) within 30d (90d if implant) · Organ/space within 30d (90d implant). ASEPSIS wound score for surveillance."},"Peritonitis / appendicitis (intra-abdominal infection)":{"setting":"Hospital (Surgical)","likely_pathogens":["Escherichia coli","Klebsiella pneumoniae","Bacteroides fragilis","Enterococcus spp.","Streptococcus anginosus group","Pseudomonas aeruginosa (severe / hospital-acquired)"],"first_line":[["Piperacillin-tazobactam + Metronidazole (MODERATE-SEVERE / hospital-acquire
