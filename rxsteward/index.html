a + weight loss) = fluconazole + investigate oesophageal involvement. Oesophageal: assume if oral thrush + dysphagia/odynophagia + CD4 <200."},"Invasive candidiasis / candidaemia":{"setting":"Hospital / ICU","likely_pathogens":["Candida albicans","Candida glabrata (fluconazole-resistant)","Candida parapsilosis (catheter-associated)","Candida tropicalis","Candida krusei (intrinsic FLU-R)","Candida auris (emerging MDR)"],"first_line":[["Fluconazole (non-critical, C. albicans likely)","Adult: 800mg loading then 400mg IV/PO OD x >=14d after first negative blood culture  •  Paed: 12mg/kg loading then 6-12mg/kg OD  [UCG 2023; WHO fungal 2022]","A"],["Caspofungin (critical / azole-resistant risk)","Adult: 70mg IV loading then 50mg IV OD  •  Paed: 70mg/m2 loading then 50mg/m2 OD (max 70mg)  [IDSA 2016; WHO 2022: echinocandin preferred for critically ill]","R"]],"second_line":[["Micafungin","Adult: 100mg IV OD  •  Paed: 2mg/kg OD (<40kg) or 100mg OD (>=40kg)  [IDSA 2016 alternative echinocandin]","R"],["Amphotericin B (deoxycholate or liposomal)","Adult: 0.5-1mg/kg IV OD  •  Paed: same  [UCG 2023; if echinocandins unavailable]","W"],["Voriconazole (C. krusei)","Adult: 400mg BD D1 then 200mg BD IV/PO  •  Paed: 9mg/kg BD (C. krusei confirmed)  [IDSA 2016]","W"]],"avoid":"Fluconazole empirically in ICU patients or prior azole exposure (risk of resistant species). Echinocandins for CNS/eye candidiasis (poor penetration). Delaying source control (remove CVC). Fluconazole for C. krusei (intrinsic resistance).","notes":"UCG 2023: fluconazole for non-critical candidaemia. WHO Essential Diagnostics: blood culture is gold standard. IDSA 2016 vs UCG: IDSA recommends echinocandin first-line for all candidaemia (stronger evidence); UCG uses fluconazole first-line due to echinocandin availability/cost constraints in Uganda. Note this difference. Remove all intravascular catheters if possible. Duration: minimum 14 days after first negative blood culture + resolution of signs. Ophthalmology review mandatory (Candida endophthalmitis in 10-15%). C. auris: emerging MDR, often pan-azole-resistant; echinocandin first-line; notify infection control.","recommended_tests":["Blood cultures x 2 (BEFORE antifungals)","Repeat blood cultures every 48h until negative","Species identification + antifungal susceptibility","Beta-D-glucan (sensitive for invasive candidiasis)","Fundoscopy / ophthalmology review (Candida endophthalmitis)","Echocardiogram (if prolonged candidaemia)","CT abdomen (hepatosplenic candidiasis if persistent)","CVC tip culture if removed"],"clinical_score":"Candida score (Leon 2006): severe sepsis (+2), total parenteral nutrition (+1), surgery (+1), multifocal Candida colonisation (+1). Score >=3: consider empirical antifungal. IDSA 2016 recommends echinocandin for: critically ill, prior azole exposure, suspected C. glabrata/krusei. Step-down to fluconazole when: clinically stable + C. albicans confirmed susceptible + repeat cultures negative."},"Cerebral toxoplasmosis (HIV)":{"setting":"Hospital","likely_pathogens":["Toxoplasma gondii"],"first_line":[["Pyrimethamine + Sulfadiazine + Folinic acid","Adult: Pyrimethamine 200mg PO loading then 50-75mg OD + Sulfadiazine 1-1.5g PO QDS + Folinic acid 10-25mg PO OD x >=6 weeks  •  Paed: Pyrimethamine 2mg/kg D1 then 1mg/kg OD + Sulfadiazine 50mg/kg BD + Folinic acid 10mg 3x/week  [UCG 2023; WHO OI 2021]","A+A"]],"second_line":[["Co-trimoxazole (high-dose; if sulfadiazine/pyrimethamine unavailable)","Adult: TMP 10mg/kg/day + SMX 50mg/kg/day PO/IV div BD x >=6 weeks  •  Paed: same weight-based  [WHO OI 2021; UCG alternative]","A"],["Pyrimethamine + Clindamycin + Folinic acid","Adult: Pyrimethamine 200mg loading then 50-75mg OD + Clindamycin 600mg PO/IV QDS + Folinic acid 10-25mg OD x >=6 weeks  •  Paed: Pyrimethamine 2mg/kg then 1mg/kg OD + Clindamycin 10mg/kg Q6h  [NIH OI; sulfa allergy]","A+A"]],"avoid":"Brain biopsy as first step (trial empiric therapy x 2 weeks first; biopsy only if no response). Steroids without concurrent treatment (mask progression). Stopping maintenance therapy before immune reconstitution.","notes":"UCG 2023 and WHO OI 2021 aligned. Empiric treatment trial: if HIV+ with CD4 <200 + ring-enhancing brain lesions on CT/MRI + positive toxoplasma IgG serology, treat empirically x 2 weeks. If clinical + radiological improvement, continue 6 weeks. If no improvement, brain biopsy to rule out lymphoma or other diagnosis. Maintenance (secondary prophylaxis): pyrimethamine 25-50mg OD + sulfadiazine 500mg QDS + folinic acid; OR co-trimoxazole 960mg OD; continue until CD4 >200 x >=6 months on ART. Delay ART 2 weeks if severe cerebral oedema. Co-trimoxazole prophylaxis prevents toxoplasmosis (do not stop if CD4 <200).","recommended_tests":["CT or MRI brain with contrast (ring-enhancing lesions, usually multiple, basal ganglia)","Toxoplasma IgG serology (positive in >90% of cases; negative makes diagnosis unlikely)","CD4 count","HIV viral load","FBC (monitor for pyrimethamine marrow toxicity)","LFTs","Brain biopsy only if no response to empiric therapy at 10-14 days"],"clinical_score":"Diagnostic triad: CD4 <200 + ring-enhancing brain lesions + positive toxoplasma IgG = treat empirically (95% PPV). Clinical response expected within 7-14 days. Radiological improvement by 2-3 weeks. If no response at 14 days: biopsy (differential: CNS lymphoma, TB, abscess). Prognosis: good with treatment (80-95% respond)."},"Hepatitis B, chronic":{"setting":"Community / Hospital","likely_pathogens":["Hepatitis B virus (HBV; DNA virus, Hepadnaviridae)"],"first_line":[["Tenofovir (TDF)","Adult: TDF 300mg PO OD (indefinite if HBeAg+; minimum 12 months after HBeAg seroconversion + consolidation)  •  Paed (>=12yr, >=35kg): TDF 300mg OD; <12yr: Entecavir 0.015mg/kg OD (max 0.5mg)  [UCG 2023; WHO Hep B 2024 aligned]","A"]],"second_line":[["Entecavir","Adult: 0.5mg PO OD (treatment-naive) or 1mg OD (lamivudine-experienced)  •  Paed (>=2yr, >=10kg): 0.015mg/kg OD (max 0.5mg)  [WHO 2024; UCG alternative]","A"],["Tenofovir alafenamide (TAF)","Adult: 25mg PO OD (if renal/bone concerns with TDF)  •  Paed: limited data  [WHO 2024 conditional]","A"]],"avoid":"Lamivudine monotherapy for HBV (high resistance rate >70% at 5 years; UCG and WHO both discourage). Stopping TDF abruptly in HBV (risk of severe hepatic flare). Interferon in decompensated cirrhosis. Adefovir (inferior to TDF).","notes":"UCG 2023 aligned with WHO Hepatitis B Guidelines 2024. Treatment criteria: HBsAg+ AND (significant fibrosis APRI >=2 OR cirrhosis OR persistent ALT elevation + HBV DNA >20,000 IU/mL HBeAg+ or >2,000 IU/mL HBeAg-). All HIV/HBV co-infected patients: TDF-based ART regardless of HBV treatment criteria (TDF + 3TC + DTG covers both). WHO 2024 update: simplified criteria for treatment eligibility in SSA settings (treat if HBsAg+ and age >30 OR APRI >0.5). Hepatitis B vaccination for all contacts and newborns (birth dose within 24h). Screen all pregnant women [UCG 2023].","recommended_tests":["HBsAg (screening)","HBeAg and anti-HBe (infectivity, treatment monitoring)","HBV DNA viral load (if available; treatment eligibility)","ALT, AST","APRI score (AST-to-Platelet Ratio Index for fibrosis)","FBC + platelets","Creatinine (before TDF)","HIV test (co-infection)","Hepatitis D antibody (if HBsAg+; Delta co-infection worsens prognosis)","AFP + liver USS (HCC screening every 6 months if cirrhotic)","HBsAg in pregnant women  [UCG 2023 mandatory]"],"clinical_score":"APRI score = (AST / upper limit of normal) / (platelet count x10^9/L) x 100. APRI >2 = significant fibrosis (treat). APRI 1-2 = indeterminate. APRI <1 = unlikely significant fibrosis. Treatment endpoint: HBeAg seroconversion (HBeAg+ patients) OR HBsAg loss (rare, functional cure). Monitor ALT + HBV DNA every 6 months on treatment."},"Herpes zoster (shingles)":{"setting":"Community / Hospital","likely_pathogens":["Varicella-zoster virus (VZV) reactivation"],"first_line":[["Aciclovir","Adult: 800mg PO 5 times daily x 7d (start within 72h of rash onset)  •  Paed: 20mg/kg PO QDS x 7d (max 800mg/dose); immunocompromised: 10mg/kg IV Q8h  [UCG 2023]","A"]],"second_line":[["Valaciclovir","Adult: 1g PO TDS x 7d (better bioavailability, simpler dosing)  •  Paed: 20mg/kg PO TDS (max 1g; >=12yr)  [WHO; not in UCG but superior convenience]","A"],["IV Aciclovir (disseminated/ophthalmic/immunocompromised)","Adult: 10mg/kg IV Q8h x 7-10d  •  Paed: 10mg/kg IV Q8h x 7-10d  [UCG 2023 for severe]","A"]],"avoid":"Steroids without antivirals (worsens viral replication). Topical antivirals alone (ineffective for zoster). Delaying treatment beyond 72h (reduced efficacy, though still consider in immunocompromised or if new vesicles appearing).","notes":"UCG 2023: aciclovir 800mg 5x daily x 7d. WHO: same. UCG vs WHO: no significant difference. Herpes zoster is WHO Stage 2 HIV disease if localised (single dermatome) and Stage 4 if disseminated (>=2 dermatomes or visceral). Test for HIV if not known positive. Ophthalmic zoster (V1 trigeminal): urgent ophthalmology referral + IV aciclovir (risk of keratitis, uveitis, vision loss). Hutchinson sign (nose tip vesicles) = nasociliary nerve involvement = high risk of eye disease. Postherpetic neuralgia: amitriptyline 25mg ON, gabapentin, or pregabalin. Pain management: paracetamol + tramadol for acute phase.","recommended_tests":["Clinical diagnosis (dermatomal vesicular rash on erythematous base; usually unilateral)","HIV test (herpes zoster in young adults is an HIV indicator)  [UCG 2023]","CD4 count if HIV+","Tzanck smear (multinucleated giant cells) if diagnosis uncertain","VZV PCR if atypical presentation","FBC, U&E, creatinine (before IV aciclovir)","Ophthalmology review if V1 (forehead/nose) involvement"],"clinical_score":"Severity: Mild (single dermatome, immunocompetent, <72h) = oral aciclovir. Moderate (age >50, severe pain, V1 involvement) = oral aciclovir + analgesia + ophthalmology review. Severe (disseminated >=2 dermatomes, immunocompromised, visceral involvement, encephalitis) = IV aciclovir + admit. Post-herpetic neuralgia risk factors: age >50, severe acute pain, ophthalmic zoster, immunocompromise."},"Measles":{"setting":"Community / Hospital","likely_pathogens":["Measles virus (Morbillivirus, Paramyxoviridae)"],"first_line":[["Supportive care + Vitamin A","Adult: Vitamin A 200,000 IU PO x 2 doses (D1 and D2)  •  Paed: <6mo 50,000 IU x 2 doses; 6-11mo 100,000 IU x 2 doses; >=12mo 200,000 IU x 2 doses  [UCG 2023; WHO EPI aligned]","A"]],"second_line":[["Antibiotics for bacterial superinfection","Adult: Amoxicillin 500mg TDS x 5d (pneumonia/otitis media complication)  •  Paed: Amoxicillin 80-90mg/kg/day TDS x 5d  [UCG 2023 if secondary bacterial infection]","A"],["Ceftriaxone (severe pneumonia complication)","Adult: 2g IV OD  •  Paed: 50-80mg/kg IV OD  [UCG 2023 severe complications]","W"]],"avoid":"Aspirin in children (Reye syndrome). Routine antibiotics without evidence of bacterial superinfection. Ribavirin (no evidence of benefit for measles in immunocompetent). Discharge before completion of Vitamin A doses.","notes":"UCG 2023 and WHO aligned: Vitamin A reduces measles mortality by 50% (Cochrane 2005). Give to ALL measles cases regardless of nutritional status. Notifiable disease. Isolate until 4 days after rash onset. Vitamin A repeat dose at 4-6 weeks if clinical evidence of vitamin A deficiency (night blindness, Bitot spots, corneal ulcer). Complications: pneumonia (most common cause of death), encephalitis, keratitis/blindness, otitis media, croup, diarrhoea. Measles in HIV+: atypical rash or absent rash possible; higher mortality. Post-exposure prophylaxis: measles vaccine within 72h of exposure OR immunoglobulin within 6 days (immunocompromised/pregnant/infants <6mo).","recommended_tests":["Clinical diagnosis (prodrome: coryza, conjunctivitis, cough + Koplik spots + maculopapular rash from hairline downward)","Measles IgM serology (blood sample within 28 days of rash onset)","NOTIFY district health office within 24h  [UCG 2023 mandatory]","FBC (leucopenia common)","CXR if pneumonia suspected","HIV test","Vitamin A status assessment"],"clinical_score":"WHO case classification: Suspected = fever + maculopapular rash + (cough OR coryza OR conjunctivitis). Confirmed = lab (IgM+) or epidemiologically linked. Complicated measles (admit): pneumonia, croup, encephalitis, severe dehydration, keratitis/corneal ulcer, malnutrition, <1 year, immunocompromised. Encephalitis: 1 in 1000 cases, onset 2-6 days post-rash, seizures + altered consciousness; supportive care only."},"Rabies post-exposure prophylaxis":{"setting":"Community / Hospital","likely_pathogens":["Rabies virus (Lyssavirus, Rhabdoviridae)"],"first_line":[["Wound care + Rabies vaccine + RIG (Cat III)","Adult: IMMEDIATE wound washing with soap and water x 15 min + povidone-iodine; Rabies vaccine IM (deltoid) on D0, 3, 7, 14, 28 (Essen 5-dose); Rabies immunoglobulin (RIG) 20 IU/kg infiltrated around wound + remainder IM at distant site  •  Paed: same vaccine schedule (anterolateral thigh if <2yr); same RIG dose  [UCG 2023; WHO Rabies 2018]","A"],["Cat II exposure (minor scratch, no blood)","Adult: wound washing + vaccine only (no RIG)  •  Paed: same  [UCG 2023; WHO 2018]","A"]],"second_line":[["Abbreviated 2-site ID regimen (WHO)","Adult: 0.1mL ID at 2 sites on D0, 3, 7, 28 (TRC/2-2-2-0-2 regimen); saves vaccine  •  Paed: same  [WHO 2018; UCG mentions ID route as alternative to save costs]","A"],["Pre-exposure prophylaxis (high-risk individuals)","Adult: vaccine IM D0, 7 (2-dose pre-exposure; WHO 2018 update)  •  Paed: same  [WHO 2018; for veterinarians, lab workers, travellers to endemic areas]","A"]],"avoid":"Suturing the wound (delays rabies virus access to nerve endings; leave open or delayed closure). Applying irritants (chilli, herbs, traditional remedies) to the wound. Delaying PEP for any reason (rabies is 100% fatal once symptomatic). Withholding RIG for Cat III bites due to cost (negotiate, but vaccine alone is better than nothing). Giving RIG >7 days after first vaccine dose (antibodies already developing).","notes":"UCG 2023 aligned with WHO Rabies 2018. Rabies is 100% fatal once symptomatic. There is no treatment for clinical rabies. PEP is 100% effective if given correctly and promptly. WHO exposure categories: Cat I (touching/feeding, intact skin) = no PEP. Cat II (minor scratch without bleeding, nibbling of uncovered skin) = vaccine only. Cat III (single or multiple transdermal bites, scratches with bleeding, licks on broken skin, mucous membrane exposure, bat contact) = vaccine + RIG. Previously vaccinated individuals: only 2 booster doses (D0, D3), no RIG needed. Dog observation: if the biting dog is healthy after 10 days, PEP can be discontinued (but do NOT delay starting PEP while observing). In Uganda: most rabies from dog bites; also bats, jackals. West Nile is endemic for rabies.","recommended_tests":["Clinical assessment of wound and exposure category  [WHO Cat I/II/III]","No laboratory test needed to initiate PEP (clinical decision)","Dog/animal observation for 10 days if possible (healthy at 10d = unlikely rabid)","Post-mortem brain testing of animal (DFA/dRIT) if animal dies/killed","Rabies antibody titre only for immunocompromised or pre-exposure vaccination verification"],"clinical_score":"WHO exposure category: Cat I = no PEP. Cat II = vaccine only. Cat III = vaccine + RIG. ALWAYS START PEP IMMEDIATELY FOR CAT II AND III. Do not wait for animal observation results. High-risk bite sites (faster progression): face, neck, hands, genitals. Incubation: typically 1-3 months (range 1 week to 1 year). Once symptoms appear (hydrophobia, aerophobia, paralysis): 100% fatal."},"Chickenpox (varicella)":{"setting":"Community / Hospital","likely_pathogens":["Varicella-zoster virus (VZV; primary infection)"],"first_line":[["Supportive care (immunocompetent children)","Adult: not applicable for mild paediatric varicella  •  Paed: paracetamol for fever (NOT aspirin), calamine lotion, adequate hydration, keep nails short  [UCG 2023; WHO]","A"],["Aciclovir (adolescents, adults, immunocompromised)","Adult: 800mg PO 5 times daily x 5-7d (start within 24h of rash)  •  Paed (immunocompromised or >=13yr): 20mg/kg PO QDS x 5d (max 800mg); immunocompromised: 10mg/kg IV Q8h  [UCG 2023]","A"]],"second_line":[["IV Aciclovir (severe/disseminated/neonatal)","Adult: 10mg/kg IV Q8h x 7-10d  •  Paed: 10-20mg/kg IV Q8h x 7-10d (neonatal varicella, varicella pneumonia, encephalitis)  [UCG 2023]","A"]],"avoid":"Aspirin in children (Reye syndrome). NSAIDs/ibuprofen in varicella (increased risk of necrotising fasciitis). Routine antivirals for healthy children <13yr with mild disease (self-limiting). Steroids (immunosuppressive).","notes":"UCG 2023: supportive care for immunocompetent children; aciclovir for adults, adolescents, immunocompromised. WHO: same. No UCG vs WHO conflict. Varicella in pregnancy: risk of congenital varicella syndrome (1st/2nd trimester) and neonatal varicella (5 days before to 2 days after delivery). Treat pregnant women with aciclovir. VZIG (varicella-zoster immunoglobulin) for post-exposure prophylaxis in immunocompromised, pregnant, neonates exposed. Infectivity: 2 days before rash to all lesions crusted. Exclude from school until all vesicles crusted (typically 5-7 days).","recommended_tests":["Clinical diagnosis (successive crops of vesicles on erythematous base in different stages: macule to papule to vesicle to crust)","HIV test if severe or adult presentation  [UCG 2023]","FBC, LFTs (severe cases)","VZV PCR if diagnosis uncertain","CXR if respiratory symptoms (varicella pneumonia)"],"clinical_score":"Severity: Mild (healthy child, <100 lesions, no complications) = supportive care only. Moderate (>100 lesions, adult, secondary infection) = oral aciclovir. Severe (pneumonia, encephalitis, hepatitis, haemorrhagic varicella, disseminated in immunocompromised, neonatal) = IV aciclovir + admit."},"Vulvovaginal candidiasis":{"setting":"Community","likely_pathogens":["Candida albicans (85-90%)","Candida glabrata (azole-resistant, 5-10%)"],"first_line":[["Clotrimazole pessary OR Fluconazole oral","Adult: Clotrimazole 500mg pessary single dose OR Clotrimazole 100mg pessary ON x 6 nights OR Fluconazole 150mg PO single dose  •  Paed (adolescent): same  [UCG 2023; WHO STI 2021 aligned]","A"]],"second_line":[["Nystatin pessary","Adult: 100,000 IU pessary ON x 14d (pregnancy-safe alternative)  •  Paed: same  [UCG 2023]","A"],["Fluconazole (recurrent: >=4 episodes/year)","Adult: 150mg PO weekly x 6 months (maintenance after induction)  •  Paed: not standard  [IDSA VVC 2016; CDC STI 2021]","A"],["Boric acid vaginal (refractory non-albicans)","Adult: 600mg intravaginal capsule ON x 14d (C. glabrata)  •  Paed: not applicable  [CDC STI 2021; not in UCG]","A"]],"avoid":"Oral fluconazole in 1st trimester pregnancy (teratogenic at high doses; use topical clotrimazole or nystatin). Douching. Treating asymptomatic colonisation. Prolonged topical antifungals without investigating underlying cause if recurrent.","notes":"UCG 2023 aligned with WHO STI 2021. CDC STI 2021 adds boric acid for non-albicans species (not in UCG). Recurrent VVC (>=4 episodes/year): investigate for diabetes, HIV, immunosuppression. Distinguish from BV and Trichomonas (speculum + pH + wet mount). Pregnancy: topical azoles (clotrimazole) for 7 days preferred; avoid oral fluconazole. Partner treatment NOT indicated for VVC (not sexually transmitted in most cases).","recommended_tests":["Clinical diagnosis (vulvar itch + thick white curd-like discharge + erythema + vaginal pH <4.5)","Wet mount microscopy (hyphae/pseudohyphae + budding yeast)","Vaginal pH (<4.5 supports candida; >4.5 suggests BV or Trichomonas)","Fungal culture if recurrent or treatment failure (species identification)","Blood glucose / HbA1c if recurrent","HIV test if recurrent / unusual"],"clinical_score":"Classification: Uncomplicated (sporadic, mild-moderate, likely C. albicans, immunocompetent) = single-dose treatment. Complicated (recurrent, severe, non-albicans, pregnancy, immunocompromised, diabetes) = prolonged treatment + investigate underlying cause."},"Dermatophytosis (tinea / ringworm)":{"setting":"Community","likely_pathogens":["Trichophyton rubrum (most common)","Trichophyton mentagrophytes","Microsporum canis (children, animal contact)","Epidermophyton floccosum"],"first_line":[["Topical: Clotrimazole or Miconazole or Terbinafine cream","Adult: apply BD x 2-4 weeks (continue 1 week after clinical clearance)  •  Paed: same  [UCG 2023]","A"],["Oral Griseofulvin (tinea capitis / extensive)","Adult: 500-1000mg PO OD x 6-8 weeks (tinea capitis) or 4-6 weeks (tinea corporis extensive)  •  Paed: 10-20mg/kg OD x 6-8 weeks (give with fatty food)  [UCG 2023; WHO aligned]","A"]],"second_line":[["Oral Terbinafine","Adult: 250mg PO OD x 2-4 weeks (corporis/cruris) or 6 weeks (capitis) or 12 weeks (onychomycosis)  •  Paed (>25kg): 125-250mg OD  [WHO; superior to griseofulvin for T. rubrum]","A"],["Oral Itraconazole","Adult: 200mg PO OD x 1-2 weeks (corporis) or pulse 200mg BD x 1 week/month x 3 months (onychomycosis)  •  Paed: 5mg/kg OD  [IDSA; not in UCG but effective]","W"],["Oral Fluconazole","Adult: 150-300mg PO weekly x 2-6 weeks  •  Paed: 6mg/kg weekly  [alternative for tinea corporis]","A"]],"avoid":"Topical steroids alone (tinea incognito; masks but worsens infection). Topical treatment alone for tinea capitis (must be systemic). Griseofulvin in pregnancy (teratogenic). Terbinafine for tinea capitis caused by Microsporum (griseofulvin superior for Microsporum).","notes":"UCG 2023: topical antifungal for localised tinea corporis/cruris/pedis; oral griseofulvin for tinea capitis (must be systemic). WHO: same. CDC: terbinafine preferred over griseofulvin for T. rubrum tinea capitis (2-week course vs 6-8 weeks). Tinea capitis: examine all household contacts; treat carriers. Tinea corporis: if widespread or not responding to topical at 2 weeks, switch to oral. Onychomycosis: terbinafine 12 weeks (fingernails) or 12-16 weeks (toenails). KOH prep before systemic treatment to confirm diagnosis.","recommended_tests":["Clinical diagnosis (annular erythematous scaly plaque with central clearing + raised advancing edge)","KOH preparation (hyphae visible under microscopy; confirm before systemic Rx)","Fungal culture (species identification; guides systemic choice)","Wood lamp (Microsporum spp. fluoresce green; Trichophyton does not)","HIV test if extensive / recurrent / unusual distribution"],"clinical_score":"Classification by site: Tinea corporis (body) = topical x 2-4wk. Tinea cruris (groin) = topical x 2-4wk. Tinea pedis (foot) = topical x 2-4wk. Tinea capitis (scalp) = ORAL x 6-8wk (topical alone fails). Tinea unguium / onychomycosis (nails) = ORAL x 12-16wk. Tinea manuum (hand) = topical or oral depending on extent."},"Soil-transmitted helminths (ascariasis, hookworm, trichuriasis)":{"setting":"Community","likely_pathogens":["Ascaris lumbricoides (roundworm)","Necator americanus / Ancylostoma duodenale (hookworm)","Trichuris trichiura (whipworm)"],"first_line":[["Albendazole","Adult: 400mg PO single dose  •  Paed (>=1yr): 400mg PO single dose; 12-23mo: 200mg single dose  [UCG 2023; WHO deworming 2017]","A"],["Mebendazole","Adult: 500mg PO single dose OR 100mg BD x 3d  •  Paed (>=1yr): same  [UCG 2023; WHO alternative]","A"]],"second_line":[["Albendazole (heavy Trichuris or hookworm)","Adult: 400mg PO OD x 3d  •  Paed: 400mg OD x 3d (3-day course for heavy infections / Trichuris)  [WHO 2017]","A"],["Ivermectin + Albendazole (Strongyloides co-infection)","Adult: Ivermectin 200mcg/kg PO single + Albendazole 400mg  •  Paed (>=15kg): same  [WHO; if Strongyloides suspected]","A"]],"avoid":"Albendazole/mebendazole in 1st trimester pregnancy (teratogenic in animals; WHO allows in 2nd/3rd trimester for mass drug administration). Treating without stool examination if individual treatment (mass deworming does not require stool exam).","notes":"UCG 2023 aligned with WHO preventive chemotherapy guidelines 2017. Mass deworming (school-age children): albendazole 400mg single dose biannually in high-prevalence areas (Uganda national deworming programme). WHO vs UCG: no difference. Iron supplementation for hookworm-associated anaemia (hookworm is the #1 cause of iron-deficiency anaemia in rural Uganda). Stool microscopy (Kato-Katz) for individual diagnosis. Pregnancy: WHO permits single-dose albendazole in 2nd/3rd trimester during MDA campaigns. WASH (water, sanitation, hygiene) is the definitive prevention.","recommended_tests":["Stool microscopy (Kato-Katz for egg count; identifies species)  [WHO]","FBC (eosinophilia; anaemia in hookworm)","Serum iron / ferritin (hookworm)","Not required for mass drug administration programmes"],"clinical_score":"WHO infection intensity (eggs per gram by Kato-Katz): Ascaris: light <5,000; moderate 5,000-50,000; heavy >50,000. Hookworm: light <2,000; moderate 2,000-4,000; heavy >4,000. Trichuris: light <1,000; moderate 1,000-10,000; heavy >10,000. Heavy infections require 3-day albendazole course."},"Schistosomiasis (bilharzia)":{"setting":"Community / Hospital","likely_pathogens":["Schistosoma mansoni (intestinal; most common in Uganda)","Schistosoma haematobium (urogenital; coastal/lake regions)"],"first_line":[["Praziquantel","Adult: 40mg/kg PO single dose (divide into 2 doses 4-6h apart if GI side effects)  •  Paed (>=4yr): 40mg/kg single dose (crush and mix with soft food)  [UCG 2023; WHO 2022 aligned]","A"]],"second_line":[["Praziquantel (repeat)","Adult: 40mg/kg PO repeated at 2-4 weeks (heavy infection / persistent symptoms)  •  Paed: same  [WHO 2022; if inadequate response]","A"],["Oxamniquine (S. mansoni only; if praziquantel-resistant)","Adult: 15-20mg/kg PO single dose  •  Paed: 20mg/kg single dose  [WHO; rarely needed; limited availability]","A"]],"avoid":"Treatment during acute Katayama fever (praziquantel may worsen immune reaction; use steroids first then treat). Praziquantel in 1st trimester (defer to 2nd trimester; WHO allows in MDA). Swimming in freshwater lakes/rivers in endemic areas without protection.","notes":"UCG 2023 aligned with WHO schistosomiasis guidelines 2022. Mass drug administration: annual praziquantel for school-age children in endemic districts (prevalence >10%). S. mansoni: hepatointestinal (periportal fibrosis, portal hypertension, hepatosplenomegaly). S. haematobium: urogenital (haematuria, bladder calcification, hydronephrosis, squamous cell carcinoma of bladder). Uganda endemic zones: Lake Victoria shores, Albert Nile, Lake Albert, Kazinga Channel. Diagnosis: urine filtration for S. haematobium eggs; Kato-Katz stool for S. mansoni. CCA (Circulating Cathodic Antigen) rapid test increasingly used for S. mansoni  [WHO 2022 recommendation].","recommended_tests":["Stool microscopy (Kato-Katz x 2-3 samples) for S. mansoni","Urine filtration (10-14:00 collection) for S. haematobium","CCA urine rapid test (S. mansoni; WHO-recommended POC test)","FBC (eosinophilia)","Liver USS (periportal fibrosis; Niamey protocol grading)","Urinalysis (haematuria for S. haematobium)","Renal USS (hydronephrosis in S. haematobium)"],"clinical_score":"WHO morbidity grading: S. mansoni hepatointestinal = Niamey USS protocol (grades A-F periportal fibrosis). S. haematobium = bladder wall thickening, hydronephrosis, calcification. Acute schistosomiasis (Katayama fever): 2-8 weeks post-exposure, fever, urticaria, eosinophilia, hepatosplenomegaly; treat with prednisolone then praziquantel."},"Visceral leishmaniasis (Kala-azar)":{"setting":"Hospital","likely_pathogens":["Leishmania donovani (East Africa including Uganda)"],"first_line":[["Sodium stibogluconate (SSG) + Paromomycin","Adult: SSG 20mg/kg/day IM/IV x 17d + Paromomycin 15mg/kg/day IM x 17d  •  Paed: same doses  [UCG 2023; WHO NTD 2022; East Africa combination regimen]","A"]],"second_line":[["Liposomal Amphotericin B","Adult: 3-5mg/kg/day IV x 6-10 doses (total 20-30mg/kg)  •  Paed: same (WHO preferred for HIV co-infection and pregnancy)  [WHO 2022; UCG alternative]","W"],["Miltefosine","Adult: 2.5mg/kg/day PO x 28d (50mg BD if 25-50kg; 50mg TDS if >50kg)  •  Paed (>=2yr, >=12kg): 2.5mg/kg/day PO x 28d  [WHO 2022; oral option; teratogenic]","W"],["SSG monotherapy","Adult: 20mg/kg/day IM/IV x 28-30d  •  Paed: same (longer monotherapy if paromomycin unavailable)  [UCG 2023 alternative]","A"]],"avoid":"Miltefosine in pregnancy (teratogenic) and breastfeeding. SSG in severe cardiac disease (cardiotoxic; ECG monitoring required). Delay in treatment (VL is fatal if untreated). Treating without parasitological or serological confirmation if possible.","notes":"UCG 2023 aligned with WHO NTD guidelines 2022. East Africa preferred: SSG + Paromomycin x 17d (LEAP trial: non-inferior to SSG monotherapy x 30d, shorter, cheaper). HIV-VL co-infection: liposomal amphotericin B preferred (SSG has higher toxicity in HIV+); secondary prophylaxis with monthly liposomal amphotericin B until CD4 >200 x 6 months. Endemic in Uganda: Karamoja (Amudat, Moroto, Nakapiripirit), Pokot. Diagnosis: rK39 rapid test (sensitivity >95% in East Africa) + splenic/bone marrow aspirate for parasitology. Notifiable disease. Test of cure: clinical improvement at 6 months (no parasitological test of cure routinely needed).","recommended_tests":["rK39 rapid diagnostic test (sensitivity >95% in E. Africa)  [UCG 2023; WHO recommended]","Splenic aspirate or bone marrow aspirate (parasitological confirmation; gold standard)","FBC (pancytopenia: anaemia, leucopenia, thrombocytopenia characteristic)","Albumin, total protein (polyclonal hypergammaglobulinaemia)","LFTs, U&E, creatinine","ECG (before SSG; QTc monitoring)","HIV test (co-infection changes treatment and prognosis)","Malaria RDT (rule out co-infection)"],"clinical_score":"WHO case definition: fever >2 weeks + splenomegaly + weight loss in endemic area + positive rK39 or parasitology. Severity: mild (ambulatory, Hb >6, no jaundice) vs severe (Hb <6, jaundice, bleeding, oedema, secondary infections). HIV-VL co-infection: atypical presentation, lower rK39 sensitivity, higher relapse rate, higher mortality. Follow up at 1, 3, 6, 12 months post-treatment for relapse."},"Human African trypanosomiasis (sleeping sickness)":{"setting":"Hospital (Specialist)","likely_pathogens":["Trypanosoma brucei gambiense (West/Central Africa; chronic)","Trypanosoma brucei rhodesiense (East Africa including Uganda; acute)"],"first_line":[["T.b. rhodesiense Stage 1: Suramin","Adult: 4-5mg/kg IV test dose, then 20mg/kg IV on D1, 3, 7, 14, 21 (5 doses total; max 1g/dose)  •  Paed: same mg/kg schedule  [UCG 2023; WHO NTD 2022]","A"],["T.b. rhodesiense Stage 2: Melarsoprol","Adult: 2.2mg/kg IV OD x 10d  •  Paed: same (CNS involvement; toxic but only option for Rhodesiense Stage 2)  [UCG 2023; WHO NTD]","R"],["T.b. gambiense Stage 1: Pentamidine","Adult: 4mg/kg IM/IV OD x 7d  •  Paed: same  [WHO NTD 2022]","A"],["T.b. gambiense Stage 2: Fexinidazole (first oral treatment)","Adult: 1800mg PO OD x 4d then 1200mg OD x 6d (with food)  •  Paed (>=20kg, >=6yr): same  [WHO 2019; revolutionary oral treatment]","W"]],"second_line":[["T.b. gambiense Stage 2: NECT (Nifurtimox-Eflornithine)","Adult: Eflornithine 400mg/kg/day IV div Q6h x 7d + Nifurtimox 15mg/kg/day PO div TDS x 10d  •  Paed: same  [WHO NTD; if fexinidazole unavailable or contraindicated]","W"],["Acoziborole (single-dose oral; gambiense)","Adult: single oral dose (investigational; WHO prequalified 2023)  •  Paed: trials ongoing  [WHO; potential game-changer for elimination]","W"]],"avoid":"Suramin for T.b. gambiense Stage 2 (does not cross BBB). Melarsoprol for gambiense (fexinidazole/NECT far safer). Delaying lumbar puncture (staging determines treatment). Treating without parasitological confirmation.","notes":"UCG 2023 aligned with WHO NTD guidelines. Uganda has BOTH species: T.b. rhodesiense (southeastern Uganda: Tororo, Serere, Soroti) and T.b. gambiense (northwestern Uganda: West Nile, Adjumani, Moyo, Yumbe; near DRC border). STAGING IS CRITICAL: Stage 1 (haemolymphatic: no CNS) vs Stage 2 (meningoencephalitic: trypanosomes in CSF or WCC >5 in CSF). LP mandatory for staging. Fexinidazole: first oral treatment for gambiense, approved WHO 2019; not for rhodesiense. Melarsoprol: 5-10% reactive encephalopathy (fatal in 50% of those affected); prednisolone cover recommended. Notifiable disease. Contact NTD programme for drug supply (WHO provides free).","recommended_tests":["Blood/lymph node aspirate: wet mount for trypanosomes (motile organisms)","CATT (Card Agglutination Test for Trypanosomiasis; gambiense screening)","Lymph node aspirate (enlarged posterior cervical LN = Winterbottom sign; gambiense)","Lumbar puncture (MANDATORY for staging: WCC >5 cells/uL or trypanosomes in CSF = Stage 2)","FBC (anaemia, thrombocytopenia)","ESR (elevated)","LFTs, U&E","NOTIFY National NTD programme"],"clinical_score":"Staging: Stage 1 (haemolymphatic) = fever, headache, lymphadenopathy, hepatosplenomegaly, pruritus. Stage 2 (meningoencephalitic) = sleep disturbance (daytime somnolence, nocturnal insomnia), personality change, confusion, tremor, ataxia, seizures, coma. CSF findings: WCC >5 cells/uL and/or trypanosomes present = Stage 2. Rhodesiense: acute (weeks to months). Gambiense: chronic (months to years). Both fatal if untreated."},"Tetanus":{"setting":"Hospital (ICU)","likely_pathogens":["Clostridium tetani (toxin-mediated: tetanospasmin)"],"first_line":[["Human Tetanus Immunoglobulin (HTIG) + Metronidazole + Wound care","Adult: HTIG 3,000-6,000 IU IM (around wound + distant site) + Metronidazole 500mg IV Q8h x 7-10d + surgical wound debridement  •  Paed: HTIG 500 IU IM (neonatal tetanus) or 3,000 IU (older children) + Metronidazole 7.5mg/kg IV Q8h  [UCG 2023; WHO aligned]","A"],["Diazepam (muscle spasm control)","Adult: 10-30mg IV Q1-4h PRN or infusion 3-10mg/h (severe: ICU + intubation)  •  Paed: 0.1-0.3mg/kg IV Q1-6h (max 10mg; neonatal: 0.1-0.3mg/kg slow IV)  [UCG 2023]","A"],["Tetanus toxoid vaccine","Adult: TT 0.5mL IM (start primary series or booster at a different site from HTIG)  •  Paed: per EPI schedule  [UCG 2023; tetanus does not confer immunity]","A"]],"second_line":[["Penicillin (alternative to metronidazole)","Adult: Benzylpenicillin 2MU IV Q4h x 10d  •  Paed: 100,000 IU/kg/day IV div Q6h  [UCG; WHO notes metronidazole preferred as penicillin may be GABA antagonist]","A"],["Magnesium sulphate (autonomic instability)","Adult: 5g IV loading then 2-3g/h infusion (monitor reflexes, respiration)  •  Paed: 30-50mg/kg IV loading then infusion  [WHO; for severe autonomic dysfunction]","A"]],"avoid":"Wound closure before debridement (anaerobic environment promotes C. tetani). Delay in HTIG (must be given before toxin binds to nerves). Horse serum antitoxin (ATS) preferred only if HTIG unavailable (higher risk of serum sickness). Penicillin as sole antibiotic (metronidazole superior). Overstimulation of the patient (quiet, dark room; minimise procedures).","notes":"UCG 2023 aligned with WHO. Tetanus is preventable by vaccination but still kills ~34,000 globally (mostly neonatal tetanus in LMIC). Treatment is supportive: neutralise unbound toxin (HTIG), kill bacteria (metronidazole), control spasms (diazepam/midazolam), manage autonomic instability (MgSO4), and prevent complications (airway, nutrition, DVT prophylaxis). Neonatal tetanus: HTIG 500IU + metronidazole + diazepam + umbilical care. ICU management for severe cases (Ablett Grade III-IV): intubation + mechanical ventilation + sedation. Recovery takes 2-6 weeks. VACCINATE during admission (tetanus does not confer natural immunity).","recommended_tests":["Clinical diagnosis (trismus, risus sardonicus, opisthotonos, generalised spasms triggered by stimuli)","No laboratory confirmation needed (toxin assay not practical)","Wound assessment and debridement","Vaccination history review","FBC, U&E, creatinine, ABG","CK (rhabdomyolysis from spasms)","Blood glucose","ECG (autonomic instability)"],"clinical_score":"Ablett classification: Grade I (mild) = trismus, generalised stiffness, no spasms, no dysphagia, no respiratory compromise. Grade II (moderate) = trismus, rigidity, mild spasms, mild dysphagia, RR >30. Grade III (severe) = generalised spasms, severe dysphagia, apnoea, HR >120, resting spasms. Grade IVa = Grade III + severe autonomic instability + severe hypertension + tachycardia. Grade IVb = Grade IVa + hypotension. Mortality: Grade I <10%, Grade III-IV 30-60%. Phillips score also used."}},"PAED_HIGHLIGHT":["Acute bloody diarrhoea / dysentery","Acute watery diarrhoea (AWD)","Bacterial meningitis","Chickenpox (varicella)","Malaria, severe","Malaria, uncomplicated (P. falciparum)","Measles","Neonatal sepsis (early-onset and late-onset)","Ophthalmia neonatorum (neonatal conjunctivitis)","Pertussis (whooping cough)","Schistosomiasis (bilharzia)","Soil-transmitted helminths (ascariasis, hookworm, trichuriasis)","Typhoid / enteric fever","Upper respiratory tract infection (pharyngitis, sinusitis, otitis media)","Visceral leishmaniasis (Kala-azar)"],"ANTIBIOTICS":{"Amoxicillin":{"class":"Penicillin","aware":"A","route":"PO","spectrum":"Gram+, some Gram−","notes":"First-line Access antibiotic for CAP, UTI, otitis media."},"Amoxicillin-clavulanate":{"class":"Penicillin+BLI","aware":"A","route":"PO/IV","spectrum":"Broad (incl. anaerobes, some ESBL−)","notes":"Beta-lactamase stable. Key Access drug."},"Ampicillin":{"class":"Penicillin","aware":"A","route":"IV","spectrum":"Gram+, Listeria, Enterococcus","notes":"High resistance in E. coli (~80-100% East Africa)."},"Benzylpenicillin":{"class":"Penicillin","aware":"A","route":"IV/IM","spectrum":"Streptococci, Treponema, Neisseria (declining)","notes":"Still first-line for GAS pharyngitis."},"Cloxacillin/Flucloxacillin":{"class":"Penicillin (anti-staph)","aware":"A","route":"PO/IV","spectrum":"MSSA","notes":"Not active vs MRSA."},"Piperacillin-tazobactam":{"class":"Penicillin+BLI","aware":"W","route":"IV","spectrum":"Broad incl. Pseudomonas, anaerobes","notes":"Hospital Watch antibiotic. Reserve for severe nosocomial."},"Cefalexin":{"class":"Cephalosporin (1G)","aware":"A","route":"PO","spectrum":"Gram+, limited Gram−","notes":"Oral Access cephalosporin for SSTI, simple UTI."},"Cefuroxime":{"class":"Cephalosporin (2G)","aware":"W","route":"PO/IV","spectrum":"Broader Gram−, H. influenzae","notes":"Watch. Surgical prophylaxis."},"Ceftriaxone":{"class":"Cephalosporin (3G)","aware":"W","route":"IV/IM","spectrum":"Broad Gram−, meningeal penetration","notes":"Key Watch drug. Resistance rising 30-50% E. Africa (ESBL). First-line severe infections."},"Ceftazidime":{"class":"Cephalosporin (3G anti-Pseudomonal)","aware":"W","route":"IV","spectrum":"Pseudomonas, Gram−","notes":"Anti-pseudomonal. Not active vs ESBL."},"Cefepime":{"class":"Cephalosporin (4G)","aware":"W","route":"IV","spectrum":"Broad + Pseudomonas, AmpC stable","notes":"Watch. Stable to AmpC but not ESBL/carbapenemase."},"Ceftazidime-avibactam":{"class":"Cephalosporin+BLI","aware":"R","route":"IV","spectrum":"CRE (KPC, OXA-48), ESBL","notes":"RESERVE. Not active vs NDM (metallo-β-lactamase)."},"Meropenem":{"class":"Carbapenem","aware":"W","route":"IV","spectrum":"Ultra-broad: ESBL, AmpC, anaerobes","notes":"Watch. Last reliable Gram− option before Reserve. Preserve."},"Imipenem-cilastatin":{"class":"Carbapenem","aware":"W","route":"IV","spectrum":"Ultra-broad (not Stenotrophomonas)","notes":"Watch. Seizure risk at high dose."},"Ertapenem":{"class":"Carbapenem","aware":"W","route":"IV/IM","spectrum":"Broad (not Pseudomonas, not Acinetobacter)","notes":"Once daily. Useful OPAT option."},"Gentamicin":{"class":"Aminoglycoside","aware":"A","route":"IV/IM","spectrum":"Gram− aerobic, Staph synergy","notes":"Access. Nephro/ototoxic. Resistance 30-50% E. Africa Gram−."},"Amikacin":{"class":"Aminogl ":"Cephalosporin (3G oral)","aware":"W","route":"PO","spectrum":"Gram−, respiratory pathogens","notes":"Watch. Oral 3G cephalosporin; step-down from IV ceftriaxone."},"Benzathine penicillin G":{"class":"Penicillin (long-acting)","aware":"A","route":"IM","spectrum":"Treponema pallidum, GAS (rheumatic fever prophylaxis)","notes":"Access. Single IM dose for primary/secondary syphilis. Monthly IM for rheumatic fever prophylaxis. No resistance in T. pallidum reported."},"Procaine penicillin":{"class":"Penicillin (intermediate-acting)","aware":"A","route":"IM","spectrum":"Streptococci, syphilis, anthrax","notes":"Access. Used in combination with benzathine penicillin for neurosyphilis workup."},"Spectinomycin":{"class":"Aminocyclitol","aware":"A","route":"IM","spectrum":"Neisseria gonorrhoeae","notes":"Access. IM alternative for gonorrhoea when ceftriaxone unavailable. Not effective for pharyngeal gonorrhoea."},"Fluconazole":{"class":"Azole antifungal","aware":"A","route":"PO/IV","spectrum":"Candida spp., Cryptococcus neoformans","notes":"Not an antibiotic - included for HIV-associated infections. Maintenance/consolidation for cryptococcal meningitis. Oropharyngeal/vaginal candidiasis."},"Cefotaxime":{"class":"Cephalosporin (3G)","aware":"W","route":"IV","spectrum":"Broad Gram−, meningeal penetration","notes":"Watch. Alternative to ceftriaxone; preferred in neonates (no calcium interaction). ESBL-susceptible."},"Cefiderocol":{"class":"Siderophore cephalosporin","aware":"R","route":"IV","spectrum":"CRE incl NDM, MDR Pseudomonas, Acinetobacter","notes":"RESERVE. Active vs metallo-β-lactamases (NDM)."}},"BACTERIA":{"Escherichia coli":{"gram":"Gram-negative rod","family":"Enterobacteriaceae","diseases":["UTI (most common cause)","Bacteraemia/sepsis","Intra-abdominal infection","Neonatal meningitis","Traveller's diarrhoea (ETEC)","HAP/VAP (rare)"],"resistance_mechanisms":["ESBL (CTX-M-15 dominant E. Africa)","AmpC","Carbapenemase (NDM-1 emerging)","Fluoroquinolone target mutat function suscClass(p){ return p>=85?"s-hi":p>=70?"s-md":p>=55?"s-lo":"s-vl"; }
function suscColor(p){ return p>=85?"#1B9E5A":p>=70?"#9CB828":p>=55?"#E09B3B":"#D9534F"; }
function levelAbbr(l){ return {"Uganda":"UG","East Africa":"E.Afr","Africa":"Afr","Global":"Global"}[l]||l; }
function awColor(a){ return a==='A'?'#1B9E5A':a==='W'?'#D97706':a==='R'?'#C0392B':'#9AA'; }
function firstAware(syn){ const fl=syn.first_line; return (fl&&fl.length)?(fl[0][2]||"A"):"A"; }
function awareDot(a){ return a==="A"?"🟢":(a&&a.startsWith("W"))?"🟡":"🔴"; }
function drugSafety(name){ const nl=name.toLowerCase();
  for(const k of Object.keys(DRUG_SAFETY)){ const kl=k.toLowerCase(); if(kl.includes(nl.split(" ")[0])||nl.includes(kl)) return DRUG_SAFETY[k]; } return null; }
function mayitoKey(dn){ const n=dn.split("(")[0].split("/")[0].trim().toLowerCase();
  for(const k of Object.keys(MAYITO_NOTES)){ const kn=k.split("(")[0].split("/")[0].trim().toLowerCase(); if(n===kn||n.includes(kn)||kn.includes(n)) return k; } return null; }
function mayitoNotes(dn, synName, setting){ const key=mayitoKey(dn); if(!key) return []; const d=MAYITO_NOTES[key]; const out=[];
  if(d.general) out.push(d.general);
  const unit=_SYN_SETTING_TO_UNIT[setting||""]; const sample=_SYN_TO_SAMPLE[synName||""];
  if(unit && d["unit_"+unit]) out.push(d["unit_"+unit]);
  if(sample && d["sample_"+sample]) out.push(d["sample_"+sample]);
  const paed=/neonat|paediat|pediat|infant/.test((synName||"").toLowerCase());
  if(paed && d["age_0–4"]) out.push(d["age_0–4"]);
  if(d.trend && out.length<4) out.push(d.trend);
  return out.slice(0,4); }

const VIR=["virus","viral","rsv","influenza","rhinovirus","adenovirus","ebv","cmv","hsv","hiv","varicella","measles","mumps","rubella","hepatitis","herpes","dengue","covid","sars","noro","rota","enterovirus","hpv","vzv"];
const FUN=["candida","aspergillus","cryptococcus","histoplasma","pneumocystis","tinea","trichophyton","microsporum","mucor","fusarium"];
const PAR=["plasmodium","leishmania","trypanosoma","schistosoma","ascaris","hookworm","trichuris","toxoplasma","giardia","entamoeba","trichomonas","strongyloides","worm","helminth","protozoa","parasite","taenia","crypto"];
function pClass(p){ const pl=p.toLowerCase(); if(VIR.some(k=>pl.includes(k)))return"viral"; if(FUN.some(k=>pl.includes(k)))return"fungal"; if(PAR.some(k=>pl.includes(k)))return"para"; return"bact"; }

const PHC=new Set(PHC_SYNDROMES), ICU=new Set(ICU_SYNDROMES), PAEDP=new Set(PAED_HIGHLIGHT);
function facLevel(n){ if(ICU.has(n))return"icu"; if(PHC.has(n))return"phc"; return"hosp"; }

/* ---------- utils ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shortOrg(p){ let s=p.split("(")[0].split("—")[0].trim(); const w=s.split(" ");
  if(w.length>=2&&s.length>20) s=w[0][0]+". "+w.slice(1).join(" "); return s.length>26?s.slice(0,25)+"…":s; }
function shortDrug(d){ return d.replace("Piperacillin-tazobactam","Pip-tazo").replace("Ceftazidime-avibactam","Ceftaz-avi").replace("-clavulanate","-clav").replace("Amoxicillin","Amox").replace("Co-trimoxazole","Co-trim").replace("Nitrofurantoin","Nitrofur.").replace("Ciprofloxacin","Cipro").replace("Levofloxacin","Levoflox").replace("Ceftriaxone","Ceftriax").replace("Ceftazidime","Ceftaz").replace("Gentamicin","Gentam").replace("Chloramphenicol","Chloramp").replace("Fosfomycin","Fosfo").replace("Imipenem","Imipen").replace("Meropenem","Merop").replace("Cefepime","Cefep").replace("Amikacin","Amikac").replace("Ampicillin","Ampi").replace("Azithromycin","Azithro").replace("Doxycycline","Doxy").replace("Vancomycin","Vanco").replace("Benzylpenicillin","Benzylpen").replace("Clindamycin","Clinda"); }
function doseHtml(dose, paedMode){ let h=esc(dose);
  if(paedMode){ h=h.replace(/(Paed[^•]*)(•|$)/g,(m,a,b)=>'<span class="paed">'+a.trim()+'</span> '+b); }
  return h; }

const SYN_NAMES=Object.keys(SYNDROMES);
function matchesQuery(name,q){ if(!q)return true; q=q.toLowerCase();
  if(name.toLowerCase().includes(q))return true; const s=SYNDROMES[name];
  if((s.likely_pathogens||[]).some(p=>p.toLowerCase().includes(q)))return true;
  const drugs=[...(s.first_line||[]),...(s.second_line||[])].map(d=>d[0].toLowerCase());
  return drugs.some(d=>d.includes(q)); }
let listQuery="";
function facShort(n){ return {phc:'PHC',hosp:'Hosp',icu:'ICU'}[facLevel(n)]; }
function condRow(n, paed, showTag){

  return '<button class="cond" onclick="openCond(this.dataset.n)" data-n="'+esc(n)+'">'+tag+'<span class="nm">'+star+esc(n)+'</span><span class="chev">›</span></button>';
}
function renderList(){

function paintList(){
  const paed=(tab==='paed'); const q=listQuery.trim();
  const el=document.getElementById('list');
  if(q){  // instant flat suggestions, no groups to expand
    const matches=SYN_NAMES.filter(n=>matchesQuery(n,q));
    if(paed) matches.sort((a,b)=>(PAEDP.has(b)-PAEDP.has(a)));
    if(!matches.length){ el.innerHTML='<div class="no-hits">No conditions match “'+esc(q)+'”.</div>'; return; }
    let html='<div class="sugg-head">'+matches.length+' match'+(matches.length!==1?'es':'')+'</div>';
    for(const n of matches) html+=condRow(n,paed,true);
    el.innerHTML=html; return;
  }
  // no query → collapsed category accordions
  const groups={phc:[],hosp:[],icu:[]};
  for(const n of SYN_NAMES) groups[facLevel(n)].push(n);
  if(paed) for(const k in groups) groups[k].sort((a,b)=>(PAEDP.has(b)-PAEDP.has(a)));
  const order=[["phc","🏥 PHC / Community","grp-phc"],["hosp","🏨 Hospital","grp-hosp"],["icu","🚨 ICU / Specialist","grp-icu"]];
  let html='';
  for(const [k,label,cls] of order){ const items=groups[k];
    html+='<details class="cgroup"><summary><div class="grp-head '+cls+'">'+label+' <span class="cnt">('+items.length+')</span></div></summary><div class="cglist">';
    for(const n of items) html+=condRow(n,paed,false);
    html+='</div></details>';
  }
  el.innerHTML=html;
}

/* ---------- antibiogram table ---------- */
function buildAntibiogram(syn){
  const seen=new Set(), orgs=[];
  for(const p of (syn.likely_pathogens||[])){ if(pClass(p)!=="bact")continue; const k=matchOrg(p); if(!k||seen.has(k))continue; seen.add(k);
    const best=bestSusc(k,scope); if(!best)continue; orgs.push({label:p,key:k,best}); }
  if(!orgs.length) return '<div class="abg-card"><div class="abg-top"><span class="t">🧫 Local antibiogram</span></div><div class="abg-empty">No quantitative susceptibility mapped for this condition\'s organisms (often viral, parasitic or fungal — see regimens below).</div></div>';
  const drugCols=new Set(); orgs.forEach(o=>Object.keys(o.best.susc).forEach(d=>drugCols.add(d)));
  // prioritise the drugs actually being considered (regimen), then Access, then best %S — and cap for phone
  const regTok=new Set();
  [...(syn.first_line||[]),...(syn.second_line||[])].forEach(d=>{ d[0].replace(/[+&]/g,',').split(',').forEach(p=>{ const t=p.trim().toLowerCase().split(" ")[0].replace(/[^a-z\-]/g,''); if(t.length>3) regTok.add(t); }); });
  const isReg=c=>{ const cl=c.toLowerCase(), cf=cl.split(" ")[0]; for(const t of regTok){ if(cl.includes(t)||t.includes(cf)) return true; } return false; };
  const avg=c=>{ let s=0,n=0; orgs.forEach(o=>{ const v=o.best.susc[c]; if(typeof v==='number'){s+=v;n++;} }); return n?s/n:-1; };
  const awRank={A:0,W:1,R:2,"?":3};
  let cols=[...drugCols].sort((a,b)=>{ const ra=isReg(a)?0:1, rb=isReg(b)?0:1; if(ra!==rb)return ra-rb;
    const aa=awRank[awareOf(a)]??3, ab=awRank[awareOf(b)]??3; if(aa!==ab)return aa-ab; return avg(b)-avg(a); });
  const MAXC=5; const hidden=Math.max(0,cols.length-MAXC); cols=cols.slice(0,MAXC);
  let head='<th class="org">Organism</th>';
  for(const c of cols){ const aw=awareOf(c); head+='<th>'+esc(shortDrug(c))+'<span class="aw" style="color:'+awColor(aw)+'">'+aw+'</span></th>'; }
  let rows='';
  for(const o of orgs){ let mx=-1; for(const c of cols){ const v=o.best.susc[c]; if(typeof v==='number'&&v>mx)mx=v; }
    let tds='<td class="org"><span class="on">'+esc(shortOrg(o.label))+'</span><span class="ol">'+levelAbbr(o.best.level)+'</span></td>';
    for(const c of cols){ const v=o.best.susc[c]; if(typeof v!=='number'){ tds+='<td class="na">–</td>'; continue; }
      const best=(v===mx&&v>=70)?' best':''; tds+='<td class="cell '+suscClass(v)+best+'">'+v+'</td>'; }
    rows+='<tr>'+tds+'</tr>'; }
  const anyFb=orgs.some(o=>o.best.level!==scope);
  return '<div class="abg-card"><div class="abg-top"><span class="t">🧫 Local antibiogram — %S</span><span class="s">'+esc(scope)+(anyFb?' +fb':'')+'</span></div>'
    +'<div class="abg-scroll"><table class="abg"><thead><tr>'+head+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
    +'<div class="abg-legend"><span><span class="sw" style="background:var(--s-hi-bg)"></span>≥85%</span><span><span class="sw" style="background:var(--s-md-bg)"></span>70–84%</span><span><span class="sw" style="background:var(--s-lo-bg)"></span>55–69%</span><span><span class="sw" style="background:var(--s-vl-bg)"></span>&lt;55%</span><span>◻ best</span></div>'
    +(hidden?'<div class="abg-note">Showing the '+MAXC+' most relevant agents (regimen &amp; Access first). +'+hidden+' more under 🧫 Antimicrobials → Antibiogram Explorer.</div>':'<div class="abg-note">% susceptible per organism · most‑granular level available (UG → E.Afr → Afr → Global).</div>')
    +'</div>';
}
function resistanceInline(drugName, syn){ const notes=[], seen=new Set();
  const parts=drugName.replace(/[+&]/g,",").split(",").map(s=>s.trim()); const qn=[];
  parts.forEach(p=>{qn.push(p); const fw=p.split(" ")[0].replace(/[+\-/,]+$/,""); if(!qn.includes(fw))qn.push(fw);});
  for(const p of (syn.likely_pathogens||[])){ const k=matchOrg(p); if(!k||seen.has(k))continue; seen.add(k);
    const best=bestSusc(k,scope); if(!best)continue; let pct=null;
    for(const q of qn){ const [ak,pv]=matchDrugInSusc(q,best.susc); if(ak!==null){pct=pv;break;} }
    if(pct===null)continue; const em=pct>=85?"✅":pct>=60?"⚠️":"🚫";
    notes.push('<span>'+em+' '+esc(shortOrg(p))+': '+pct+'%S <small style="color:#9AA">('+levelAbbr(best.level)+')</small></span>'); }
  return notes.join(""); }
function drugCards(list, syn, paedMode){ let h='';
  for(const [name,dose,aware] of list){ const a=aware||'A';
    const cls=a.startsWith('W')?'watch':a.startsWith('R')?'reserve':a.includes('R')?'reserve':a.includes('W')?'watch':'';
    const b=a.startsWith('W')?'b-W':a.startsWith('R')?'b-R':'b-A'; const bl={A:'Access',W:'Watch',R:'Reserve'}[a]||a;
    const rl=resistanceInline(name,syn);
    h+='<div class="drug '+cls+'"><span class="dn">'+esc(name)+'</span>'+(bl?'<span class="badge '+b+'">'+esc(bl)+'</span>':'')
      +'<div class="dd">'+doseHtml(dose,paedMode)+'</div>'+(rl?'<div class="rl">'+rl+'</div>':'')+'</div>'; }
  return h; }

let riskSel={};
function renderDetail(){
  const paed=(tab==='paed'); const name=currentSyn, syn=SYNDROMES[name];
  const lvl=facLevel(name), icd=SYNDROME_ICD[name]||"";
  const tag=lvl==='phc'?'<span class="tag tag-phc">PHC</span>':lvl==='icu'?'<span class="tag tag-icu">ICU / Specialist</span>':'<span class="tag tag-hosp">Hospital</span>';
  const by={bact:[],viral:[],fungal:[],para:[]}; (syn.likely_pathogens||[]).forEach(p=>by[pClass(p)].push(p));
  const cm={bact:['chip-bact','🔬 Bacterial'],viral:['chip-viral','🦠 Viral'],fungal:['chip-fungal','🍄 Fungal'],para:['chip-para','🧬 Parasitic']};
  let chips=''; for(const c of ['viral','bact','fungal','para']) if(by[c].length) chips+='<span class="chip '+cm[c][0]+'">'+cm[c][1]+' ('+by[c].length+')</span>';

  let h='<button class="back" onclick="backToList()">← All conditions</button>';
  h+='<div>'+tag+(paed?' <span class="tag tag-phc" style="background:#FEF3C7;color:#92400E">Paediatric dosing</span>':'')+'</div>';
  h+='<h1 class="cond-title">'+esc(name)+'</h1>';
  h+='<div class="cond-meta">Setting: '+esc(syn.setting||'—')+(icd?' · ICD‑10: '+esc(icd):'')+'</div>';
  h+='<div class="chips">'+chips+'</div>';

  // AMR risk factors
  h+='<details class="panel"><summary>⚠️ AMR risk factors (optional — adjusts recommendation)</summary><div class="body"><div class="rf-grid" id="rfgrid">';
  Object.keys(AMR_RISK_FACTORS).forEach((rf,i)=>{ h+='<label><input type="checkbox" onchange="toggleRisk('+i+')" '+(riskSel[i]?'checked':'')+'> '+esc(rf)+'</label>'; });
  h+='</div><div id="rfflags"></div></div></details>';

  h+='<div class="sec-label">Likely pathogens × local susceptibility</div>'+buildAntibiogram(syn);
  h+='<div class="sec-label">First‑line treatment</div>'+drugCards(syn.first_line||[],syn,paed);
  if((syn.second_line||[]).length) h+='<div class="sec-label">Second‑line / alternative</div>'+drugCards(syn.second_line,syn,paed);
  if(syn.avoid) h+='<div class="warn"><b>⚠️ Avoid / caution:</b> '+esc(syn.avoid)+'</div>';

  // Uganda surveillance context (Mayito)
  const ctx=[]; for(const [dn] of [...(syn.first_line||[]),...(syn.second_line||[])]) for(const n of mayitoNotes(dn,name,syn.setting)) if(!ctx.includes(n)) ctx.push(n);
  if(ctx.length){ h+='<details class="panel"><summary>🇺🇬 Uganda surveillance context</summary><div class="body">'+ctx.slice(0,6).map(n=>'<p class="ctx">🇺🇬 '+esc(n)+'</p>').join("")+'</div></details>'; }

  // Pregnancy & paediatric safety
  const safe=[]; const seenD=new Set();
  for(const [dn] of [...(syn.first_line||[]),...(syn.second_line||[])]){ if(seenD.has(dn))continue; seenD.add(dn); const s=drugSafety(dn); if(s) safe.push('<p class="ctx"><b>'+esc(dn)+'</b> — 🤰 '+esc(s.preg)+' · 👶 '+esc(s.paed)+'</p>'); }
  if(safe.length) h+='<details class="panel"'+(paed?' open':'')+'><summary>🤰 Pregnancy & paediatric safety</summary><div class="body">'+safe.join("")+'</div></details>';

  if(syn.notes) h+='<details class="panel"><summary>📝 Clinical notes'+(syn.clinical_score?' & scoring':'')+'</summary><div class="body">'+esc(syn.notes)+(syn.clinical_score?'<br><br><b>Scoring:</b> '+esc(syn.clinical_score):'')+'</div></details>';
  if((syn.recommended_tests||[]).length) h+='<details class="panel"><summary>🔬 Recommended investigations</summary><div class="body">'+esc(syn.recommended_tests.join(' · '))+'</div></details>';

  h+=logForm(syn);
  V.innerHTML=h; paintRiskFlags();
}

function saveLog(){
  const fac=val('lf_fac').trim(), age=val('lf_age');
  const drugs=[...document.querySelectorAll('#lf_drugs input:checked')].map(c=>c.value);
  const msg=document.getElementById('lf_msg');

  const tiers=drugs.map(d=>ANTIBIOTICS[d]?ANTIBIOTICS[d].aware:'?');
  const overall=tiers.includes('R')?'Reserve':tiers.includes('W')?'Watch':'Access';
  const fol=(document.querySelector('#lf_fol input:checked')||{}).value||'Yes';
  const syn=SYNDROMES[currentSyn];
  const entry={date:new Date().toISOString().slice(0,10), facility:fac, facility_level:val('lf_lvl'),
    prescriber:val('lf_cad'), patient_setting:val('lf_set'), gender:val('lf_g'), age:Number(age),
    syndrome:currentSyn, drugs:drugs.join('; '), num_drugs:drugs.length, overall_aware:overall,
    followed:fol, tool_first_line:(syn.first_line||[]).map(d=>d[0]).join('; ')};
  const log=loadLog(); log.push(entry); localStorage.setItem('rxsteward_log',JSON.stringify(log));

function renderLib(){
  const classes=[...new Set(Object.values(ANTIBIOTICS).map(a=>a.class))].sort();
  let h='<div class="filters">'
   +'<span class="fchip '+(libTiers.A?'on-A':'')+'" onclick="tglTier(\'A\')">🟢 Access</span>'
   +'<span class="fchip '+(libTiers.W?'on-W':'')+'" onclick="tglTier(\'W\')">🟡 Watch</span>'
   +'<span class="fchip '+(libTiers.R?'on-R':'')+'" onclick="tglTier(\'R\')">🔴 Reserve</span>'
   +'<select onchange="libClass=this.value;paintLib()"><option value="">All classes</option>'+classes.map(c=>'<option '+(c===libClass?'selected':'')+'>'+esc(c)+'</option>').join("")+'</select>'
   +'<input placeholder="🔍 Search drug / class / spectrum…" value="'+esc(libSearch)+'" oninput="libSearch=this.value;paintLib()">'
   +'</div><div id="libcount" style="font-size:.75rem;color:var(--muted);margin:2px 0 8px"></div><div id="liblist"></div>';
  document.getElementById('amrbody').innerHTML=h; paintLib();
}
function tglTier(t){ libTiers[t]=!libTiers[t]; renderLib(); }
function paintLib(){
  const q=libSearch.toLowerCase();
  const rows=Object.entries(ANTIBIOTICS).filter(([n,i])=>libTiers[i.aware]
    &&(!libClass||i.class===libClass)
    &&(!q||n.toLowerCase().includes(q)||i.class.toLowerCase().includes(q)||(i.spectrum||'').toLowerCase().includes(q)))
    .sort((a,b)=>a[0].localeCompare(b[0]));
  const lbl={A:'Access',W:'Watch',R:'Reserve'};
  let h=''; for(const [n,i] of rows){ const t=i.aware; const s=drugSafety(n);
    h+='<details class="lib-card '+t+'"><summary class="lib-sum"><span class="dot" style="background:'+awColor(t)+'"></span>'
      +'<span class="nm">'+esc(n)+'</span><span class="cl">'+esc(i.class)+'</span><span class="badge b-'+t+'">'+ (lbl[t]||t) +'</span></summary>'
      +'<div class="lib-body"><div class="meta">Route: '+esc(i.route||'—')+'</div>'
      +'<b>Spectrum:</b> '+esc(i.spectrum||'—')+'<br><b>Notes:</b> '+esc(i.notes||'—')
      +(s?'<div class="meta" style="margin-top:6px">🤰 Pregnancy: '+esc(s.preg)+'  ·  👶 Paed: '+esc(s.paed)+'</div>':'')
      +'</div></details>'; }
  document.getElementById('liblist').innerHTML = h||'<div class="no-hits">No drugs match your filter.</div>';
  document.getElementById('libcount').textContent = rows.length+' drug'+(rows.length!==1?'s':'')+' shown · WHO AWaRe classified';
}
let expOrg=Object.keys(BACTERIA)[0];
function renderExp(){
  const orgs=Object.keys(BACTERIA);
  let h='<div class="filters"><select onchange="expOrg=this.value;paintExp()" style="flex:1 1 100%">'
    +orgs.map(o=>'<option '+(o===expOrg?'selected':'')+'>'+esc(o)+'</option>').join("")+'</select></div><div id="expbody"></div>';
  document.getElementById('amrbody').innerHTML=h; paintExp();
}
function paintExp(){
  const b=BACTERIA[expOrg]; const best=bestSusc(expOrg,scope);
  const avail=["Uganda","East Africa","Africa","Global"].filter(l=>b.susceptibility&&b.susceptibility[l]);
  let h='<div class="exp-head">'+esc(expOrg)+'</div>';
  h+='<div class="exp-facts"><b>'+esc(b.gram||'')+'</b>'+(b.family?' | '+esc(b.family):'')+'</div>';
  if(b.diseases) h+='<div class="exp-facts"><b>Key diseases:</b> '+esc(b.diseases.join(', '))+'</div>';
  if(b.resistance_mechanisms) h+='<div class="exp-facts"><b>Resistance mechanisms:</b> '+esc(b.resistance_mechanisms.join(', '))+'</div>';
  if(b.key_notes) h+='<div class="exp-note">'+esc(b.key_notes)+'</div>';
  h+='<div class="exp-facts" style="color:var(--muted)">✅ Data levels: '+esc(avail.join(', ')||'—')+' · showing '+(best?levelAbbr(best.level):'—')+'</div>';
  if(best){ const items=Object.entries(best.susc).sort((a,b)=>b[1]-a[1]);
    const fac=facility[expOrg]||facility[shortOrg(expOrg)]||null;
    h+='<div style="margin-top:8px">';
    for(const [d,v] of items){ const aw=awareOf(d);
      const facv=fac?(fac[d]!=null?fac[d]:null):null;
      h+='<div class="bar-row"><span class="lab">'+esc(shortDrug(d))+'</span><span class="aw" style="color:'+awColor(aw)+'">'+aw+'</span>'
        +'<span class="bar-wrap"><span class="bar-fill" style="width:'+v+'%;background:'+suscColor(v)+'"></span><span class="bar-val">'+v+'%</span></span>'
        +(facv!=null?'<span class="bar-fac">fac '+facv+'%</span>':'')+'</div>'; }
    h+='</div>';
  }
  h+='<details class="panel" style="margin-top:12px"><summary>📤 Upload facility antibiogram (CSV)</summary><div class="body">'
    +'<div class="uploadbox">CSV columns: <code>organism, antibiotic, percent_susceptible</code>. Stored on this device only.<br><br>'
    +'<input type="file" accept=".csv" onchange="uploadFacility(event)">'
    +(Object.keys(facility).length?'<div class="ok" style="margin-top:8px">Facility data loaded for '+Object.keys(facility).length+' organism(s). Shown as “fac” beside matching bars. <button class="btn btn-ghost" style="padding:4px 10px;margin-left:6px" onclick="clearFacility()">Clear</button></div>':'')
    +'</div></div></details>';
  document.getElementById('expbody').innerHTML=h;
}
function uploadFacility(ev){ const f=ev.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const lines=r.result.split(/\r?\n/).filter(x=>x.trim()); const hdr=lines.shift().split(',').map(s=>s.trim().toLowerCase());
    const io=hdr.indexOf('organism'), ia=hdr.indexOf('antibiotic'), ip=hdr.findIndex(x=>x.startsWith('percent'));
    const d={}; for(const ln of lines){ const c=ln.split(','); const o=(c[io]||'').trim(), a=(c[ia]||'').trim(), p=parseFloat(c[ip]);
      if(!o||!a||isNaN(p))continue; (d[o]=d[o]||{})[a]=p; }
    facility=d; localStorage.setItem('rxsteward_facility',JSON.stringify(d)); paintExp();
  }catch(e){ alert('Could not parse CSV: '+e); } };
  r.readAsText(f); }
function clearFacility(){ facility={}; localStorage.removeItem('rxsteward_facility'); paintExp(); }
function loadFacility(){ try{ return JSON.parse(localStorage.getItem('rxsteward_facility')||'{}'); }catch(e){ return {}; } }
function renderRefs(){ let h='<div class="sec-label">📖 References</div>';
  REFERENCES.forEach((r,i)=>{ const [t,c,u]=r; h+='<div class="ref"><b>'+(i+1)+'. '+esc(t)+'</b><br>'+esc(c)+'<br><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a></div>'; });
  h+='<div class="disclaimer" style="text-align:left">Rx Steward v9.2 — UCG 2023 / WHO / CDC / IDSA syndromic definitions. For clinical decision support only.</div>';
  document.getElementById('amrbody').innerHTML=h; }

/* ---------- Log tab ---------- */
function renderLog(){
  const log=loadLog();
  let h='<div class="sec-label" style="margin-top:14px">📋 Prescribing Log — stewardship analytics</div>';
  if(!log.length){ h+='<div class="exp-note">No prescriptions logged yet. Open any condition (Adult or Paeds) and use the “Log this prescription” section at the bottom. Data is stored privately on this device.</div>'; V.innerHTML=h; return; }
  const total=log.length; const followed=log.filter(e=>String(e.followed).startsWith('Yes')).length;
  const pct=Math.round(followed/total*100); const conds=new Set(log.map(e=>e.syndrome)).size; const facs=new Set(log.map(e=>e.facility)).size;
  h+='<div class="metrics">'
    +'<div class="metric"><div class="v">'+total+'</div><div class="l">Prescriptions logged</div></div>'
    +'<div class="metric"><div class="v">'+pct+'%</div><div class="l">Followed recommendation</div></div>'
    +'<div class="metric"><div class="v">'+conds+'</div><div class="l">Conditions seen</div></div>'
    +'<div class="metric"><div class="v">'+facs+'</div><div class="l">Facilities</div></div></div>';
  // AWaRe distribution
  const awc={Access:0,Watch:0,Reserve:0}; log.forEach(e=>{ if(awc[e.overall_aware]!=null)awc[e.overall_aware]++; });
  h+='<div class="sec-label">AWaRe distribution of prescriptions</div>'+barChart([['Access',awc.Access,'#1B9E5A'],['Watch',awc.Watch,'#D97706'],['Reserve',awc.Reserve,'#C0392B']],total);
  // adherence
  const adh={Yes:0,Partially:0,No:0}; log.forEach(e=>{ if(adh[e.followed]!=null)adh[e.followed]++; });
  h+='<div class="sec-label">Recommendation adherence</div>'+barChart([['Yes',adh.Yes,'#1B9E5A'],['Partially',adh.Partially,'#D97706'],['No',adh.No,'#C0392B']],total);
  // conditions seen
  const cc={}; log.forEach(e=>{ cc[e.syndrome]=(cc[e.syndrome]||0)+1; });
  const top=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([n,v])=>[n,v,'#116E7C']);
  h+='<div class="sec-label">Conditions seen (top 12)</div>'+barChart(top,total,true);
  // table + actions
  h+='<div class="sec-label">All entries</div><div class="abg-scroll"><table class="logtbl"><thead><tr><th>Date</th><th>Facility</th><th>Condition</th><th>Drugs</th><th>AWaRe</th><th>Followed</th></tr></thead><tbody>';
  for(const e of log.slice().reverse()) h+='<tr><td>'+esc(e.date)+'</td><td>'+esc(e.facility)+'</td><td>'+esc(shortCond(e.syndrome))+'</td><td>'+esc(e.drugs)+'</td><td>'+esc(e.overall_aware)+'</td><td>'+esc(e.followed)+'</td></tr>';
  h+='</tbody></table></div>';
  h+='<div style="margin-top:12px;display:flex;gap:10px"><button class="btn btn-primary" onclick="downloadLog()">⬇ Download CSV</button><button class="btn btn-ghost" onclick="clearLog()">🗑 Clear log</button></div>';
  V.innerHTML=h;
}
function barChart(rows,total,longlab){ let h='<div style="margin:2px 0 6px">';
  const mx=Math.max(1,...rows.map(r=>r[1]));
  for(const [lab,v,col] of rows){ const w=Math.round(v/mx*100);
    h+='<div class="bar-row"><span class="lab" style="flex-basis:'+(longlab?190:120)+'px">'+esc(longlab?shortCond(lab):lab)+'</span>'
      +'<span class="bar-wrap"><span class="bar-fill" style="width:'+w+'%;background:'+col+'"></span><span class="bar-val">'+v+'</span></span></div>'; }
  return h+'</div>'; }
function shortCond(s){ return s.length>42?s.slice(0,40)+'…':s; }
function downloadLog(){ const log=loadLog(); if(!log.length)return;
  const cols=['date','facility','facility_level','prescriber','patient_setting','gender','age','syndrome','drugs','num_drugs','overall_aware','followed','tool_first_line'];
  const csv=[cols.join(',')].concat(log.map(e=>cols.map(c=>'"'+String(e[c]==null?'':e[c]).replace(/"/g,'""')+'"').join(','))).join('\n');
  const blob=new Blob([csv],{type:'text/csv'}); const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='rxsteward_log_'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(a.href); }
function clearLog(){ if(confirm('Clear all logged prescriptions on this device?')){ localStorage.removeItem('rxsteward_log'); renderLog(); } }

/* ---------- go ---------- */
render();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(e){console.warn('SW',e);});});}
</script>
