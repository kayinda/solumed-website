d / haemodynamically unstable — PREFERRED)","Adult: Pip-tazo 4.5g IV Q6h + Metronidazole 500mg IV TDS × 4–7d post-source-control  •  Paed: Pip-tazo 100mg/kg (pip) IV Q8h + Metronidazole 7.5mg/kg IV Q8h  — rationale: pip-tazo already contains tazobactam (anti-anaerobic), but adding metronidazole gives better anaerobic depth for faecal peritonitis; pip-tazo handles E. coli, Klebsiella, and Pseudomonas better than ceftriaxone in hospital settings where ESBL rates are high. Note: pip-tazo alone has adequate anaerobic cover; adding metro adds belt-and-braces for faecal spillage.","W+A"],["Amoxicillin-clavulanate (MILD community-acquired, no systemic features, immediate source control possible)","Adult: 1.2g IV TDS  •  Paed: 30mg/kg (amox) IV Q8h — acceptable for mild community-acquired appendicitis/cholecystitis post-source-control. Escalate immediately if any systemic features or no clinical response at 24h.","A"],["Ceftriaxone + Metronidazole (MILD community-acquired, culture-guided or proven susceptible organism)","Adult: Ceftriaxone 2g IV OD + Metronidazole 500mg IV TDS × 4–7d  •  Paed: Ceftriaxone 50–80mg/kg OD + Metronidazole 7.5mg/kg Q8h  — NOTE: Uganda data shows E. coli only 28% ceftriaxone-S overall; this combination is acceptable for mild community peritonitis from a confirmed susceptible source but is NOT reliable empirically in hospital settings with high ESBL prevalence.  [UCG 2023 — data-demoted for hospital use]","W+A"]],"second_line":[["Meropenem (ESBL risk / healthcare-associated / failed first-line / Klebsiella liver abscess / faecal APACHE II >15)","Adult: 1g IV Q8h  •  Paed: 20mg/kg IV Q8h (add metronidazole if faecal peritonitis + meropenem not being given as monotherapy)","W"],["Meropenem + Vancomycin (healthcare-associated + MRSA risk / enterococcal peritonitis / post-ERCP cholangitis)","Adult: Meropenem 1g IV Q8h + Vancomycin 15–20mg/kg IV Q8–12h  •  Paed: Meropenem 20mg/kg Q8h + Vancomycin 15mg/kg Q6h","W+W"]],"avoid":"Antibiotic monotherapy in severe peritonitis. Treatment without source control (surgery / drainage). Prolonged courses >7d post-adequate source control (STOP-IT trial: 4 days sufficient).","notes":"WHO ICD-11: DA90 Peritonitis. Source control (surgery / percutaneous drainage) is paramount. STOP-IT trial (Sawyer NEJM 2015): 4 days antibiotics after adequate source control = non-inferior to longer. Add anti-pseudomonal cover if severe / healthcare-associated / immunocompromised. APACHE II + Mannheim Peritonitis Index for prognosis.","recommended_tests":["FBC, CRP, U&E, LFTs, lipase, glucose","Blood cultures × 2","Lactate (sepsis screen)","Abdominal CT (preferred) or USS","Operative / peritoneal fluid Gram + C&S","Urine pregnancy test (women)","HIV test if recurrent / unusual"],"clinical_score":"Mannheim Peritonitis Index (Linder 1987): age >50 (+5) / female (+5) / organ failure (+7) / malignancy (+4) / preop duration >24h (+4) / non-colonic source (+4) / generalised peritonitis (+6) / exudate clear (0) / cloudy (+6) / faecal-purulent (+12). Score ≤21 = mortality <2%; 21–29 = 20–30%; >29 = >50%. APACHE II for ICU prognosis.  [IDSA cIAI 2017; UCG 2023]"},"Acute cholecystitis / cholangitis (biliary infection)":{"setting":"Hospital","likely_pathogens":["Escherichia coli (most common biliary)","Klebsiella pneumoniae","Enterococcus spp. (especially cholangitis)","Bacteroides fragilis (anaerobic; recurrent / severe)","Streptococcus anginosus group","Enterobacter, Citrobacter (healthcare-associated)"],"first_line":[["Piperacillin-tazobactam (TOKYO GRADE II–III / moderate-severe / hospital-onset — PREFERRED)","Adult: 4.5g IV Q6h  •  Paed: 100mg/kg (pip) IV Q8h × 4–7d  — rationale: pip-tazo covers E. coli, Klebsiella, Enterococcus partially, Bacteroides; more reliable than ceftriaxone in hospital settings with high ESBL prevalence; first choice for moderate-severe cholangitis. Add metronidazole 500mg IV TDS if suspected anaerobic source or recurrent/post-ERCP biliary infection.","W"],["Amoxicillin-clavulanate (TOKYO GRADE I — MILD, community-acquired, immediate drainage planned)","Adult: 1.2g IV TDS  •  Paed: 30mg/kg (amox) IV Q8h — for Grade I (mild) community-acquired cholecystitis where surgical source control within 24h. Escalate to pip-tazo if no biliary drainage within 24h or any clinical deterioration.","A"],["Ceftriaxone + Metronidazole (GRADE I–II mild/moderate, only if ceftriaxone-susceptibility supported by local data)","Adult: Ceftriaxone 2g IV OD + Metronidazole 500mg IV TDS  •  Paed: Ceftriaxone 50–80mg/kg OD + Metronidazole 7.5mg/kg Q8h  — NOTE: Uganda E. coli 28% ceftriaxone-S overall. Use only for mild Grade I where community pathogen and prompt drainage planned; not for Grade III or hospital-acquired biliary infection.  [UCG 2023 — data-limited for empiric use]","W+A"]],"second_line":[["Meropenem (TOKYO GRADE III / ESBL risk / failed first-line / post-ERCP / organ dysfunction)","Adult: 1g IV Q8h  •  Paed: 20mg/kg IV Q8h (Grade III cholangitis with organ dysfunction; ICU admission)","W"],["Vancomycin + Meropenem (Enterococcus / post-ERCP / healthcare-associated / MRSA risk)","Adult: Vancomycin 15–20mg/kg IV Q8–12h + Meropenem 1g IV Q8h  •  Paed: Vancomycin 15mg/kg Q6h + Meropenem 20mg/kg Q8h (Enterococcus especially cholangitis, health-care-associated)","W+W"]],"avoid":"Cefoxitin (poor biliary penetration). Aminoglycoside monotherapy. Delay in biliary drainage for Tokyo Grade III cholangitis (>24h doubles mortality). Treating with antibiotics alone if obstruction present.","notes":"Tokyo Guidelines 18 (TG18) - CHOLECYSTITIS diagnosis: A) local signs (Murphy's sign, RUQ pain) + B) systemic (fever, ↑CRP/WBC) + C) imaging (USS thickened wall >4mm, pericholecystic fluid, sonographic Murphy's). Definite = A+B+C. CHOLANGITIS: A) systemic inflammation + B) cholestasis (bilirubin ≥2, ↑ALP) + C) imaging (biliary dilation, stone/stricture). Suspected = A+(B or C); Definite = A+B+C. Source control = laparoscopic cholecystectomy (within 72h for cholecystitis); ERCP within 24–48h for cholangitis. Grade III (organ dysfunction) → ERCP within 24h (mortality 11–30% even treated).","recommended_tests":["FBC, CRP, U&E, LFTs (ALT, ALP, bilirubin, GGT), amylase/lipase","Blood cultures × 2","USS abdomen (first-line imaging)","CT or MRCP if cholangitis / unclear","Bile cultures (intraoperative or ERCP)","HIV test if unusual presentation"],"clinical_score":"TG18 SEVERITY GRADING for cholangitis:  •  Grade I (mild): no Grade II/III features.  •  Grade II (moderate): ≥2 of: WBC <4 or >12; fever ≥39°C; age ≥75; bilirubin ≥85µmol/L; albumin <70% normal.  •  Grade III (severe): organ dysfunction (CV: vasopressors; renal: creat >177; resp: P/F <300; hepatic: PT-INR >1.5; neuro: GCS <14; haem: plts <100). Grade III → ERCP within 24h; ICU.  [Mayumi et al. JHBPS 2018; Kiriyama et al. JHBPS 2018]"},"Liver abscess (pyogenic & amoebic)":{"setting":"Hospital","likely_pathogens":["Escherichia coli, Klebsiella pneumoniae (pyogenic - biliary / portal source)","Streptococcus anginosus group (pyogenic - cryptogenic)","Bacteroides fragilis + anaerobes (pyogenic)","Entamoeba histolytica (amoebic - diarrhoea history / endemic / single right-lobe lesion)","Klebsiella pneumoniae K1/K2 hypervirulent (cryptogenic SE Asia / metastatic)","Mycobacterium tuberculosis (chronic, miliary, HIV)"],"first_line":[["Pyogenic: Piperacillin-tazobactam + Metronidazole + Percutaneous drainage (MODERATE-SEVERE — PREFERRED)","Adult: Pip-tazo 4.5g IV Q6h + Metronidazole 500mg IV TDS × 4–6 weeks (IV until 48h apyrexial, then PO step-down) + USS/CT-guided drainage if abscess >5cm  •  Paed: Pip-tazo 100mg/kg (pip) IV Q8h + Metronidazole 7.5mg/kg Q8h  — rationale: pip-tazo provides better Gram-neg + Streptococcus anginosus + anaerobic cover than ceftriaxone in hospitalised/ESBL-likely patients; preferred for moderate-severe hospitalised pyogenic abscess.","W+A"],["Amoebic: Metronidazole","Adult: 800mg PO TDS × 7–10d (NO drainage routinely needed - most respond medically)  •  Paed: 15mg/kg PO TDS × 7–10d (max 800mg/dose)  [WHO Amoebiasis 2003]","A"],["+ Diloxanide furoate / Paromomycin (luminal cyst clearance after amoebic abscess)","Adult: Diloxanide 500mg PO TDS × 10d OR Paromomycin 25–35mg/kg/day ÷ TDS × 7d  •  Paed: Diloxanide 20mg/kg/day ÷ TDS × 10d  — always follow metronidazole with a luminal agent to eradicate intraluminal cysts","A"],["Pyogenic: Ceftriaxone + Metronidazole + Drainage (MILD / community-acquired / confirmed susceptible organism)","Adult: Ceftriaxone 2g IV OD + Metronidazole 500mg IV TDS × 4–6 weeks + drainage if >5cm  •  Paed: Ceftriaxone 50–80mg/kg + Metronidazole 7.5mg/kg Q8h  — NOTE: Uganda E. coli only 28% ceftriaxone-S overall; use pip-tazo in preference for hospitalised patients unless confirmed susceptible or definite community origin.  [UCG 2023 — data-limited for empiric hospital use]  [IDSA cIAI 2017]","W+A"]],"second_line":[["Meropenem (ESBL confirmed / Klebsiella hypervirulent / critically ill / failed first-line)","Adult: 1g IV Q8h  •  Paed: 20mg/kg IV Q8h","W"],["Tinidazole (amoebic alternative)","Adult: 2g PO OD × 3d  •  Paed: 50mg/kg PO OD × 3d (max 2g)  [WHO Amoebiasis 2003]","A"]],"avoid":"Routine drainage of amoebic abscesses (medical Rx usually sufficient unless large / left lobe / no response by 5–7d / impending rupture / superinfection). Empiric antibiotics without aspiration where pyogenic suspected (sensitivity guides Rx). Treating amoebic abscess with antibacterials alone (won't work - needs metronidazole).","notes":"WHO ICD-11: DB94 Liver abscess. DIFFERENTIATE PYOGENIC vs AMOEBIC: pyogenic = older, multiple lesions, biliary / portal source, hepato-pancreatobiliary disease; amoebic = single large right lobe, history of dysentery / endemic area / travel, faster onset (1–2 weeks), serology +. Amoebic serology (E. histolytica IgG) sensitivity ~95% after 1 week. CT/USS guides drainage decision: pyogenic >5cm OR no improvement at 7d → drain. Amoebic - drain only if large (>10cm), left-lobe (risk pericardial rupture), no response, impending rupture, or superinfection. Antibiotic duration: pyogenic 4–6 weeks; amoebic 7–10d metronidazole + 10d luminal agent.","recommended_tests":["USS abdomen (first-line imaging - single vs multiple, lobe, size)","CT abdomen with contrast (better characterisation, drainage planning)","FBC, CRP, U&E, LFTs (transaminitis, ↑ALP)","Blood cultures × 2","Abscess aspirate Gram + C&S + microscopy for trophozoites","E. histolytica serology (IgG ELISA) ± antigen detection","Stool E. histolytica antigen / PCR","HIV test","CXR (right diaphragm elevation, sympathetic effusion)"],"clinical_score":"Diagnostic differentiation pyogenic vs amoebic (Sharma JCG 2010): AMOEBIC favoured = single (~75%), right lobe (~80%), age 20–40, M:F 7:1, history of dysentery (~50%), endemic area, anchovy-paste aspirate, E. histolytica IgG+. PYOGENIC favoured = multiple lesions, older age, biliary / appendicular source, mixed organisms on culture, frank pus aspirate. Mortality: amoebic <1% if treated; pyogenic 10–20%. Drainage criteria (IDSA): pyogenic abscess >5cm OR not responding at 7d → percutaneous catheter drainage.  [IDSA cIAI 2017; WHO Amoebiasis 2003]"},"Acute watery diarrhoea (AWD)":{"setting":"Community / Hospital","likely_pathogens":["Viral (rotavirus, norovirus - majority, especially children)","Enterotoxigenic E. coli (ETEC)","Non-typhoidal Salmonella","Campylobacter jejuni","Cryptosporidium / Giardia (chronic)"],"first_line":[["ORS + Zinc","Adult: ORS to replace losses (low-osmolarity formula)  •  Paed: ORS by weight + Zinc 10mg OD <6mo OR 20mg OD ≥6mo × 10–14d (REDUCES duration + future episodes)  [WHO/UNICEF; UCG 2023]","A"],["No antibiotic","Adult/Paed: antibiotics NOT routinely indicated - most AWD is viral/self-limited  [WHO IMCI; UCG 2023]","-"]],"second_line":[["Azithromycin (severe / inflammatory / immunocompromised only)","Adult: 500mg PO OD × 3d  •  Paed: 10mg/kg OD × 3d (max 500mg) - only if severe / immunocompromised / >7d duration  [WHO 2017]","W"],["Nitazoxanide (Cryptosporidium / Giardia confirmed)","Adult: 500mg PO BD × 3d  •  Paed (1–3yr): 100mg BD × 3d; (4–11yr): 200mg BD × 3d; (≥12yr): 500mg BD × 3d","A"]],"avoid":"Routine antibiotics (>80% AWD is viral). Loperamide in dysentery / suspected EHEC (HUS risk). Antibiotics in suspected EHEC (HUS risk). Fluoroquinolones in children unless specific indication.","notes":"WHO clinical case definition: ≥3 loose/liquid stools per day, OR more than usual for the person, WITHOUT visible blood, ≤14 days duration  [WHO/UNICEF Clinical Management of Acute Diarrhoea 2004; ICD-11 1A40.0]. CORE TREATMENT IS REHYDRATION + ZINC (paeds). Most AWD is viral and self-limited (3–5d). Antibiotics indicated only for: severe disease, immunocompromise, prolonged >7d, confirmed bacterial pathogen, traveller's diarrhoea. Address dehydration first - see WHO IMCI Plan A/B/C.","recommended_tests":["Clinical dehydration assessment (WHO IMCI)","Stool microscopy (RBC/WBC/parasites)","Stool C&S only if: severe / persistent >7d / immunocompromised / outbreak  [WHO 2017]","FBC + U&E if dehydration moderate–severe","Blood glucose","HIV test if persistent / recurrent"],"clinical_score":"WHO IMCI dehydration assessment (≥2 features = some/severe):  •  No dehydration: drinks normally, no signs → Plan A (home ORS + zinc).  •  SOME dehydration: restless/irritable, sunken eyes, drinks eagerly, slow skin pinch → Plan B (ORS 75mL/kg over 4h + zinc, then reassess).  •  SEVERE: lethargic/unconscious, sunken eyes, unable to drink, very slow skin pinch (≥2s) → Plan C (IV Ringer's 100mL/kg: <1yr over 6h, ≥1yr over 3h).  [WHO IMCI 2014; UCG 2023]"},"Cholera":{"setting":"Community / Hospital","likely_pathogens":["Vibrio cholerae O1 (Ogawa / Inaba serotypes)","Vibrio cholerae O139 (rare, S Asia)"],"first_line":[["ORS (HIGH VOLUME) + Doxycycline","Adult: ORS 1L for first stool + 200mL per further loose stool; severe → IV Ringer's per WHO Plan C + Doxycycline 300mg PO single dose  •  Paed (≥8yr): same; <8yr: substitute Azithromycin 20mg/kg PO single (max 1g)  [WHO 2017; UCG 2023]","A"]],"second_line":[["Azithromycin","Adult: 1g PO single dose  •  Paed: 20mg/kg PO single (max 1g) - preferred in pregnancy and children <8yr  [WHO 2017]","W"],["Ciprofloxacin","Adult: 1g PO single dose  •  Paed: 20mg/kg PO single (max 1g) - only where doxycycline/azithromycin resistance known","W"],["Tetracycline","Adult: 500mg PO QDS × 3d  •  Paed (≥8yr): 12.5mg/kg PO QDS × 3d - historical first-line, increasing resistance","A"]],"avoid":"Loperamide / antimotility agents. Hypotonic IV fluids in severe cholera (use Ringer's lactate). Delay in fluid resuscitation. Antibiotic monotherapy without aggressive fluid replacement.","notes":"WHO case definition: in an area without known cholera - acute watery diarrhoea (≥3 stools/24h) WITH severe dehydration OR death in patient ≥5yr; in known cholera area / outbreak - acute watery diarrhoea in patient ≥5yr  [WHO 2017]. Hallmark: 'rice-water' stools, profuse volume, rapid dehydration. Confirmed by V. cholerae O1/O139 isolation OR RDT positive in outbreak setting. NOTIFIABLE within 24h to district health office. Cholera treatment centre (CTC) for severe cases. Antibiotic ONLY reduces duration by 1–2d and stool volume - fluid replacement saves lives.","recommended_tests":["Cholera rapid diagnostic test (RDT) - outbreak setting","Stool culture for V. cholerae (confirmation + serotyping + AST)","Severe dehydration assessment","U&E if IV fluids","Blood glucose (hypoglycaemia in children)","NOTIFY district health office within 24h"],"clinical_score":"WHO severity classification:  •  Mild–moderate: no severe dehydration, treat with ORS Plan B.  •  Severe: ≥10% body weight loss, lethargy, weak/absent pulse, hypotension, anuria → IV Plan C: Ringer's lactate 100mL/kg (first 30mL/kg over 30min if ≥1yr, over 1h if <1yr; remaining 70mL/kg over 2.5h ≥1yr, 5h <1yr). Reassess every 15–30min. Goal: restore intravascular volume within 3h.  [WHO 2017 cholera guidelines]"},"Acute bloody diarrhoea / dysentery":{"setting":"Community / Hospital","likely_pathogens":["Shigella spp. (most common cause of dysentery globally)","Salmonella spp. (non-typhoidal invasive)","Campylobacter jejuni","Enteroinvasive E. coli (EIEC)","Enterohaemorrhagic E. coli (EHEC - DO NOT TREAT with antibiotics)","Entamoeba histolytica (amoebic dysentery - needs metronidazole)"],"first_line":[["Ciprofloxacin","Adult: 500mg PO BD × 3d  •  Paed: 15mg/kg PO BD × 3d (max 1g/day)  [WHO Shigellosis 2005; UCG 2023]","W"],["Azithromycin (paediatric preferred / FQ-resistance)","Adult: 500mg PO OD × 3d  •  Paed: 10mg/kg PO OD × 3d (max 500mg) - preferred in children  [WHO 2005]","W"]],"second_line":[["Ceftriaxone (severe / hospitalised)","Adult: 2g IV OD × 3–5d  •  Paed: 50–80mg/kg IV OD × 3–5d (severe / unable to take oral / hospitalised dysentery)","W"],["Metronidazole (amoebic dysentery)","Adult: 800mg PO TDS × 5d  •  Paed: 15mg/kg PO TDS × 5d (max 800mg/dose) - followed by luminal agent  [WHO amoebiasis 2003]","A"],["Diloxanide furoate / Paromomycin (amoebic luminal cyst clearance)","Adult: Diloxanide 500mg PO TDS × 10d OR Paromomycin 25–35mg/kg/day ÷ TDS × 7d  •  Paed: Diloxanide 20mg/kg/day ÷ TDS × 10d (after metronidazole) - eradicate intraluminal cysts","A"]],"avoid":"ANTIBIOTICS IN SUSPECTED EHEC / STEC (bloody diarrhoea with no fever in child after burger/raw produce) - increases HUS risk (Wong et al. NEJM 2000). Loperamide / antimotility agents (worsen invasive infection). Empiric metronidazole without amoeba evidence (mostly Shigella in Uganda).","notes":"WHO clinical case definition of dysentery: diarrhoea with VISIBLE BLOOD in stool, with or without mucus/tenesmus/fever  [WHO Shigellosis 2005; ICD-11 1A03]. Most common cause in SSA = Shigella (S. flexneri, then S. sonnei). Differentiate amoebic (lower abdominal cramps, mild fever, larger volume, RBC clumps with trophozoites on microscopy, NO faecal WBC) from bacterial (fever, tenesmus, smaller volume, faecal WBC ++, RBC). Treat empirically for Shigella; switch to metronidazole if amoebic confirmed. EHEC: bloody diarrhoea + abdominal pain WITHOUT fever - supportive care only, no antibiotics.","recommended_tests":["Stool microscopy: RBC + WBC + trophozoites/cysts (E. histolytica) + ova","Stool C&S (Shigella, Salmonella, Campylobacter)","Stool E. histolytica antigen / PCR (if amoebic suspected)","FBC + U&E (HUS screen if EHEC suspected: thrombocytopenia, anaemia, ↑creatinine)","HIV test","Blood cultures × 2 if febrile / severe"],"clinical_score":"WHO Shigellosis 2005: bloody diarrhoea → empirical antibiotic for Shigella; clinical features alone cannot reliably distinguish bacterial from amoebic. Severity: severe Shigellosis = ≥10 stools/day OR signs of toxicity OR malnutrition OR <2yr → hospitalise + IV antibiotic. HUS triad (microangiopathic haemolytic anaemia + thrombocytopenia + AKI) within 1–2wk of bloody diarrhoea → STOP ANTIBIOTICS, supportive care.  [WHO Shigellosis Guidelines 2005; UCG 2023]"},"Clostridioides difficile infection (CDI)":{"setting":"Hospital / Community (post-antibiotic)","likely_pathogens":["Clostridioides difficile (toxin A/B producing strains)"],"first_line":[["Oral Vancomycin (preferred all severities)","Adult: 125mg PO QDS × 10d (non-severe + severe initial episode)  •  Paed: 10mg/kg PO QDS × 10d (max 125mg/dose)  [IDSA/SHEA 2021]","W"]],"second_line":[["Fidaxomicin (preferred if available; lower recurrence)","Adult: 200mg PO BD × 10d  •  Paed (≥6mo): 16mg/kg/dose PO BD × 10d (max 200mg) - IDSA 2021 preferred if affordable / recurrence concern","R"],["Metronidazole (only if vancomycin / fidaxomicin unavailable; non-severe only)","Adult: 500mg PO TDS × 10d  •  Paed: 7.5mg/kg PO TDS × 10d (max 500mg) - IDSA 2021 NO LONGER first-line","A"],["Oral Vancomycin pulse/taper (recurrent CDI ≥2 episodes)","Adult: 125mg QDS × 10–14d → BD × 7d → OD × 7d → every 2–3 days × 2–8 weeks  •  Paed: 10mg/kg/dose with same taper","W"],["Faecal microbiota transplantation (FMT) - recurrent ≥3 episodes","Adult: per FMT protocol  •  Paed: limited evidence - specialist input","-"]],"avoid":"Antimotility agents (toxin retention). IV vancomycin (no GI penetration). Stopping inciting antibiotic prematurely if essential for primary infection - discuss risk/benefit. Empiric CDI treatment without testing.","notes":"IDSA/SHEA 2021 case definition: ≥3 unformed stools in 24h PLUS positive stool test for C. difficile toxin / NAAT for toxigenic strain. Risk: antibiotic exposure (especially clindamycin, cephalosporins, fluoroquinolones, carbapenems) within preceding 8 weeks. Severity: severe = WBC >15×10⁹/L OR creatinine >133µmol/L. Fulminant = hypotension/shock/ileus/megacolon → consider surgical consult + oral vancomycin 500mg QDS + IV metronidazole 500mg Q8h. Isolate + contact precautions + soap & water hand hygiene (alcohol gel ineffective against spores).","recommended_tests":["Stool C. difficile toxin (EIA) or NAAT (toxin gene)","FBC, U&E, lactate, albumin","Abdominal X-ray if ileus / megacolon suspected (toxic megacolon = colon >7cm)","CT abdomen if severe / complications","STOP non-essential antibiotics where possible"],"clinical_score":"IDSA/SHEA 2021 severity stratification:  •  Non-severe: WBC ≤15×10⁹/L AND creatinine <133µmol/L (1.5mg/dL).  •  Severe: WBC >15 OR creatinine ≥133.  •  Fulminant: hypotension / shock / ileus / megacolon. Recurrence in 25% within 8 weeks; consider fidaxomicin or bezlotoxumab to reduce recurrence.  [Johnson et al. CID 2021]"},"Typhoid / enteric fever":{"setting":"Community / Hospital","likely_pathogens":["Salmonella Typhi","Salmonella Paratyphi A/B/C"],"first_line":[["Ciprofloxacin","Adult: 500mg PO BD × 10–14d  •  Paed: 15mg/kg PO BD × 7–14d (max 1g/day)  [UCG first-line]","W"],["Ceftriaxone","Adult: 2g IV OD × 10–14d  •  Paed: 75mg/kg IV OD × 10–14d (severe)","W"]],"second_line":[["Azithromycin","Adult: 1g PO D1 then 500mg OD × 6d (or 20mg/kg/d × 7d)  •  Paed: 20mg/kg PO OD × 7d (WHO/international preferred if FQ-R suspected; max 1g/day)","W"]],"avoid":"Empiric typhoid Rx without blood culture confirmation when possible. Chloramphenicol monotherapy (relapse, marrow suppression). Treatment <7 days (relapse).","notes":"Blood cultures + bone marrow if available. XDR S. Typhi increasing globally - azithromycin if FQ-R suspected. Vaccinate. Notifiable disease. Treat carriers. Dexamethasone for severe (delirium/shock).","recommended_tests":["Blood cultures × 2 (gold standard, <50% sensitivity)","Stool + urine cultures (carrier screen)","FBC (leucopenia classic)","LFTs, U&E","Widal test (low sensitivity/specificity - supportive only)","Bone marrow culture (highest yield)","HIV test","TCV vaccination status"],"clinical_score":"Severity features: altered mental state, shock, GI bleed, perforation, myocarditis, hepatic dysfunction → IV ceftriaxone + dexamethasone (3mg/kg IV then 1mg/kg Q6h × 48h). Mortality 1% treated, 10–30% untreated."},"Peptic ulcer disease (H. pylori)":{"setting":"Community / Hospital","likely_pathogens":["Helicobacter pylori"],"first_line":[["Triple therapy: PPI + Amoxicillin + Clarithromycin","Adult: PPI BD + Amoxicillin 1g PO BD + Clarithromycin 500mg PO BD × 14d  •  Paed: PPI 1–2mg/kg BD + Amoxicillin 50mg/kg/day ÷ BD + Clarithromycin 15mg/kg/day ÷ BD × 14d  [UCG]","A+W"]],"second_line":[["Bismuth quadruple","Adult: PPI BD + Bismuth subsalicylate 525mg QDS + Metronidazole 500mg TDS + Tetracycline 500mg QDS × 14d  •  Paed: PPI + Bismuth + Metronidazole 20mg/kg/day + Amoxicillin (substitute for tetracycline if <8yr) × 14d (clarithromycin-R areas)","A+A+A+A"],["Concomitant quadruple","Adult: PPI BD + Amoxicillin 1g BD + Metronidazole 500mg BD + Clarithromycin 500mg BD × 14d  •  Paed: same scaled by weight × 14d","A+A+A+W"]],"avoid":"Treatment without confirmed H. pylori (test before treat). Single-drug therapy. Prolonged PPI without H. pylori test.","notes":"Test before treat (urea breath test / stool antigen / endoscopic biopsy). Confirm eradication 4 weeks post-treatment. Alarm features → endoscopy. Stop NSAIDs.","recommended_tests":["H. pylori urea breath test OR stool antigen OR endoscopic biopsy (rapid urease + histology)","FBC (anaemia from chronic loss)","Endoscopy if alarm features (age >55, weight loss, melaena, dysphagia, vomiting)","Test of cure 4 weeks post-Rx (off PPI 2 weeks)"],"clinical_score":"Maastricht VI consensus: 14-day quadruple bismuth or concomitant first-line in high clarithromycin resistance areas (>15%). Eradication >90% achievable with correct regimen."},"Infective endocarditis":{"setting":"Hospital","likely_pathogens":["Staphylococcus aureus","Viridans streptococci","Enterococcus faecalis","Coagulase-negative staphylococci (prosthetic)","HACEK organisms","Streptococcus bovis (colon CA assoc.)"],"first_line":[["Vancomycin + Gentamicin (EMPIRIC NATIVE VALVE — PREFERRED given 56% MRSA Uganda)","Adult: Vancomycin 15–20mg/kg IV Q8–12h (TDM-guided, trough 15–20mg/L) + Gentamicin 1mg/kg IV Q8h × 2 weeks (synergy, short course)  •  Paed: Vancomycin 15mg/kg IV Q6h + Gentamicin 2.5mg/kg IV Q8h  — rationale: MRSA 56% in Uganda tertiary hospitals (Mayito 2024); empiric vancomycin is appropriate for native valve endocarditis until cultures return. De-escalate to flucloxacillin if MSSA confirmed on culture.","W+A"],["Vancomycin + Rifampicin + Gentamicin (PROSTHETIC VALVE — EMPIRIC)","Adult: Vancomycin 15–20mg/kg IV Q8–12h + Rifampicin 300–450mg PO/IV Q8h + Gentamicin 1mg/kg IV Q8h × 2 weeks  •  Paed: Vancomycin 15mg/kg Q6h + Rifampicin 20mg/kg/day ÷ Q12h + Gentamicin 2.5mg/kg Q8h × 2 weeks  — biofilm penetration for prosthetic valve; add rifampicin only after cultures drawn (rifampicin as monotherapy selects resistance rapidly).","W+A+A"]],"second_line":[["Flucloxacillin + Gentamicin (MSSA confirmed on culture — ONLY AFTER SENSITIVITIES)","Adult: Flucloxacillin 2g IV Q4h + Gentamicin 1mg/kg IV Q8h × 2 weeks  •  Paed: Flucloxacillin 50mg/kg IV Q6h + Gentamicin 2.5mg/kg IV Q8h  — step-down from vancomycin only when culture confirms MSSA. Superior to vancomycin for MSSA if confirmed.  [UCG — listed as first-line but data-demoted to culture-directed role given 56% MRSA]","A+A"],["Ceftriaxone (Viridans strep / HACEK organisms — culture-directed)","Adult: 2g IV OD × 4 weeks  •  Paed: 80–100mg/kg IV OD × 4 weeks","W"],["Ampicillin + Ceftriaxone (Enterococcus — culture-directed)","Adult: Ampicillin 2g IV Q4h + Ceftriaxone 2g IV BD × 6 weeks  •  Paed: Ampicillin 50mg/kg Q6h + Ceftriaxone 50mg/kg BD × 6 weeks  — preferred over vancomycin + aminoglycoside for Enterococcus due to nephrotoxicity","A+W"]],"avoid":"Antibiotics before 3 sets of blood cultures (unless septic shock). Aminoglycoside monotherapy. Short courses (<4 weeks native, <6 weeks prosthetic).","notes":"3 sets blood cultures over 24h (different sites). Echocardiogram (TTE → TOE if negative). Surgical consultation early (heart failure, abscess, persistent bacteraemia). Dental review for source. Treat 4–6 weeks.","recommended_tests":["Blood cultures × 3 from different sites, ≥1h apart, BEFORE antibiotics","TTE then TOE (sensitivity 90+% TOE for native valve, 95+% prosthetic)","FBC, U&E, CRP, RF","Urinalysis (microscopic haematuria)","ECG (PR prolongation = abscess)","Dental review","Imaging if embolic features"],"clinical_score":"Modified Duke criteria: Major (2): positive blood culture for typical organism × 2 OR persistent bacteraemia; echocardiographic evidence; new valvular regurgitation. Minor (5): predisposition; fever ≥38°C; vascular phenomena; immunologic phenomena; microbiology not meeting major. Definite = 2 major OR 1 major + 3 minor OR 5 minor. [Li et al. CID 2000]"},"Sepsis / septic shock (undifferentiated)":{"setting":"Hospital / ICU","likely_pathogens":["Escherichia coli","Klebsiella pneumoniae","Staphylococcus aureus","Streptococcus pneumoniae","Pseudomonas aeruginosa (nosocomial)","Polymicrobial"],"first_line":[["Meropenem + Vancomycin (SEVERE / septic shock / hospital-onset / ICU — PREFERRED FIRST-LINE)","Adult: Meropenem 1g IV Q8h + Vancomycin 15–20mg/kg IV Q8–12h (TDM-guided)  •  Paed: Meropenem 20mg/kg IV Q8h + Vancomycin 15mg/kg IV Q6h  — rationale: meropenem 81% E. coli S, 90% Klebsiella S (Uganda); vancomycin for MRSA (56% Uganda S. aureus). De-escalate at 48–72h based on cultures.","W+W"],["Piperacillin-tazobactam + Vancomycin (SEVERE community-onset, Pseudomonas risk)","Adult: Pip-tazo 4.5g IV Q6h + Vancomycin 15–20mg/kg IV Q8–12h  •  Paed: Pip-tazo 100mg/kg (pip) IV Q8h + Vancomycin 15mg/kg IV Q6h  — use where ESBL risk is lower (true community-onset, no prior healthcare contact, no prior antibiotics). Broad Gram-neg + anaerobe + MRSA.","W+W"],["Gentamicin + Cloxacillin (NON-SEVERE community-onset only, source to be controlled within 12h)","Adult: Gentamicin 7mg/kg IV OD + Cloxacillin 2g IV Q4–6h  •  Paed: Gentamicin 7.5mg/kg IV OD + Cloxacillin 50mg/kg IV Q6h  — LIMITED ROLE: ugandan data shows gentamicin 57% E. coli S, 54% Klebsiella S; cloxacillin misses MRSA (56% Uganda). Use ONLY for clearly non-severe (qSOFA <2, lactate <2, MAP normal), definite community origin with no healthcare exposure and only if prompt source control is achievable. Escalate immediately if no response at 12–24h.  [UCG 2023 — retained as downgraded option]","A+A"]],"second_line":[["Meropenem + Vancomycin + Metronidazole (intra-abdominal / pelvic source + ESBL risk)","Adult: Meropenem 1g IV Q8h + Vancomycin 15–20mg/kg Q8–12h + Metronidazole 500mg IV TDS  •  Paed: Meropenem 20mg/kg Q8h + Vancomycin 15mg/kg Q6h + Metronidazole 7.5mg/kg Q8h (add metronidazole when intra-abdominal/pelvic/polymicrobial source suspected)","W+W+A"],["Colistin + Meropenem (suspected or confirmed CRE / NDM — specialist only)","Adult: Colistin 9MU IV loading then 4.5MU IV Q12h + Meropenem 2g IV Q8h (extended infusion 3h)  •  Paed: Colistin 75,000–150,000 IU/kg/day ÷ Q8h + Meropenem 40mg/kg Q8h — RESERVE; call ID/microbiology. Use only where CRE confirmed or strongly suspected (prior carbapenem exposure, healthcare-associated, NDM-endemic unit).","R+W"]],"avoid":"Delay of first antibiotic >1h post-recognition. Antibiotics without blood cultures (if cultures don't delay >45min). Fluid restriction in shock. Vasopressors before adequate fluid resuscitation. Ceftriaxone monotherapy for sepsis in hospitalised/ICU patients — Uganda BSI data: E. coli 28% S overall (44% blood isolates), Klebsiella 38% S (19% blood isolates), ICU/specialised unit isolates only 21%-S (Mayito 2024) — inadequate empiric coverage. Cloxacillin as sole Gram-positive cover where MRSA is >50% likely.","notes":"Surviving Sepsis Campaign (Hour-1 bundle): blood cultures BEFORE antibiotics + lactate + broad-spectrum IV antibiotics within 1h + 30mL/kg crystalloid bolus if MAP <65 or lactate ≥4mmol/L + vasopressors (noradrenaline first-line) for MAP ≥65. De-escalate at 48–72h based on C&S results — carbapenem stewardship is critical (Uganda K. pneumoniae meropenem susceptibility fell ~47% 2020–2023, Mayito 2024). UCG 2023 recommends Gentamicin + Cloxacillin as community-onset first-line but Uganda antibiogram data supports escalation to Meropenem + Vancomycin for moderate-severe presentations given poor susceptibility of key pathogens to both gentamicin and cloxacillin in hospital isolates.","recommended_tests":["Blood cultures × 2 (BEFORE antibiotics if possible)","Lactate (repeat at 2–4h)","FBC, U&E, LFTs, glucose, coagulation, CRP","Urinalysis + urine C&S","CXR","Imaging guided by suspected source","ABG / VBG","HIV test","Procalcitonin (if available, de-escalation guide)"],"clinical_score":"qSOFA: RR ≥22 / Altered mentation / SBP ≤100. ≥2 = high risk of poor outcome (out of ICU). SOFA score for ICU. Septic shock: vasopressor requirement + lactate >2 after fluids. [Sepsis-3, JAMA 2016]"},"Neonatal sepsis (early-onset and late-onset)":{"setting":"Hospital (Neonatal unit)","likely_pathogens":["Group B Streptococcus","Escherichia coli (ESBL)","Klebsiella pneumoniae (ESBL)","Listeria monocytogenes","Staphylococcus aureus (late-onset)","Coagulase-negative staphylococci"],"first_line":[["Ampicillin + Gentamicin (EARLY-ONSET <72h — low-risk, term neonate with maternal risk factors only)","Adult: not applicable  •  Paed (neonate): Ampicillin 50mg/kg IV Q12h (week 1) or Q8h (week 2+) + Gentamicin 5mg/kg IV OD (term neonate, per gestational-age protocol)  — GBS + Listeria cover with Gram-neg synergy; acceptable for early-onset in term neonates with known maternal risk factors. Stop at 36–48h if cultures negative + clinically well.  [UCG first-line early-onset]","A+A"],["Cefotaxime + Vancomycin (LATE-ONSET ≥72h or EARLY-ONSET with clinical deterioration — PREFERRED for most hospitalised neonates in E. Africa)","Adult: not applicable  •  Paed (neonate): Cefotaxime 50mg/kg IV Q12h (week 1) or Q8h (week 2+) + Vancomycin 15mg/kg IV Q12h (term) or Q18–24h (preterm, per gestational-age chart)  — rationale: ESBL Klebsiella common in E. African NICUs (cefotaxime has better GN cover than ampicillin; vancomycin for MRSA/CoNS late-onset); avoid ceftriaxone in neonates with jaundice (bilirubin displacement).","W+W"]],"second_line":[["Meropenem + Vancomycin (ESBL confirmed / clinical failure at 48h / NICU outbreak with known ESBL Klebsiella)","Adult: not applicable  •  Paed (neonate): Meropenem 20mg/kg IV Q12h (week 1) or Q8h (week 2+) + Vancomycin 15mg/kg IV per protocol (ESBL Klebsiella suspected — common E. African NICUs; meropenem 90% Klebsiella S Uganda)","W+W"],["Ampicillin + Gentamicin (early-onset, term, low-risk — see first-line; retained for resource-limited settings where culture is unavailable and clinical presentation is mild)","Adult: not applicable  •  Paed: as above","A+A"]],"avoid":"Ceftriaxone in neonates with jaundice (bilirubin-albumin displacement → kernicterus risk). Aminoglycoside monotherapy. Delay of first antibiotic dose. Long empiric courses >5d without positive cultures or evolving clinical indication. Ampicillin alone for late-onset sepsis (poor Klebsiella/ESBL cover).","notes":"EARLY-ONSET (<72h): GBS, E. coli, Listeria — Ampicillin + Gentamicin is defensible for term neonates with defined maternal risk factors and mild presentation. LATE-ONSET (≥72h): staphylococci (MRSA/CoNS), ESBL Klebsiella predominate in E. African NICUs — cefotaxime + vancomycin preferred over ampicillin + gentamicin for de novo late-onset. LP if any neurological features (bulging fontanelle, seizures, lethargy, high-pitched cry). Stop antibiotics at 36–48h if cultures negative and clinically improved. ESBL Klebsiella neonatal outbreaks common in Uganda — escalate to meropenem + vancomycin if unit outbreak or clinical failure. UCG 2023 recommends ampicillin + gentamicin as first-line — retained for early-onset mild term neonates only.","recommended_tests":["Blood culture (≥1mL)","LP (if neurological features / late-onset / severe / persistent positive blood culture)","FBC, CRP","Urine culture (late-onset)","CXR if respiratory","Mother: HVS GBS status, RPR, HIV, HBV","Surface swabs not routine"],"clinical_score":"Risk factors for early-onset: maternal GBS+ without IAP, PROM >18h, maternal fever >38°C, chorioamnionitis, prematurity. NICE Early-Onset Sepsis Calculator. Late-onset: indwelling devices, prematurity, parenteral nutrition. Sepsis severity: hypothermia or fever, respiratory distress, feeding intolerance, lethargy, perfusion changes."},"Puerperal sepsis / obstetric infections":{"setting":"Hospital (Obstetric)","likely_pathogens":["Group A Streptococcus","Group B Streptococcus","Escherichia coli","Anaerobes (Bacteroides, Peptostreptococcus)","Staphylococcus aureus","Clostridium perfringens (post-abortion)"],"first_line":[["Piperacillin-tazobactam + Clindamycin (SEVERE / septic shock / suspected GAS toxic shock — PREFERRED FIRST-LINE)","Adult: Pip-tazo 4.5g IV Q6h + Clindamycin 900mg IV Q8h (clindamycin suppresses GAS/S. aureus toxin production — critical for streptococcal TSS)  •  Add Vancomycin 15–20mg/kg IV Q8–12h if MRSA or coagulase-negative staph suspected (line, wound, post-CS)  — rationale: pip-tazo covers GNRs + anaerobes + streptococci; clindamycin provides toxin suppression for severe GAS disease which is rapidly fatal without it.","W+A"],["Ampicillin + Gentamicin + Metronidazole (NON-SEVERE, community-onset, no GAS TSS features)","Adult: Ampicillin 2g IV Q6h + Gentamicin 5mg/kg IV OD + Metronidazole 500mg IV TDS  •  — limitation: E. coli only 57% gentamicin S (Uganda); escalate immediately if no response at 24h or clinical deterioration. Covers streptococci, anaerobes, and most community E. coli in uncomplicated endometritis.  [UCG/WHO triple therapy — retained for non-severe]","A+A+A"]],"second_line":[["Meropenem + Clindamycin (severe / ESBL E. coli / failure of first-line)","Adult: Meropenem 1g IV Q8h + Clindamycin 900mg IV Q8h  •  Paed: not applicable (obstetric) — use if clinical deterioration on pip-tazo, ESBL risk (healthcare-associated, prior antibiotics, instrumentation), or confirmed ESBL E. coli on culture.","W+A"],["Piperacillin-tazobactam alone (without GAS TSS features)","Adult: 4.5g IV Q6h (if GAS TSS not a concern; covers polymicrobial, Gram-neg, anaerobes)","W"]],"avoid":"Delay in source control (retained products → ERPC urgently). Doxycycline / fluoroquinolones in pregnancy. Inadequate cover of anaerobes. Missing GAS as cause — rapidly fatal, requires toxin suppression with clindamycin. Underestimating severity: maternal sepsis kills faster than non-obstetric sepsis.","notes":"SOURCE CONTROL ESSENTIAL — ERPC for retained products of conception; do not withhold on antibiotic grounds. Continue antibiotics until 48h apyrexia + clinical improvement. GROUP A STREPTOCOCCAL TSS: most rapidly fatal cause — fever + rash + shock = clindamycin mandatory (toxin suppression). Consider IVIG for confirmed GAS TSS. Notify maternal mortality system for any death or near-miss. GBS bacteraemia: benzylpenicillin 2.4MU IV Q4h is definitive. Post-caesarean wound infection: add MRSA cover. UCG 2023 recommends ampicillin + gentamicin + metronidazole as first-line — retained as non-severe first-line option only; escalate to pip-tazo + clindamycin for severe/deteriorating presentations.","recommended_tests":["Blood cultures × 2","HVS / endometrial swabs","FBC, CRP, U&E, LFTs, lactate, coagulation","Pelvic USS (retained products / abscess)","Urinalysis + culture","Group + save","HIV test"],"clinical_score":"Modified Obstetric Early Warning Score (MEOWS): RR, SpO2, temp, BP, HR, AVPU, urine output. Any red flag → senior review. Sepsis Six bundle within 1 hour: O2, cultures, antibiotics, fluids, lactate, urine output."},"Febrile neutropenia":{"setting":"Hospital (Oncology)","likely_pathogens":["Gram-negative bacilli (E. coli, Klebsiella, Pseudomonas)","Staphylococcus aureus","Coagulase-negative staphylococci","Streptococcus viridans","Candida (prolonged neutropenia)","Aspergillus (prolonged)"],"first_line":[["Piperacillin-tazobactam","Adult: 4.5g IV Q6h  •  Paed: 100mg/kg (pip) IV Q8h (IDSA first-line)","W"],["Meropenem","Adult: 1g IV Q8h  •  Paed: 20mg/kg IV Q8h (ESBL risk / penicillin allergy)","W"]],"second_line":[["+ Vancomycin","Adult: 15–20mg/kg IV Q8–12h  •  Paed: 15mg/kg IV Q6h (add if MRSA / line / mucositis / haemodynamic instability)","W"],["+ Caspofungin","Adult: 70mg IV loading then 50mg IV OD  •  Paed: 70mg/m² loading then 50mg/m² OD (add antifungal if fever >4–7d on broad-spectrum)","R"],["Cefepime","Adult: 2g IV Q8h  •  Paed: 50mg/kg IV Q8h (alternative monotherapy)","W"]],"avoid":"Aminoglycoside monotherapy. Delay of first antibiotic >1h. Stopping empiric antibiotics before count recovery / culture clearance (low-risk patients can step down).","notes":"Start within 1h of fever recognition. MASCC score for risk stratification. Low-risk (≥21): consider outpatient oral therapy. High-risk: IV broad-spectrum. Antifungal if persistent fever >4–7d. Granulocyte colony-stimulating factor if profound neutropenia.","recommended_tests":["Blood cultures × 2 (peripheral + central if line)","FBC + differential","U&E, LFTs, CRP, lactate","Urinalysis + culture","CXR","Cultures from any suspected focus","Galactomannan / β-D-glucan (if available, prolonged neutropenia)","HIV test"],"clinical_score":"MASCC Risk Index: Burden of illness mild (5) / moderate (3) / severe (0) + No hypotension (5) + No COPD (4) + Solid tumour or no fungal infection (4) + No dehydration (3) + Outpatient (3) + Age <60 (2). ≥21 = low risk → consider oral outpatient. <21 = high risk → IV inpatient. [MASCC 2000]"},"Catheter-related bloodstream infection (CRBSI)":{"setting":"Hospital / ICU","likely_pathogens":["Coagulase-negative staphylococci","Staphylococcus aureus","Enterococcus spp.","Gram-negative bacilli","Candida spp. (TPN, prolonged)"],"first_line":[["Remove CVC","Adult: ESSENTIAL (catheter removal if MRSA, fungal, Gram-negative, persistent bacteraemia)  •  Paed: ESSENTIAL - remove non-tunnelled lines if possible","-"],["Vancomycin","Adult: 15–20mg/kg IV Q8–12h (covers CoNS + MRSA)  •  Paed: 15mg/kg IV Q6h","W"]],"second_line":[["+ Cefepime / Meropenem","Adult: Cefepime 2g IV Q8h or Meropenem 1g IV Q8h  •  Paed: Cefepime 50mg/kg Q8h or Meropenem 20mg/kg Q8h (if Gram-negative suspected)","W"],["+ Caspofungin / Fluconazole","Adult: Caspofungin 70mg loading then 50mg OD or Fluconazole 400mg OD  •  Paed: Caspofungin 70mg/m² then 50mg/m² OD or Fluconazole 6–12mg/kg OD (if Candida risk)","R/A"]],"avoid":"Antibiotic lock therapy as sole strategy for S. aureus / fungal. Keeping CVC for these organisms. Empiric anti-fungal in low-risk patients.","notes":"Remove line for S. aureus, Pseudomonas, Candida, mycobacteria, polymicrobial. Antibiotic lock therapy may salvage tunnelled lines for CoNS. Duration: 5–7 days short-term CoNS / 14 days S. aureus / 14 days uncomplicated / 4–6 weeks complicated.","recommended_tests":["Peripheral blood culture × 2 + cultures from each lumen of CVC","Differential time-to-positivity (>2h CVC vs peripheral = CRBSI)","Catheter tip Gram + C&S (if removed)","Echocardiogram (S. aureus or persistent bacteraemia)","Repeat blood cultures Q48–72h until clearance","HIV test"],"clinical_score":"Definition: same organism from CVC + peripheral blood with one of: positive semi-quantitative tip culture / differential time-to-positivity >2h / 3× higher colony count CVC vs peripheral. Complicated CRBSI = endocarditis, septic thrombosis, osteomyelitis."},"Brucellosis":{"setting":"Community / Hospital","likely_pathogens":["Brucella melitensis (small ruminants - most common Uganda)","Brucella abortus (cattle)","Brucella suis (pigs)","Brucella canis (dogs)"],"first_line":[["Doxycycline + Streptomycin","Adult: Doxycycline 100mg PO BD × 6 weeks + Streptomycin 15mg/kg IM OD (max 1g) × first 2–3 weeks  •  Paed (≥8yr): Doxycycline 2.2mg/kg BD × 6 wks + Streptomycin 15mg/kg IM OD × 2 wks; <8yr: Co-trimoxazole 24mg/kg BD + Rifampicin 15mg/kg OD × 6 wks  [WHO Brucellosis 2006; UCG 2023]","A+A"],["Doxycycline + Gentamicin (alternative aminoglycoside)","Adult: Doxycycline 100mg PO BD × 6 weeks + Gentamicin 5mg/kg IV/IM OD × first 7–14 days  •  Paed (≥8yr): same with Gentamicin 7.5mg/kg OD","A+A"]],"second_line":[["Doxycycline + Rifampicin (oral-only alternative)","Adult: Doxycycline 100mg PO BD + Rifampicin 600–900mg PO OD × 6 weeks (oral alternative; slightly higher relapse rate)  •  Paed (≥8yr): Doxycycline 2.2mg/kg BD + Rifampicin 10–20mg/kg OD × 6 wks","A+A"],["Co-trimoxazole + Rifampicin (pregnancy / <8yr)","Adult: not first-choice  •  Paed (<8yr / pregnancy): Co-trimoxazole 24mg/kg PO BD + Rifampicin 15mg/kg OD × 6 weeks","A+A"],["Neuro-/cardio-brucellosis (severe extended regimen)","Adult: Triple therapy = Doxycycline + Rifampicin + Streptomycin/Gentamicin or Ceftriaxone 2g IV OD × 4–6 months minimum  •  Paed: specialist input (severe focal disease)","A+A+A/W"]],"avoid":"Monotherapy (high relapse). Duration <6 weeks (relapse rate 5–40% if shorter). Aminoglycoside in pregnancy (use rifampicin + co-trimoxazole). Pyrazinamide (no activity). Empirical TB treatment without culture (clinical confusion common in Uganda).","notes":"WHO clinical case definition (2006): patient with fever, sweats, malaise, anorexia, weight loss, arthralgia, or myalgia AND epidemiological exposure (occupational: farmer, vet, abattoir; dietary: unpasteurised dairy; geographic: endemic area). Confirmed = isolation from blood/bone marrow/tissue OR ≥4-fold rise in Brucella standard agglutination titre (SAT) ≥1:160 OR positive Rose Bengal test + clinical features. Endemic in Uganda (esp. pastoralist communities). Notifiable in Uganda. Duration: 6 weeks for uncomplicated; 3 months for spondylitis; 4–6 months for endocarditis / neurobrucellosis.","recommended_tests":["Blood cultures × 2–3 (prolonged incubation 21 days; alert lab - Brucella safety risk)","Rose Bengal Plate Test (screening, sensitive 85–95%)","Standard Agglutination Test (SAT) - titre ≥1:160 = positive; ≥4-fold rise diagnostic","Brucella IgM/IgG ELISA (specialist labs)","FBC, U&E, LFTs (transaminitis common)","Echocardiogram if endocarditis suspected","Lumbar puncture if neurobrucellosis (CSF lymphocytic, low glucose)","Spine MRI if back pain (spondylitis)","HIV test"],"clinical_score":"WHO classification: ACUTE (<8 weeks symptoms) → standard 6-week dual therapy. SUBACUTE (8 weeks – 1 year) → dual therapy + extended monitoring. CHRONIC (>1 year) / FOCAL (endocarditis, spondylitis, neurobrucellosis) → triple therapy ≥3 months + specialist input. Brucella endocarditis = leading cause of brucellosis mortality (1–3%); valve replacement often required.  [WHO Brucellosis Guidelines 2006]"},"Leptospirosis":{"setting":"Community / Hospital","likely_pathogens":["Leptospira interrogans (multiple serovars; icterohaemorrhagiae, canicola, pomona, grippotyphosa, hardjo)"],"first_line":[["Doxycycline (mild–moderate, ambulatory)","Adult: 100mg PO BD × 7d  •  Paed (≥8yr): 2.2mg/kg PO BD × 7d (max 100mg/dose); <8yr: Azithromycin 10mg/kg D1 then 5mg/kg D2–5  [WHO Leptospirosis 2003; UCG 2023]","A"],["Benzylpenicillin (severe / hospitalised)","Adult: 1.5MU IV Q6h × 7d  •  Paed: 50,000IU/kg IV Q4–6h × 7d","A"]],"second_line":[["Ceftriaxone (severe / Weil's syndrome)","Adult: 1g IV OD × 7d  •  Paed: 50–80mg/kg IV OD × 7d (severe / non-response to penicillin)  [Suputtamongkol AAC 2004 - non-inferior to penicillin]","W"],["Azithromycin (alternative mild)","Adult: 500mg PO OD × 3d  •  Paed: 10mg/kg PO OD × 3d (max 500mg)","W"],["Amoxicillin (alternative mild)","Adult: 500mg PO TDS × 7d  •  Paed: 50mg/kg/day PO ÷ TDS","A"]],"avoid":"Delay in starting antibiotic past 4–5 days of symptoms (reduced efficacy). Aminoglycosides (nephrotoxicity in already-AKI patients). NSAIDs (bleeding risk in haemorrhagic phase). Doxycycline <8yr.","notes":"WHO clinical case definition: acute febrile illness with headache, myalgia + ≥1 of: meningeal irritation, conjunctival suffusion (CLASSIC), haemorrhage, jaundice, renal failure, haematuria, proteinuria, oliguria/anuria, cough/haemoptysis AND epidemiological exposure (rodent contact, contaminated water/soil, flooding, agriculture, sewage, abattoir, recreational swimming). Confirmed = isolation OR microscopic agglutination test (MAT) ≥4-fold rise OR single MAT ≥1:800 OR IgM ELISA + + epidemiology + clinical. Endemic in Uganda. NOTIFIABLE in Uganda. Jarisch-Herxheimer reaction may occur after first penicillin dose. Bipolar illness: septicaemic phase (4–7d) → immune phase (4–30d).","recommended_tests":["MAT (microscopic agglutination test) - gold standard, paired sera","Leptospira IgM ELISA (acute, available regionally)","Blood cultures × 2 (early; positive only in septicaemic phase first 7d)","Urine PCR / culture (later phase)","FBC (thrombocytopenia common), U&E (AKI), LFTs (hyperbilirubinaemia + modest transaminitis), CK (rhabdomyolysis)","Urinalysis (haematuria, proteinuria, granular casts)","CXR (haemorrhagic pneumonitis)","HIV test"],"clinical_score":"Faine criteria (revised; WHO 2003): A = clinical (fever, headache, myalgia, conjunctival suffusion, meningism, etc.) max 23 pts. B = epidemiological (exposure) max 5 pts. C = laboratory (MAT, ELISA, culture, PCR) max 20 pts. A+B ≥26 OR A+B+C ≥25 = presumptive diagnosis. Severity: ANICTERIC (mild, self-limited 90% of cases) vs ICTERIC = Weil's syndrome (jaundice + AKI + bleeding + myocarditis; mortality 5–40%). ICU for severe.  [WHO Leptospirosis 2003; Faine 1982]"},"Rickettsiosis / tick typhus":{"setting":"Community / Hospital","likely_pathogens":["Rickettsia conorii (Mediterranean spotted fever / African tick-bite fever)","Rickettsia africae (African tick-bite fever - sub-Saharan Africa)","Rickettsia typhi (murine / endemic typhus)","Rickettsia prowazekii (epidemic louse-borne typhus - refugee / war / overcrowding)","Orientia tsutsugamushi (scrub typhus - Asia)","Coxiella burnetii (Q fever - pneumonia, hepatitis, endocarditis)","Anaplasma / Ehrlichia (less common in Africa)"],"first_line":[["Doxycycline","Adult: 100mg PO BD × 7d (or until afebrile + 3d more)  •  Paed: 2.2mg/kg PO BD × 7d ALL AGES (CDC update: rickettsial benefit > teeth-staining risk for short courses)  [CDC RMSF 2016; WHO 2017]","A"]],"second_line":[["Chloramphenicol (pregnancy 1st trimester / true doxycycline intolerance)","Adult: 500mg PO/IV QDS × 7d  •  Paed: 25mg/kg PO/IV Q6h (avoid in neonates - grey baby syndrome)  [CDC 2016]","A"],["Azithromycin (pregnancy alternative, mild cases)","Adult: 500mg PO OD × 3d  •  Paed: 10mg/kg PO OD × 3d (max 500mg) - scrub typhus / mild rickettsiosis in pregnancy","W"],["Doxycycline (extended for Q fever endocarditis)","Adult: 100mg PO BD + Hydroxychloroquine 200mg TDS × 18–24 months (Q fever endocarditis - specialist)  •  Paed: specialist input","A"]],"avoid":"Delay in empirical doxycycline awaiting confirmation (rickettsial illness is potentially fatal if untreated; mortality 5–25% RMSF if untreated). Β-lactams (no activity). Sulphonamides (worsen rickettsiosis). NSAIDs (vasculitis-related bleeding).","notes":"WHO / CDC clinical case definitions vary by agent. AFRICAN TICK-BITE FEVER (R. africae - most common rickettsiosis Uganda): fever + headache + myalgia + ≥1 eschar (tache noire - black-crusted ulcer at tick bite site) + regional lymphadenopathy ± maculopapular/vesicular rash. MEDITERRANEAN SPOTTED FEVER (R. conorii): fever + headache + tache noire + macular rash including palms/soles. EPIDEMIC TYPHUS: in louse-infested settings (refugee camps, prisons, war) - high mortality untreated. EMPIRICAL DOXYCYCLINE if suspected - DO NOT WAIT for serology. Eschar is virtually pathognomonic. Most rickettsial deaths attributable to delayed treatment.","recommended_tests":["Clinical diagnosis usually - START DOXYCYCLINE EMPIRICALLY (serology may take weeks)","Indirect immunofluorescence assay (IFA) - gold standard, paired sera 4-fold rise","Skin biopsy of eschar - PCR + immunohistochemistry","FBC (thrombocytopenia, leucopenia, mild anaemia)","U&E (AKI in severe), LFTs (transaminitis), CK","Lumbar puncture if meningism (mild lymphocytic pleocytosis)","HIV test","Q fever serology (Phase I + Phase II IgG/IgM) if pneumonia/endocarditis"],"clinical_score":"TYPHUS triad: fever + headache + rash. Rickettsial diagnostic clue: ESCHAR (necrotic, eschar-covered ulcer at tick / mite bite site) - pathognomonic for spotted fever / scrub typhus group. RMSF severity score (CDC): ≥3 of fever / headache / rash / thrombocytopenia / hyponatraemia / ↑LDH → start doxycycline immediately. Q fever ENDOCARDITIS (chronic): culture-negative endocarditis + Q fever serology (Phase I IgG ≥1:800) → 18–24 month doxycycline + hydroxychloroquine.  [CDC RMSF 2016; WHO Rickettsiosis 2017]"},"Dental / odontogenic infections":{"setting":"Community / Hospital","likely_pathogens":["Viridans streptococci","Anaerobes (Prevotella, Porphyromonas, Fusobacterium)","Staphylococcus aureus","Streptococcus anginosus group"],"first_line":[["Amoxicillin","Adult: 500mg PO TDS × 5–7d  •  Paed: 50mg/kg/day PO ÷ TDS × 5–7d","A"],["+ Metronidazole (severe/spreading)","Adult: 400mg PO TDS  •  Paed: 7.5mg/kg PO Q8h (if severe/spreading)","A"]],"second_line":[["Amoxicillin-clavulanate","Adult: 625mg PO TDS × 5–7d  •  Paed: 25–45mg/kg/day (amox) PO ÷ TDS","A"],["Clindamycin","Adult: 300mg PO QDS  •  Paed: 10mg/kg PO Q6–8h (penicillin allergy)","A"]],"avoid":"Antibiotics for chronic periodontitis without acute infection. Long courses (>7 days unless drainage delayed).","notes":"Drainage/extraction is primary treatment. Antibiotics adjunctive - 5 days usually sufficient. Ludwig's angina / spreading: IV antibiotics + airway management urgent. Refer to dental services.","recommended_tests":["Pulp testing (clinical exam)","Periapical / OPG X-ray","FBC if systemic features","Blood cultures × 2 (severe)","CT if deep neck space spread suspected","HIV test if unusual / recurrent"],"clinical_score":"Severity: localised (analgesia + dental Rx) → spreading (oral antibiotics + dental) → systemic / facial cellulitis (IV antibiotics + admit) → deep neck space / Ludwig's angina (ICU + ENT/maxfax)."},"Bacterial conjunctivitis":{"setting":"Community","likely_pathogens":["Staphylococcus aureus","Streptococcus pneumoniae","Haemophilus influenzae","Moraxella catarrhalis","Neisseria gonorrhoeae (HYPERACUTE - neonatal/sexually-acquired adult; OPHTHALMIC EMERGENCY)","Chlamydia trachomatis (chronic / neonatal)"],"first_line":[["Chloramphenicol 1% eye drops","Adult: 1 drop Q2h × 48h then QDS × 5–7d  •  Paed: same - first-line for routine bacterial conjunctivitis (all ages)  [UCG 2023; NICE CKS 2024]","A"]],"second_line":[["Fusidic acid 1% eye gel","Adult: 1 drop BD × 7d  •  Paed: same (alternative if chloramphenicol contraindicated)  [NICE CKS]","A"],["Gentamicin 0.3% eye drops","Adult: 1 drop Q2–4h × 5–7d  •  Paed: same","A"],["Azithromycin 1% eye drops","Adult: 1 drop BD × 3d (chlamydial conjunctivitis)  •  Paed: same","W"]],"avoid":"Topical steroids (worsen HSV / mask bacterial keratitis). Antibiotics for clearly viral conjunctivitis (most red-eye, watery discharge, URTI association). Contact lens use during infection. Delay in suspected gonococcal / chlamydial conjunctivitis (refer same day).","notes":"NICE CKS / UCG 2023 case definition: red eye + purulent / mucopurulent discharge + eyelid sticking + minimal pain + NORMAL vision. Most acute conjunctivitis is viral (clear/watery, often bilateral with URTI). Bacterial: purulent discharge, lid crusting in morning, often unilateral initially. Hyperacute purulent conjunctivitis (massive purulent discharge in hours, lid swelling, chemosis) = N. gonorrhoeae → emergency: systemic ceftriaxone IM + topical + ophthalmology same day. Most cases resolve in 5–7d untreated; topical antibiotic shortens by 1–2d.","recommended_tests":["Clinical diagnosis usually","Swab Gram + C&S if: hyperacute (suspect gonococcal), recurrent, neonatal, contact lens user, failed first-line  [NICE CKS]","Visual acuity (must be NORMAL for routine conjunctivitis)","Fluorescein staining (rule out corneal ulcer)","HIV test if recurrent / chlamydial / unusual","NAAT for gonorrhoea/chlamydia if STI suspected"],"clinical_score":"NICE CKS red-flag checklist (refer ophthalmology same day if ANY): reduced visual acuity / pain (not just grit) / photophobia / corneal opacity / hyperacute purulent discharge / contact lens wearer / immunocompromised / recent eye surgery / neonate. Otherwise: trial topical antibiotic 5–7d, review if no improvement.  [NICE CKS Conjunctivitis 2024; UCG 2023]"},"Bacterial keratitis (corneal ulcer)":{"setting":"Hospital (Ophthalmology)","likely_pathogens":["Staphylococcus aureus","Pseudomonas aeruginosa (CONTACT LENS / trauma - aggressive, sight-threatening)","Streptococcus pneumoniae","Moraxella","Fungi (Fusarium, Aspergillus - agricultural trauma)","Acanthamoeba (contact lens + tap water)","Herpes simplex (dendritic ulcer - NOT bacterial; aciclovir)"],"first_line":[["Fortified topical antibiotics (specialist-formulated)","Adult: Fortified Cefazolin 5% (Gram-pos) + Fortified Tobramycin 1.4% (Gram-neg) - alternate every 30–60 min × 24–48h, then taper  •  Paed: same protocol - paediatric ophthalmology essential  [AAO PPP 2018]","R/W"],["Moxifloxacin 0.5% eye drops (or Ciprofloxacin 0.3%)","Adult: 1 drop Q15–30 min for first 6h, then Q1h × 48h, then Q2h, taper over 2–4 weeks (until corneal re-epithelialisation)  •  Paed: same - alternative monotherapy in less severe / Gram-positive predominant","W"]],"second_line":[["Natamycin 5% eye drops (fungal keratitis)","Adult: 1 drop hourly × 1 wk then 6–8× daily - fungal confirmed (Fusarium, Candida)  •  Paed: same - limited evidence","R"],["Voriconazole 1% eye drops (fungal - Aspergillus)","Adult: 1 drop Q1–2h (specialist formulation)  •  Paed: specialist","R"],["Acanthamoeba - PHMB 0.02% + Chlorhexidine 0.02%","Adult: 1 drop hourly × 1 wk then taper × 3–6 months  •  Paed: same - paediatric ophthalmology","R"]],"avoid":"Eye patching (promotes bacterial growth in moist environment). Topical steroids until infection controlled (worsens HSV, fungi, Acanthamoeba; ophthalmologist decision). Contact lens use. Empirical fluoroquinolone monotherapy if SEVERE Pseudomonas keratitis (need fortified Gram-neg cover). Delay in ophthalmology referral.","notes":"AAO Preferred Practice Pattern 2018 case definition: corneal epithelial defect WITH underlying stromal infiltrate ± hypopyon ± anterior chamber reaction. OPHTHALMOLOGY SAME-DAY REFERRAL - sight-threatening, can perforate within hours (esp. Pseudomonas). Risk factors: contact lens wear (esp. extended), corneal trauma (agricultural - fungal risk), dry eye, ocular surface disease, immunocompromise. Corneal scrape essential before starting empirical Rx (sensitivity guides). Fortified antibiotics specialist-formulated in eye departments / hospital pharmacy.","recommended_tests":["URGENT ophthalmology referral (within hours)","Corneal scraping for Gram stain + C&S (essential before treatment)","Fungal culture (Sabouraud's) if agricultural trauma / no response","Acanthamoeba culture / PCR if contact lens user","HSV / VZV PCR if dendritic ulcer pattern","Visual acuity","Slit lamp + fluorescein","HIV test","Contact lens cultures (if applicable)"],"clinical_score":"Severity grading (AAO 2018): MILD = infiltrate <2mm, peripheral cornea, no hypopyon → outpatient with intensive topical Rx + daily review. MODERATE = infiltrate 2–6mm, mid-peripheral, mild AC reaction → admit, intensive topical. SEVERE = infiltrate >6mm OR central cornea OR hypopyon OR ≥30% scleral involvement OR no response → admit, fortified topical + consider IV. Pseudomonas keratitis can perforate within 24–48h.  [AAO Bacterial Keratitis PPP 2018]"},"Ophthalmia neonatorum (neonatal conjunctivitis)":{"setting":"Hospital / Community","likely_pathogens":["Neisseria gonorrhoeae (PEAK day 2–5, MEDICAL EMERGENCY - corneal perforation risk)","Chlamydia trachomatis (most common cause overall; peak day 5–14)","Staphylococcus aureus","Streptococcus pneumoniae","Haemophilus","Herpes simplex virus (rare but severe)"],"first_line":[["Gonococcal - Ceftriaxone single dose + saline lavage","Adult: not applicable  •  Paed (neonate): Ceftriaxone 25–50mg/kg IM/IV single dose (max 125mg) + frequent saline irrigation of pus  [WHO 2014; UCG 2023]","W"],["Chlamydial - Oral Erythromycin","Adult: not applicable  •  Paed (neonate): Erythromycin 12.5mg/kg PO QDS × 14d (covers C. trachomatis pneumonia risk) - counsel re: IHPS risk  [WHO 2014]","A"],["Universal prophylaxis at birth","Adult: not applicable  •  Paed (all neonates): single dose tetracycline 1% OR erythromycin 0.5% eye ointment OR povidone-iodine 2.5% drops within 1h of birth  [WHO 2014; UCG 2023]","A"]],"second_line":[["Azithromycin (chlamydia, IHPS concern)","Adult: not applicable  •  Paed (neonate): 20mg/kg PO OD × 3d (alternative to erythromycin if IHPS risk; limited data)","W"],["Cefotaxime (gonococcal - calcium-containing IV fluids)","Adult: not applicable  •  Paed (neonate): 100mg/kg IM/IV single dose (if ceftriaxone contraindicated due to hyperbilirubinaemia / calcium-containing fluid)","W"]],"avoid":"Ceftriaxone in jaundiced neonate (bilirubin displacement). Ceftriaxone with calcium-containing IV fluids (precipitation risk). Topical antibiotics ALONE for gonococcal / chlamydial (need systemic). Aminoglycoside eye drops as universal prophylaxis (less effective than tetracycline/povidone-iodine).","notes":"WHO Guidelines 2014 / UCG 2023 case definition: purulent conjunctival discharge in neonate ≤30 days of age. Aetiology timing: <24h (chemical irritation from prophylaxis) / 2–5d (gonococcal - peak; sight-threatening) / 5–14d (chlamydial - most common; risk of pneumonitis). UNIVERSAL PROPHYLAXIS at birth is the single most cost-effective intervention. NOTIFY MATERNAL STI STATUS (test mother for HIV, syphilis, gonorrhoea, chlamydia). Both parents need treatment if gono/chlamydial.","recommended_tests":["Conjunctival swab Gram stain (Gram-neg intracellular diplococci = gonorrhoea)","Conjunctival swab C&S (chocolate agar for gono)","NAAT for chlamydia (preferred where available)","HIV test (mother + baby)","Syphilis RPR (mother + baby)","Maternal HVS / endocervical Gram + C&S","Ophthalmology review for corneal involvement"],"clinical_score":"WHO 2014 timing-based clinical suspicion:  •  <24h: chemical (resolves spontaneously).  •  2–5d + heavy purulent discharge + lid oedema + chemosis: HYPERACUTE = gonococcal → systemic ceftriaxone EMERGENCY.  •  5–14d + mucopurulent: chlamydial → systemic erythromycin (pneumonia prophylaxis).  •  >14d: viral / staphylococcal / chlamydial. Risk of corneal perforation in untreated gonococcal ophthalmia: 10–20% within 24–48h.  [WHO Ophthalmia Neonatorum 2014]"},"Endophthalmitis":{"setting":"Hospital (Ophthalmology EMERGENCY)","likely_pathogens":["Coagulase-negative staphylococci (post-cataract - most common)","Staphylococcus aureus","Streptococcus spp. (post-bleb / trauma)","Bacillus cereus (intraocular FB / trauma - fulminant)","Gram-negative (Pseudomonas, Enterobacterales)","Fungi (Candida - endogenous; Aspergillus - trauma)"],"first_line":[["Intravitreal Vancomycin + Ceftazidime + Vitrectomy (severe)","Adult: Vancomycin 1mg in 0.1mL + Ceftazidime 2.25mg in 0.1mL intravitreal - REPEAT every 48–72h until improved + vitrectomy if light perception only or worse  •  Paed: Vancomycin 1mg + Ceftazidime 2.25mg intravitreal - paediatric ophthalmology  [EVS 1995; ESCRS 2017]","R+W"]],"second_line":[["Intravitreal Vancomycin + Amikacin","Adult: Vancomycin 1mg + Amikacin 0.4mg intravitreal  •  Paed: same - if ceftazidime unavailable","R+A"],["Intravitreal Amphotericin B / Voriconazole (fungal)","Adult: Amphotericin B 5–10µg in 0.1mL intravitreal OR Voriconazole 100µg in 0.1mL  •  Paed: specialist","R"],["Systemic adjuncts (IV)","Adult: Vancomycin 15–20mg/kg IV Q8–12h + Ceftazidime 2g IV Q8h (penetration poor - adjunctive only)  •  Paed: Vancomycin 15mg/kg Q6h + Ceftazidime 50mg/kg Q8h","W+W"]],"avoid":"Systemic antibiotics alone (poor intraocular penetration - intravitreal mandatory). Delay in vitrectomy if presenting visual acuity is light perception only. Topical antibiotics alone. Steroids without infection control (intravitreal dexamethasone after antibiotics is option but specialist).","notes":"EVS (Endophthalmitis Vitrectomy Study 1995) / ESCRS 2017 case definition: intraocular inflammation involving vitreous + anterior chamber ± hypopyon, typically following intraocular surgery / penetrating trauma / haematogenous spread. CATEGORIES: post-operative (most common; CoNS, S. aureus) within 6 weeks of cataract/intraocular surgery; bleb-associated (post-glaucoma surgery; aggressive Streptococcus); post-traumatic (Bacillus cereus - fulminant); endogenous (haematogenous - Candida common, IV drug use); post-injection (intravitreal injection complication). VITREOUS TAP for cultures BEFORE intravitreal antibiotics. Vitrectomy indicated if presenting visual acuity = light perception only OR worsening despite intravitreal.","recommended_tests":["Urgent ophthalmology (within 1–2 hours)","Vitreous tap + aqueous tap for Gram + C&S + fungal cultures + PCR","Blood cultures × 2 (endogenous source)","Echocardiogram if endogenous (rule out endocarditis)","FBC, CRP","HIV test","B-scan USS (rule out retinal detachment, intraocular FB)","CT/MRI orbit if FB / orbital cellulitis suspected"],"clinical_score":"EVS 1995 conclusions: presenting visual acuity LIGHT PERCEPTION ONLY → IMMEDIATE vitrectomy (3-fold better visual outcome). Better than light perception → vitreous tap + intravitreal alone. EVS-style classification: acute (≤6 weeks post-op; CoNS dominant) vs delayed (>6 weeks; Propionibacterium acnes - chronic granulomatous). Mortality of vision: untreated endophthalmitis → blindness within days.  [EVS Group Arch Ophthalmol 1995; ESCRS Endophthalmitis 2017]"},"Cryptococcal meningitis (HIV)":{"setting":"Hospital","likely_pathogens":["Cryptococcus neoformans","Cryptococcus gattii"],"first_line":[["Induction: Amphotericin B + Flucytosine","Adult: Amphotericin B 1mg/kg IV OD + Flucytosine 100mg/kg/day PO ÷ Q6h × 1 week (or liposomal Amphotericin 10mg/kg single dose + 2wk flucytosine/fluconazole per AMBITION-cm)  •  Paed: Amphotericin B 1mg/kg IV OD + Flucytosine 100mg/kg/day PO ÷ Q6h × 1 week","W+R"],["Consolidation: Fluconazole","Adult: 800mg PO OD × 8 weeks  •  Paed: 12mg/kg PO OD × 8 weeks (post-induction)","A"]],"second_line":[["Amphotericin B + Fluconazole","Adult: Amphotericin B 1mg/kg IV OD + Fluconazole 1200mg PO OD × 2 weeks  •  Paed: Amphotericin B 1mg/kg IV OD + Fluconazole 12mg/kg/day PO OD (if flucytosine unavailable)","W+A"],["High-dose Fluconazole + Flucytosine","Adult: Fluconazole 1200mg OD + Flucytosine 100mg/kg/day × 2 weeks  •  Paed: Fluconazole 12mg/kg OD + Flucytosine 100mg/kg/day × 2 weeks (if amphotericin unavailable - inferior outcomes)","A+R"],["Maintenance: Fluconazole","Adult: 200mg PO OD until CD4 >200 ≥6 months on ART  •  Paed: 6mg/kg PO OD until immune reconstitution","A"]],"avoid":"Fluconazole monotherapy induction. Immediate ART (wait 4–6 weeks - COAT trial). Mannitol/steroids for raised ICP. Stopping fluconazole before immune reconstitution.","notes":"WHO 2022: flucytosine+amphotericin 1-week induction preferred (or AMBITION-cm liposomal Amphotericin single dose where available). CrAg screen at CD4<200. Therapeutic LP for raised ICP. Delay ART 4–6 weeks (COAT trial). Maintenance fluconazole until CD4 >200 sustained.","recommended_tests":["LP: India ink + CrAg + C&S + opening pressure [WHO 2022]","Serum CrAg (screening at CD4<200) [WHO 2022]","CD4 count [UCG 2023]","Blood culture (Cryptococcus) [WHO 2022]","Daily/alternate-day therapeutic LP if opening pressure >25cmH2O [WHO 2022]","HIV viral load","LFTs, U&E baseline + during amphotericin"],"clinical_score":"Raised ICP management: If opening pressure >25cmH2O → drain CSF to 20cmH2O or 50% of opening pressure. Daily LPs until pressure normal. Do NOT use mannitol or steroids for crypto ICP. [WHO 2022]"},"Malaria, uncomplicated (P. falciparum)":{"setting":"Community / Hospital","likely_pathogens":["Plasmodium falciparum (>95% of Uganda malaria)","Plasmodium vivax (rare, <1%)","Plasmodium malariae","Plasmodium ovale"],"first_line":[["Artemether-Lumefantrine (AL / Coartem)","Adult: 4 tabs (80/480mg) at 0, 8, 24, 36, 48, 60h (6 doses over 3d)  •  Paed: weight-band dosing per UCG (5-14kg: 1 tab; 15-24kg: 2 tabs; 25-34kg: 3 tabs per dose x 6 doses)  [UCG 2023; WHO aligned]","A"]],"second_line":[["Artesunate-Amodiaquine","Adult: AS 4mg/kg + AQ 10mg/kg OD x 3d  •  Paed: weight-band FDC x 3d  [UCG 2023 alternative; WHO aligned]","A"],["Dihydroartemisinin-Piperaquine (DHA-PPQ)","Adult: weight-based OD x 3d  •  Paed: weight-band x 3d (UCG alternative; WHO recommends as equal first-line)","A"],["Quinine","Adult: 10mg/kg PO TDS x 7d + Clindamycin 10mg/kg BD x 7d (if ACTs unavailable)  •  Paed: same doses (quinine taste is a challenge in children)  [UCG rescue]","A"]],"avoid":"Chloroquine monotherapy (widespread P. falciparum resistance in Uganda). Artemisinin monotherapy (promotes resistance; WHO banned oral artemisinin monotherapy). SP for treatment (reserve for IPTp). Mefloquine in 1st trimester.","notes":"UCG 2023 first-line: AL (Coartem). WHO 2023 Treatment Guidelines: any ACT (AL, AS-AQ, DHA-PPQ) equally recommended. No UCG vs WHO conflict. Parasitological confirmation (mRDT or microscopy) before treatment is mandatory per WHO 2023. Treat within 24h of symptom onset. Give with fatty food (AL absorption). Repeat dose if vomiting within 30 min. Malaria in pregnancy: 1st trimester quinine + clindamycin x 7d; 2nd/3rd trimester AL or ACT  [UCG 2023; WHO 2023]. Notifiable disease in Uganda.","recommended_tests":["Malaria RDT (HRP2/pLDH) or blood smear (thick + thin film)  [UCG mandatory]","FBC (anaemia, thrombocytopenia)","Blood glucose (hypoglycaemia)","Repeat RDT/smear if negative but high clinical suspicion at 12-24h"],"clinical_score":"WHO severity criteria for uncomplicated: parasitaemia without danger signs. Danger signs that reclassify to severe: prostration, impaired consciousness, respiratory distress, multiple convulsions, circulatory collapse, abnormal bleeding, jaundice, haemoglobinuria, severe anaemia (Hb <5 g/dL), hypoglycaemia (<2.2 mmol/L), metabolic acidosis, renal impairment. Any danger sign = SEVERE MALARIA = IV artesunate."},"Malaria, severe":{"setting":"Hospital (Emergency)","likely_pathogens":["Plasmodium falciparum"],"first_line":[["IV Artesunate","Adult: 2.4mg/kg IV at 0, 12, 24h then OD until oral tolerated (min 24h IV, 3 doses)  •  Paed: same 2.4mg/kg; <20kg give 3mg/kg per dose  [UCG 2023; WHO 2023 aligned]","A"],["Then complete with oral ACT","Adult: AL x 3d (start when tolerating orals)  •  Paed: AL weight-band x 3d  [UCG 2023]","A"]],"second_line":[["IM Artesunate (pre-referral)","Adult: 2.4mg/kg IM single dose then refer  •  Paed: same (pre-referral in community/HC II-III)  [UCG 2023; WHO pre-referral]","A"],["IM Artemether","Adult: 3.2mg/kg IM loading then 1.6mg/kg OD  •  Paed: same (if artesunate unavailable)  [UCG alternative]","A"],["IV Quinine (if artesunate unavailable)","Adult: 20mg/kg loading (over 4h) then 10mg/kg Q8h IV (max 1800mg/day)  •  Paed: same; monitor glucose Q4h  [UCG rescue; WHO: artesunate superior]","A"]],"avoid":"Oral ACT for severe malaria (unreliable absorption). Artesunate suppositories in adults (rectal route unreliable). IM quinine (erratic absorption). Delaying IV artesunate for any reason. Steroids (no benefit, harmful).","notes":"UCG 2023 and WHO 2023 fully aligned: IV artesunate is first-line for severe malaria (AQUAMAT trial, SEAQUAMAT trial: 35% mortality reduction vs quinine). Pre-referral: single IM artesunate or rectal artesunate suppository (children <6yr) at HC II/III before transfer. Monitor blood glucose Q4-6h (hypoglycaemia common, especially with quinine). Exchange transfusion NOT recommended (WHO 2023). Blood transfusion for severe anaemia (Hb <5 g/dL or Hb <7 with respiratory distress). Cerebral malaria: manage airway, treat seizures with diazepam, avoid lumbar puncture until stable.","recommended_tests":["Blood smear (thick + thin) with parasite count  [UCG mandatory]","Blood glucose (STAT and Q4-6h)","FBC (Hb, platelets, WBC)","U&E, creatinine (AKI)","LFTs, bilirubin","Blood lactate (if available)","Blood group + crossmatch","Urinalysis (haemoglobinuria)","Lumbar puncture if meningitis suspected (after CT if focal signs)"],"clinical_score":"WHO severity criteria (any one = severe): impaired consciousness (GCS <11 or BCS <3); prostration; multiple convulsions (>2 in 24h); acidosis (BE < -8); hypoglycaemia (<2.2 mmol/L); severe anaemia (Hb <5 or Hct <15%); renal impairment (creat >265); jaundice (bilirubin >50) with parasitaemia >100,000; pulmonary oedema/ARDS; significant bleeding; shock (SBP <80 adult, <70 child); parasitaemia >10%. Mortality untreated: 100%. IV artesunate: mortality 15-25%."},"HIV infection (ART initiation and regimens)":{"setting":"Community / Hospital","likely_pathogens":["HIV-1 (predominant in Uganda)","HIV-2 (rare)"],"first_line":[["TLD: Tenofovir + Lamivudine + Dolutegravir","Adult: TDF 300mg + 3TC 300mg + DTG 50mg PO OD (single FDC tablet)  •  Paed (>=20kg): TDF/3TC/DTG paediatric FDC OD; <20kg: ABC/3TC + DTG dispersible (10mg weight-band dosing)  [UCG 2023; WHO 2021 aligned]","A"]],"second_line":[["AZT + 3TC + ATV/r (2nd-line if failing TLD)","Adult: AZT 300mg BD + 3TC 150mg BD + ATV 300mg/r 100mg OD  •  Paed: AZT + 3TC + LPV/r (paediatric boosted PI-based 2nd line per UCG)  [UCG 2023]","A"],["TAF + 3TC + DTG (renal impairment)","Adult: TAF 25mg + 3TC 300mg + DTG 50mg OD (if TDF contraindicated: CrCl <50)  •  Paed: not yet standard  [WHO 2021]","A"],["DRV/r + 2 NRTIs (3rd-line)","Adult: DRV 600mg/r 100mg BD + optimised backbone based on resistance testing  •  Paed: DRV/r weight-band + 2 NRTIs  [UCG 2023 3rd-line; requires genotype resistance testing]","W"]],"avoid":"NVP-based regimens as first-line (phased out per WHO 2021 and UCG 2023; DTG superior). EFV in women planning pregnancy (UCG no longer restricts DTG in pregnancy). Stavudine (d4T; removed from all guidelines). Single-drug or dual-drug therapy. ART interruptions.","notes":"UCG 2023 fully aligned with WHO 2021 rapid ART recommendations: TLD (TDF/3TC/DTG) as preferred first-line for all adults and adolescents including pregnant women. Same-day ART initiation for all HIV+ patients without contraindications. WHO vs UCG difference: WHO 2021 recommends TAF as alternative NRTI backbone; UCG 2023 keeps TDF as standard (cost). Paediatric: UCG 2023 recommends ABC/3TC + DTG for children <20kg (WHO aligned). 3rd-line requires genotype resistance testing (available at CPHL Kampala). Viral load monitoring: 6 months, 12 months, then annually [UCG 2023]. TPT (INH 6 months or 3HP) for all PLHIV [UCG 2023; WHO TPT 2020].","recommended_tests":["HIV rapid test (serial algorithm: Determine then HIV 1/2 STAT-PAK)  [UCG 2023]","CD4 count (baseline; guides OI prophylaxis)","Viral load (baseline if available, then 6mo, 12mo, annually)","FBC, U&E, creatinine, LFTs (baseline)","Hepatitis B surface antigen (before ART; TDF covers HBV)","CrAg screening if CD4 <200  [UCG 2023; WHO 2022]","TB screening (symptom screen at every visit)","Pregnancy test (women of reproductive age)","Genotype resistance testing (before 3rd-line switch)"],"clinical_score":"WHO clinical staging: Stage 1 (asymptomatic) to Stage 4 (AIDS-defining illness). Start ART regardless of stage or CD4 [UCG 2023; WHO 2021]. Treatment failure: virological (VL >1000 copies/mL on 2 consecutive measurements 3 months apart with adherence support). Switch to 2nd-line only after confirmed virological failure with documented adherence [UCG 2023]."},"Pneumocystis jirovecii pneumonia (PCP)":{"setting":"Hospital","likely_pathogens":["Pneumocystis jirovecii (fungus, previously P. carinii)"],"first_line":[["Co-trimoxazole (high-dose)","Adult: TMP 15-20mg/kg/day + SMX 75-100mg/kg/day PO/IV div Q6-8h x 21d (typically 4 DS tabs TDS)  •  Paed: TMP 15-20mg/kg/day PO/IV div Q6-8h x 21d  [UCG 2023; WHO OI 2021]","A"],["+ Prednisolone (if PaO2 <70 or SpO2 <92%)","Adult: 40mg BD x 5d, then 40mg OD x 5d, then 20mg OD x 11d  •  Paed: 1mg/kg BD x 5d then taper  [UCG 2023; WHO OI 2021; NIH OI aligned]","A"]],"second_line":[["Clindamycin + Primaquine","Adult: Clindamycin 600mg IV Q8h + Primaquine 30mg PO OD x 21d  •  Paed: Clindamycin 10mg/kg Q6h + Primaquine 0.3mg/kg OD (check G6PD)  [WHO OI 2021; NIH OI: if sulfa allergy]","A+A"],["Dapsone + Trimethoprim","Adult: Dapsone 100mg PO OD + TMP 15mg/kg/day PO div TDS x 21d  •  Paed: Dapsone 2mg/kg OD + TMP 15mg/kg/day (mild PCP, sulfa intolerant)  [NIH OI]","A"],["IV Pentamidine (severe, sulfa allergy)","Adult: 4mg/kg IV OD x 21d  •  Paed: 4mg/kg IV OD x 21d (nephrotoxic, hypoglycaemia: monitor closely)  [NIH OI: last resort]","W"]],"avoid":"Delaying steroids if hypoxic (must start within 72h of antibiotics). Stopping co-trimoxazole prophylaxis before immune reconstitution. Atovaquone in severe PCP (only for mild). Pentamidine nebulised for treatment (prophylaxis only).","notes":"UCG 2023 and WHO OI 2021 aligned: high-dose co-trimoxazole x 21d + steroids if hypoxic. NIH OI Guidelines (USA) identical. PCP prophylaxis: co-trimoxazole 960mg OD (adults) or 480mg OD, continue until CD4 >200 for >=6 months on ART [UCG 2023; WHO]. Secondary prophylaxis same dose until immune reconstitution. Diagnosis: CXR bilateral interstitial infiltrates + desaturation on exertion + elevated LDH + low CD4 (<200). Induced sputum or BAL for definitive diagnosis (IF stain, PCR). Start empirical treatment if clinical suspicion high.","recommended_tests":["CXR (bilateral perihilar ground-glass infiltrates)","SpO2 at rest and on exertion (6-min walk desaturation)","ABG if available (PaO2 <70 mmHg = steroids indicated)","FBC, U&E, LFTs","LDH (typically elevated >500; non-specific)","CD4 count","Induced sputum for PCP (IF stain or Grocott)","BAL if sputum non-diagnostic","Beta-D-glucan (if available; sensitive but non-specific)"],"clinical_score":"Severity: Mild (SpO2 >92% RA, PaO2 >70) = oral co-trimoxazole outpatient possible. Moderate-Severe (SpO2 <92% or PaO2 <70) = IV co-trimoxazole + steroids + admit. Very severe (ICU, intubation) = IV co-trimoxazole + steroids + consider pentamidine if no response at 5-7d."},"Oral and oesophageal candidiasis":{"setting":"Community / Hospital","likely_pathogens":["Candida albicans (most common)","Candida glabrata (fluconazole-resistant)","Candida tropicalis","Candida krusei (intrinsically fluconazole-resistant)"],"first_line":[["Oral thrush: Nystatin or Miconazole oral","Adult: Nystatin 500,000 IU oral suspension, swish and swallow QDS x 7-14d OR Miconazole oral gel 2.5mL QDS x 7d  •  Paed: Nystatin 100,000 IU QDS after feeds x 7d OR Miconazole gel 1.25mL (<2yr) or 2.5mL (>=2yr) QDS  [UCG 2023]","A"],["Oesophageal: Fluconazole","Adult: 200mg PO OD x 14-21d (loading 400mg D1)  •  Paed: 6mg/kg OD x 14-21d (max 400mg; loading 12mg/kg D1)  [UCG 2023; WHO OI 2021 aligned]","A"]],"second_line":[["Fluconazole (oral thrush refractory)","Adult: 100-200mg PO OD x 7-14d  •  Paed: 3-6mg/kg OD x 7-14d  [UCG 2023 if nystatin fails]","A"],["Itraconazole oral solution","Adult: 200mg PO OD x 14-21d (swish and swallow; better absorption than capsules)  •  Paed: 5mg/kg OD (max 200mg)  [WHO OI; if fluconazole-resistant]","W"],["Voriconazole","Adult: 200mg PO BD x 14d  •  Paed: 9mg/kg BD (if fluconazole + itraconazole resistant)  [NIH OI]","W"],["IV Amphotericin B (severe, refractory)","Adult: 0.3-0.7mg/kg IV OD x 7-14d  •  Paed: same  [WHO OI: last resort for refractory oesophageal]","W"]],"avoid":"Ketoconazole (hepatotoxic; removed from WHO Essential Medicines List for systemic use). Fluconazole in 1st trimester pregnancy if possible (teratogenic at high doses). Prolonged fluconazole without addressing underlying immunodeficiency (drives azole resistance).","notes":"UCG 2023 aligned with WHO OI 2021. Oral thrush: topical nystatin/miconazole first-line; fluconazole if refractory. Oesophageal candidiasis: fluconazole is diagnostic and therapeutic (empiric trial x 14d; no endoscopy needed if clinical response). WHO vs UCG: no significant differences. Oesophageal candidiasis is a WHO Stage 4 AIDS-defining illness. Start ART if not already on it. Secondary prophylaxis with fluconazole 100-200mg OD only if recurrent; discontinue when CD4 >200 x 6 months.","recommended_tests":["Clinical diagnosis (oral thrush: white plaques on erythematous base, removable)","CD4 count","HIV test (oesophageal candidiasis = test for HIV)","Endoscopy only if no response to empiric fluconazole at 7d","Fungal culture + susceptibility if recurrent/refractory"],"clinical_score":"Oral thrush grading: mild (few plaques, asymptomatic) = topical. Moderate (widespread, mild dysphagia) = fluconazole. Severe (oropharynx + dysphagi
